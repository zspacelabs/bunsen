[book]
title = "The Bunsen Book"
authors = ["The Bunsen Contributors"]
description = "A batteries-included community standard library for the burn tensor framework."
language = "en"
src = "src"

[rust]
edition = "2024"

[build]
build-dir = "book"
create-missing = false

# ── preprocessors ─────────────────────────────────────────────────────────────

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.katex]
after = ["links"]
macros = "./katex-macros.txt"

# ── API links ─────────────────────────────────────────────────────────────────
# Link to the API with rustdoc intra-doc paths, not URLs:
#
#     [`ShapeContract`](bunsen::contracts::ShapeContract)
#
# mdbook-rustdoc-links builds the listed packages with `cargo doc` and lets
# rustdoc resolve every such link, so a renamed or moved item is an error
# (under `CI`, or with `cargo make book-check`), not a dead link.
#
# The base URL is chosen per build:
# - `dev` (default): `/api`, a symlink `book/src/api -> target/doc`; the book
#   links into the local API docs from HEAD (`cargo make book`).
# - `release` (when `CI` is set): docs.rs, pinned to each crate's version
#   (`cargo make book-release`).
# `MDBOOK_PREPROCESSOR__RUSTDOC_LINKS__BASE_URL` overrides both.
#
# The first build stage takes bunsen's features from its
# `[package.metadata.docs.rs]` (`docs-rs = true`), so the book resolves links
# against exactly what docs.rs serves. `docs-rs` accepts one package per
# stage, hence a second stage for the other crates. A link resolved by any
# stage counts.
[preprocessor.rustdoc-links]
after = ["links"]
unstable-features = true
base-url.dev = "/api"
base-url.release = "https://docs.rs/{pkg_name}/{version}"

[[preprocessor.rustdoc-links.build]]
packages = ["bunsen"]
docs-rs = true

[[preprocessor.rustdoc-links.build]]
packages = [
    "bunsen-bundled-silero",
    "bunsen-bundled-whisper",
    "bunsen-firehose",
    "bunsen-firehose-image",
    "bunsen-arrow-dataloaders",
]

# ── HTML output ───────────────────────────────────────────────────────────────

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/zspacelabs/bunsen"
edit-url-template = "https://github.com/zspacelabs/bunsen/edit/main/book/src/{path}"
# The book is published at https://zspacelabs.ai/bunsen/book/ (see
# CONTRIBUTING.md, "Release").
site-url = "/bunsen/book/"
additional-js = ["mermaid.min.js", "mermaid-init.js"]
additional-css = []
no-section-label = false
mathjax-support = false

# Book code blocks use bunsen, which the Rust playground cannot build.
[output.html.playground]
runnable = false

[output.html.print]
enable = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 3

# ── linkcheck ─────────────────────────────────────────────────────────────────
# mdbook-linkcheck2 is a backend (not a preprocessor) that runs on
# `mdbook build`. It is the mdbook-0.5-compatible fork of mdbook-linkcheck. It
# checks links between book files (not `#anchors`); web links are not followed.

[output.linkcheck2]
command = "mdbook-linkcheck2"
follow-web-links = false
traverse-parent-directories = false
exclude = [
    # API links; mdbook-rustdoc-links has already resolved them. The `api`
    # symlink points outside the book root, which linkcheck2 rejects.
    '^(\.\./)*api/',
]
warning-policy = "warn"
cache-timeout = 86400
