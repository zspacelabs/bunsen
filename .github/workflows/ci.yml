name: Rust

on:
  push:
    branches: [ "main" ]
  # Every pull request, whatever its base: a layer of a stack targets the
  # layer below it, not main, and gets its checks while it waits.
  pull_request:
    # `labeled` and `unlabeled` for the `ci-light` label, which skips the
    # `test` job: a pull request in the middle of a stack carries it, so a
    # rebase of the stack does not run every layer's full build at once. Its
    # Format, Clippy and Book still run; the `test` job runs when the label
    # comes off, as it does when the layer is retargeted to main before it
    # merges. A skipped job passes a required check, so the label comes off
    # before a merge.
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

# A push to a pull request cancels that pull request's run still in
# progress, as does adding or removing `ci-light`; each push to main runs in
# a group of its own, and is never cancelled. Another label's event is a
# group of its own too, which cancels nothing, and its jobs all skip.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-light' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info is most of what a dev build writes: most of `target/` (25 GB
  # in the `test` job with full debug info) and much of the link time, and
  # kache stores every miss a second time. Line tables keep the file and
  # line of each frame in a test's backtrace. A change here changes every
  # kache key: bump the `cache-key-prefix`es below with it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: Format
    # Not for another label's event.
    if: ${{ !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-light') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      # No cache: `cargo fmt` parses, it does not compile.
      - run: cargo +nightly fmt -- --check

  clippy:
    name: Clippy
    # Not for another label's event.
    if: ${{ !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-light') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A private module's `//!` never renders in rustdoc; prose there is
      # invisible and rots unchecked (STYLE.md, "Module docs must render").
      - name: Module docs must render
        run: python3 tools/check_hidden_module_docs.py crates validation
      # `validation/Cargo.lock` is the validation workspace's own: every
      # package bunsen's crates reach in it must be the version `Cargo.lock`
      # has, or the suites test a dependency set this workspace never builds.
      # It reads the two lockfiles; nothing in `validation/` is built.
      - name: Lockfiles agree
        run: python3 tools/check_validation_lock.py
      - run: rustup toolchain install stable --profile minimal --component clippy
      # `bunsen-tool asr live` captures through `cpal`, whose Linux backend
      # links ALSA.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # The caches as in the `test` job, which explains them. Clippy compiles
      # the whole dependency graph; kache keeps it under a key prefix of its
      # own, because clippy's outputs are check-only metadata the `test` job
      # cannot use.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: 1.2.1
          cache-key-prefix: kache3-clippy
          cache-executables: false
          pr-comment: false
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --no-deps -- -D warnings

  book:
    name: Book
    # Not for another label's event.
    if: ${{ !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-light') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      # mdbook-rustdoc-links runs `cargo doc` and `cargo check` on the crates
      # the book links into (`book/book.toml`). The caches as in the `test`
      # job, which explains them, under a kache key prefix of its own;
      # `book.yml` restores this job's store.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: 1.2.1
          cache-key-prefix: kache3-book
          cache-executables: false
          pr-comment: false
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      # Keep these versions in step with `Makefile.toml`'s `ensure-mdbook-*`.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4,mdbook-katex@0.10.0,mdbook-mermaid@0.17.1,mdbook-linkcheck2@0.13.0,mdbook-rustdoc-links@3.0.2
      # GitHub sets `CI`, so every API link must resolve (a renamed or moved
      # item fails here, in the PR that renamed it), and links are emitted
      # against docs.rs. linkcheck2 then checks links between book files.
      - name: Build the book
        run: mdbook build book

  test:
    name: CI
    # Not on a pull request labelled `ci-light`, nor for another label's
    # event.
    if: >-
      ${{ !((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
            github.event.label.name != 'ci-light') &&
          !contains(github.event.pull_request.labels.*.name, 'ci-light') }}
    runs-on: ubuntu-latest
    # kache posts its cache report as one PR comment, updated in place.
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Checkout comes first: the cache keys below hash files in the tree, and
      # `hashFiles` over an empty workspace returns the empty string — which
      # silently degrades a key to a constant that never invalidates and, once
      # written, is never updated again.
      - name: Checkout repository
        uses: actions/checkout@v4

      # The image ships SDKs no step here uses: Android's, .NET, GHC and
      # CodeQL's bundle, about 30 GB. The build, with kache's store beside
      # it, needs the room when it misses most of the store: a full disk
      # fails a step with "No space left on device", or the linker with a
      # bus error.
      - name: Free disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Toolchain
        run: rustup toolchain install stable --profile minimal

      # `bunsen-tool asr live` captures through `cpal`, whose Linux backend
      # links ALSA.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # Two caches, split by what they hold:
      #
      # - rust-cache keeps `~/.cargo` only (`cache-targets: false`): the
      #   registry and the downloaded crate sources, so cargo does not fetch
      #   them each run. It is the only cache of those paths: a hand-rolled
      #   `actions/cache` over them fights it, and caching `~/.cargo/bin` can
      #   shadow the toolchain the previous step just installed.
      # - kache (https://github.com/kunobi-ninja/kache), as RUSTC_WRAPPER,
      #   keeps every compiled unit, dependencies included, in its store,
      #   which it saves to the GitHub Actions cache. It skips binaries and
      #   test executables (`cache-executables: false`): they are the
      #   workspace's own, which miss on most changes, and each is large.
      #
      # kache's store key holds its version and the Cargo.lock hash. An
      # Actions cache entry is immutable, so the store is written once per
      # lockfile: right for dependencies, which change only with it; the
      # workspace crates in it are those of the first run on that lockfile.
      # On a new lockfile it starts from the newest older store. The action
      # skips itself, and the build runs uncached, if it cannot fetch kache.
      #
      # Only pushes to main save either cache; pull requests restore them.
      # A pull request's run can restore only caches saved from its own
      # branch or from main, and the repository's caches share 10 GB, the
      # least recently used evicted first: stores saved from several open
      # pull requests (about 4.5 GB each, across the jobs) would evict
      # main's, and each other's.
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: kache
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: 1.2.1
          cache-key-prefix: kache3-test
          cache-executables: false
          pr-comment: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # No build script here reaches the network: the crates that fetch model
      # assets are in the `validation/` workspace, which no job here builds.
      # Silero's and Whisper's suites run in `validation.yml`, when asked; the
      # rest run by hand, on a GPU (STYLE.md, "Network access").

      # An explicit list rather than `--all-features`: `cuda` pulls in an
      # LLVM-based compiler toolchain, and `metal` builds only on macOS.
      - name: Docs
        run: cargo doc --no-deps --features indicatif,wgpu,vulkan

      # The step above documents the whole workspace, so Cargo unifies features
      # across members and a link can resolve there that breaks for one crate
      # alone. docs.rs builds each crate alone, with the feature list in its
      # `[package.metadata.docs.rs]`; these two steps reproduce that for every
      # crate that has one, and bunsen's plain default-features build.
      - name: Docs (docs.rs configuration)
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.metadata.docs.rs.features)
                     | "\(.name) \(.metadata.docs.rs.features | join(","))"' \
            | while read -r crate features; do
                echo "::group::$crate"
                cargo doc -p "$crate" --no-deps --features "$features"
                echo "::endgroup::"
              done

      - name: Docs (default features)
        run: cargo doc -p bunsen --no-deps

      # The runner has no GPU. `BURN_DEVICE` pins burn's default device, and
      # with it `performance_device()`, to the CPU, whatever backend features
      # the workspace build unifies in.
      - name: Build and Test
        run: cargo test --features indicatif
        env:
          BURN_DEVICE: flex

      - name: No default features build.
        run: cargo test -p bunsen --no-default-features

      # The step above still enables `testing` and `audit`, through bunsen's
      # dev-dependency on itself, and with them `std`, `audio`, `tokenizer`
      # and `flex`. This one builds the library with no features at all.
      - name: No features at all.
        run: cargo check -p bunsen --no-default-features

      # Each feature alone, so a feature that leans on another it does not
      # name (an import used only under a sibling feature, a gate that names
      # the wrong one) fails here. Not the backends: they only pass through
      # to burn, `cuda` pulls in an LLVM-based toolchain, and `metal` builds
      # only on macOS.
      - name: Each feature alone.
        run: |
          features=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "bunsen") | .features | keys[]
                     | select(. != "default" and (IN("cuda", "metal", "vulkan", "wgpu", "flex") | not))')
          for feature in $features; do
            echo "::group::$feature"
            cargo check -p bunsen --no-default-features --features "$feature"
            echo "::endgroup::"
          done

      # `cargo publish` verifies each crate outside the workspace, with only
      # its own dependencies. Every other step here builds several crates at
      # once, and Cargo unifies their features, so a crate that forgets a
      # feature still builds as long as a sibling turns it on. That is how
      # `bunsen-firehose` relied on `bunsen` enabling `burn/std` and failed to
      # publish at v0.31.0. One `cargo check` per crate reproduces the isolated
      # resolution; several `-p` flags in one invocation would unify again.
      # Each crate checks its library and its binaries, whichever it has
      # (`bunsen-tool` has both).
      - name: Published crates build in isolation
        run: |
          for manifest in crates/public/*/Cargo.toml; do
            dir="$(dirname "$manifest")"
            if [ -f "$dir/src/lib.rs" ]; then
              cargo check --manifest-path "$manifest" --lib
            fi
            if [ -f "$dir/src/main.rs" ] || [ -d "$dir/src/bin" ]; then
              cargo check --manifest-path "$manifest" --bins
            fi
          done

      # The disk left after the build, with kache's store beside `target/`.
      - name: Disk after the build
        if: always()
        run: |
          df -h /
          du -sh target ~/.cache/kache 2>/dev/null || true
