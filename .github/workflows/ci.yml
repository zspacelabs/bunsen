name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      # No cache: `cargo fmt` parses, it does not compile.
      - run: cargo +nightly fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      # Clippy compiles the whole dependency graph; without this it starts
      # cold on every run.
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --no-deps -- -D warnings

  test:
    name: CI
    runs-on: ubuntu-latest

    steps:
      # Checkout comes first: the cache keys below hash files in the tree, and
      # `hashFiles` over an empty workspace returns the empty string — which
      # silently degrades a key to a constant that never invalidates and, once
      # written, is never updated again.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: rustup toolchain install stable --profile minimal

      # Covers `~/.cargo` and `target/`, keyed on the lockfile and the
      # toolchain. This is the only cargo cache: a hand-rolled `actions/cache`
      # over the same paths fights it, and caching `~/.cargo/bin` can shadow
      # the toolchain the previous step just installed.
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # `bunsen-bundled-whisper`'s build script fetches ~435 MB of assets into
      # its `OUT_DIR` (STYLE.md, "Fetched assets live in `OUT_DIR`"). rust-cache
      # prunes workspace crates before saving, so a cold run fetches them again.
      # That is accepted rather than cached: `cache-workspace-crates: true`
      # would also cache the workspace's own build artifacts, test binaries
      # included, and an `actions/cache` over an `OUT_DIR` path goes stale as
      # soon as the hash in that path changes.

      - name: Docs
        run: cargo doc --no-deps --all-features

      - name: Build and Test
        run: cargo test --features download

      - name: No default features build.
        run: cargo test -p bunsen --no-default-features
