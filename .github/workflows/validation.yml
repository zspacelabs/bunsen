name: Validation

# Silero's and Whisper's whole validation suites, ONNX cross-checks included,
# on the CPU: the models small enough for a runner (~730 MB of assets, all
# cached between runs). The other families' assets run to GBs; they run by
# hand, on a GPU (STYLE.md, "Network access").
#
# Never by default: run it from the Actions tab, or put the `validate` label on
# a pull request, which runs it then and on every push after while the label
# stays.
on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    types: [ labeled, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The runner has no GPU: pin burn's default device, and with it
  # `performance_device()`, to the CPU.
  BURN_DEVICE: flex

jobs:
  cpu:
    name: CPU validation
    # On a pull request, only with the label, and not for another label being
    # added.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'validate') &&
       (github.event.action != 'labeled' || github.event.label.name == 'validate'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Toolchain
        run: rustup toolchain install stable --profile minimal

      # `~/.cargo` only, read from the `test` job's entries; see `ci.yml`.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-targets: false
          save-if: false

      # The bundled crates' build scripts take each pinned file from
      # `BUNSEN_ASSET_CACHE`, by its SHA-256, before fetching it, and keep what
      # they fetch there (`bunsen_fetch::BUNSEN_ASSET_CACHE`). A path there
      # never changes with the toolchain or the lockfile, as an `OUT_DIR` path
      # does, so the cache does not go stale: the key changes only with the
      # pins, and an older entry restores what is still pinned.
      #
      # A pull request's saved entry is its own; one saved by a run on `main`
      # (dispatched from the Actions tab) is every pull request's.
      - name: Asset cache directory
        run: echo "BUNSEN_ASSET_CACHE=$HOME/.cache/bunsen-assets" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/bunsen-assets
          key: bunsen-assets-v1-${{ hashFiles('crates/public/bunsen-bundled-*/build.rs') }}
          restore-keys: bunsen-assets-v1-

      - name: Validate Silero and Whisper
        run: |
          cargo test --release -p silero-model-validation --features download,gpu-tests
          cargo test --release -p whisper-model-validation --features download,gpu-tests

      # What a restored older entry still holds of a pin since replaced: drop
      # every file no build script pins, so the saved entry is only what is.
      - name: Prune unpinned assets
        run: |
          pins=$(grep -ho '"[0-9a-f]\{64\}"' crates/public/bunsen-bundled-*/build.rs | tr -d '"' | sort -u)
          for f in "$BUNSEN_ASSET_CACHE"/*; do
            [ -e "$f" ] || continue
            grep -qx "$(basename "$f")" <<< "$pins" || { echo "pruning $(basename "$f")"; rm -f "$f"; }
          done
          du -sh "$BUNSEN_ASSET_CACHE"
