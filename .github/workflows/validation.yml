name: Validation

# The stream drivers, on the smallest models, on the CPU: the `ci` profile
# (`validation/profiles/ci.yml`), each driver held to its model's own one-shot
# decode (~0.6 GB of checkpoints, cached between runs). How a model behaves
# against its reference is the validate targets', run by hand, on a GPU
# (STYLE.md, "Network access").
#
# Never by default: run it from the Actions tab, or put the `validate` label on
# a pull request, which runs it then and on every push after while the label
# stays.
on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    types: [ labeled, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The runner has no GPU: pin burn's default device, and with it
  # `performance_device()`, to the CPU.
  BURN_DEVICE: flex

jobs:
  cpu:
    name: CPU validation
    # On a pull request, only with the label, and not for another label being
    # added.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'validate') &&
       (github.event.action != 'labeled' || github.event.label.name == 'validate'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Toolchain
        run: rustup toolchain install stable --profile minimal

      # `~/.cargo` only, read from the `test` job's entries; see `ci.yml`.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-targets: false
          save-if: false

      # The profile runs through `cargo nextest` (the validation workspace
      # alone), chosen by `validate.py`, which reads YAML.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: PyYAML
        run: sudo apt-get install -y python3-yaml

      # The tests fetch the checkpoints themselves, through bunsen's pinned
      # rows, into the weights cache: kept here, keyed by the rows' pins.
      - name: Weights cache directory
        run: echo "BUNSEN_CACHE_DIR=$HOME/.cache/bunsen-weights" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/bunsen-weights
          key: bunsen-weights-v1-${{ hashFiles('crates/public/bunsen/src/kits/speech/whisper/pretrained/**', 'crates/public/bunsen/src/kits/speech/silero_vad/pretrained/**', 'crates/public/bunsen/src/kits/speech/parakeet/pretrained/**', 'crates/public/bunsen/src/kits/speech/qwen3_asr/pretrained/**') }}
          restore-keys: bunsen-weights-v1-

      - name: Validate the drivers
        run: python3 validation/tools/validate.py run --profile ci --backend flex
