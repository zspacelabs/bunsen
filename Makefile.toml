[config]
default_to_workspace = false

[tasks.default]
dependencies = [
    "fix",
    "ci",
    "doc",
]

[tasks.doc]
description = "Build the workspace API docs, then each crate's docs.rs configuration"
command = "cargo"
args = ["doc", "--no-deps"]
dependencies = ["doc-docsrs"]

[tasks.doc-docsrs]
description = "Build each crate's API docs alone, with the feature list docs.rs uses"
script = '''
cargo metadata --no-deps --format-version 1 \
  | jq -r '.packages[] | select(.metadata.docs.rs.features)
           | "\(.name) \(.metadata.docs.rs.features | join(","))"' \
  | while read -r crate features; do
      cargo doc -p "$crate" --no-deps --features "$features"
    done
'''

[tasks.setup]
dependencies = ["ensure-mdbook-suite", "ensure-ryl"]

# ── individual tasks ──────────────────────────────────────────────────────────

[tasks.check-format]
description = "Check formatting (nightly rustfmt)"
workspace = false
toolchain = "nightly"
install_crate = "rustfmt"
command = "cargo"
args = ["fmt", "--check"]

[tasks.format]
description = "Apply formatting (nightly rustfmt)"
workspace = false
toolchain = "nightly"
install_crate = "rustfmt"
command = "cargo"
args = ["fmt"]

[tasks.check-yaml]
description = "Check the YAML: formatted as ryl writes it, and within its lint rules (`.ryl.toml`)"
dependencies = ["ensure-ryl"]
script = '''
ryl format --check .
ryl check .
'''

[tasks.format-yaml]
description = "Format the YAML as ryl writes it (`.ryl.toml`)"
dependencies = ["ensure-ryl"]
command = "ryl"
args = ["format", "."]

[tasks.clippy]
description = "Lint (treat warnings as errors)"
command = "cargo"
args = ["clippy", "--no-deps"]

[tasks.clippy-fix]
description = "AutoFix Lint (treat warnings as errors)"
command = "cargo"
args = ["clippy", "--fix", "--allow-staged", "--allow-dirty", "--no-deps"]

[tasks.test]
description = "Test with default features"
workspace = false
command = "cargo"
args = ["test", "--workspace"]

[tasks.check-validation]
description = "The validation workspace with its default features: lock, format, clippy, tests (local only, never in CI)"
workspace = false
env = { BURN_DEVICE = "flex" }
script = '''
python3 tools/check_validation_lock.py
cargo +nightly fmt --manifest-path validation/Cargo.toml -- --check
cargo clippy --manifest-path validation/Cargo.toml --no-deps -- -D warnings
cargo test --manifest-path validation/Cargo.toml
'''

# ── validation ────────────────────────────────────────────────────────────────
#
# The validation crates (`validation/models/*`) cross-check each model against
# its reference. None of this runs in `ci` or `test`: their build scripts fetch
# the assets they compare (STYLE.md, "Network access"), so each run here is
# asked for by name.
#
# `validate-cpu` is Silero's and Whisper's checks on the checkpoints alone (~150
# MB), on the CPU. `validate-ci` is what `validation.yml` runs when asked: the
# stream drivers on the smallest models, on the CPU (the `ci` profile, ~0.6
# GB). `validate-<model>` is a model's whole suite, ONNX reference included
# (GBs on a cold cache), on `VALIDATION_BACKEND` (default `wgpu`; or `vulkan`,
# `cuda`, `metal`).
#
# `BUNSEN_ASSET_CACHE`, set to a directory, keeps every fetched asset there by
# its digest, so a `cargo clean` or a new toolchain does not fetch it again.
#
# `validate` runs every crate under a profile (`VALIDATION_PROFILE`, else `BUNSEN_VALIDATE_PROFILE`, else
# `small-core`): the models it chooses, their tests alone, through
# `cargo validate` (`validation/tools/validate`, a Rust tool: no Python), under
# the validation workspace's `validate` cargo profile (release's optimization,
# with debug assertions). Their checkpoints are
# fetched by the tests into the weights cache. `validation/README.md`,
# "Choosing what to validate".

[tasks.validate]
description = "The validation crates under a profile (VALIDATION_PROFILE, default small-core)"
workspace = false
script = '''
cd validation && cargo validate run --profile "${VALIDATION_PROFILE:-${BUNSEN_VALIDATE_PROFILE:-small-core}}" ${VALIDATION_BACKEND:+--backend "$VALIDATION_BACKEND"} ${VALIDATION_DTYPES:+--dtypes "$VALIDATION_DTYPES"}
'''

[tasks.validate-cpu]
description = "Silero's and Whisper's checks on the checkpoints alone, on the CPU: no reference graph, no backend (fetches ~150 MB into the weights cache)"
workspace = false
env = { BURN_DEVICE = "flex" }
script = '''
cargo test --manifest-path validation/Cargo.toml -p silero-model-validation --features checkpoints
cargo test --manifest-path validation/Cargo.toml -p whisper-model-validation --features checkpoints
'''

[tasks.validate-ci]
description = "The stream drivers on the smallest models, on the CPU, as validation.yml runs them: the ci profile (fetches ~0.6 GB)"
workspace = false
env = { BURN_DEVICE = "flex" }
script = "cd validation && cargo validate run --profile ci --backend flex"

[tasks.validate-silero]
description = "Silero VAD's whole validation suite (fetches ~4 MB)"
workspace = false
script = "cd validation && cargo validate run --crate silero --profile large-all --backend ${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-whisper]
description = "Whisper's whole validation suite (fetches ~725 MB)"
workspace = false
script = "cd validation && cargo validate run --crate whisper --profile large-all --backend ${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-parakeet]
description = "Parakeet's whole validation suite, every model (fetches ~5 GB, the checkpoints into the weights cache)"
workspace = false
script = "cd validation && cargo validate run --crate parakeet --profile large-all --backend ${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-qwen3-asr]
description = "Qwen3-ASR's whole validation suite, every model (fetches ~6.7 GB, the checkpoints into the weights cache)"
workspace = false
script = "cd validation && cargo validate run --crate qwen3-asr --profile large-all --backend ${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-qwen3]
description = "Qwen3's whole validation suite, every model (fetches ~24 GB into the weights cache)"
workspace = false
script = "cd validation && cargo validate run --crate qwen3 --profile large-all --backend ${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-sortformer]
description = "Sortformer's whole validation suite (fetches ~3 GB, and the ASR checkpoints it scores with)"
workspace = false
script = "cd validation && cargo validate run --crate sortformer --profile large-all --backend ${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-voxtral]
description = "Voxtral Realtime's whole validation suite (fetches ~28 GB)"
workspace = false
script = "cd validation && cargo validate run --crate voxtral --profile large-all --backend ${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-nanochat]
description = "nanochat's whole validation suite, every model, on VALIDATION_BACKEND in f32 and, on cuda, in bf16 too (fetches ~10 GB into the weights cache)"
workspace = false
script = "cd validation && cargo validate run --crate nanochat --profile large-all --backend ${VALIDATION_BACKEND:-wgpu} --dtypes f32,bf16"

[tasks.validate-all]
description = "Every model's whole validation suite (fetches ~70 GB on a cold cache)"
workspace = false
dependencies = [
    "validate-silero",
    "validate-whisper",
    "validate-parakeet",
    "validate-qwen3-asr",
    "validate-qwen3",
    "validate-sortformer",
    "validate-voxtral",
    "validate-nanochat",
]

# ── cards ─────────────────────────────────────────────────────────────────────
#
# The models card in README.md, crates/public/bunsen/README.md and
# crates/public/bunsen-tool/README.md: `bunsen-tool summary`, the builds the
# factories list, by command, contract and publisher. A new or changed row changes it.

[tasks.cards]
description = "Rebuild the models card in the READMEs (bunsen-tool summary)"
workspace = false
script = "python3 tools/update_cards.py"

[tasks.cards-check]
description = "Fail if a README's models card is stale"
workspace = false
script = "python3 tools/update_cards.py --check"

# ── exercise ──────────────────────────────────────────────────────────────────
#
# `bunsen-tool`, built in release mode for one GPU backend, over a real clip:
# what a user runs, end to end, rather than a test. For a local machine with an
# accelerator, never CI: `exercise-all` fetches every model into the weights
# cache (tens of GB). The backend is required, as the task's argument:
#
#   cargo make exercise-defaults metal
#   cargo make exercise-all cuda --only whisper
#
# `tools/exercise_asr.toml` holds the default-model cases; `tools/exercise_asr.py`
# runs them, scores each transcript against the clip's, and writes a report to
# `target/exercise/`.

[tasks.exercise-defaults]
description = "Every ASR kit with its default model, on BACKEND (wgpu, vulkan, cuda, metal): each family, profile, the VAD gate, the diarizer"
workspace = false
command = "python3"
args = ["tools/exercise_asr.py", "defaults", "${@}"]

[tasks.exercise-all]
description = "Every model every ASR family and the diarizer list, on BACKEND (wgpu, vulkan, cuda, metal); fetches tens of GB"
workspace = false
command = "python3"
args = ["tools/exercise_asr.py", "all", "${@}"]

# ── convenience composites ────────────────────────────────────────────────────

[tasks.fix]
dependencies = [
    "clippy-fix",
    "format",
    "format-yaml",
]

[tasks.tests-all]
description = "All test variants (default, ahash, no_std)"
dependencies = ["test"]

[tasks.ci]
description = "Full CI validation (mirrors GitHub Actions)"
dependencies = [
    "check-format",
    "check-yaml",
    "clippy",
    "tests-all",
]

# ── mdBook ────────────────────────────────────────────────────────────────────

# Every book task keeps cargo's legacy build-dir layout
# (`__CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT`), as the workflows'
# book builds do: mdbook-rustdoc-links 3.0.2 gives rustdoc one library
# directory per crate, and under the per-unit layout (cargo 1.100's default)
# that misses the units a crate was built against, so no API link resolves.
# The opt-out goes when the tool handles the per-unit layout; cargo plans to
# remove it.

[tasks.book]
description = "Build the mdBook in ./book, linking into local API docs (book/src/api)"
dependencies = ["ensure-mdbook-suite"]
cwd = "book"
env = { __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT = "1" }
command = "mdbook"
args = ["build"]

[tasks.book-check]
description = "Build the book as CI does: every unresolved API link is an error"
extend = "book"
env = { __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT = "1", MDBOOK_PREPROCESSOR__RUSTDOC_LINKS__FAIL_ON_WARNINGS = "always" }

[tasks.book-release]
description = "Build the book for publishing: API links pinned to this version on docs.rs"
extend = "book"
env = { __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT = "1", CI = "1", MDBOOK_OUTPUT__HTML__SITE_URL = "/bunsen/book/" }

[tasks.book-serve]
description = "Serve the mdBook locally with live reload"
dependencies = ["ensure-mdbook-suite"]
cwd = "book"
env = { __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT = "1" }
command = "mdbook"
args = ["serve", "--open"]

[tasks.book-clean]
description = "Remove the mdBook build output"
dependencies = ["ensure-mdbook-suite"]
cwd = "book"
command = "mdbook"
args = ["clean"]

[tasks.ensure-mdbook-suite]
dependencies = [
    "ensure-mdbook",
    "ensure-mdbook-katex",
    "ensure-mdbook-linkcheck2",
    "ensure-mdbook-mermaid",
    "ensure-mdbook-rustdoc-links",
]

# `cargo install` without `--force` is a no-op when the pinned version is
# already installed, and replaces any other installed version.

[tasks.ensure-mdbook]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook", "--version", "0.5.4", "--locked"]

[tasks.ensure-mdbook-katex]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-katex", "--version", "0.10.0", "--locked"]

[tasks.ensure-mdbook-linkcheck2]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-linkcheck2", "--version", "0.13.0", "--locked"]

[tasks.ensure-mdbook-mermaid]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-mermaid", "--version", "0.17.1", "--locked"]

[tasks.ensure-mdbook-rustdoc-links]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-rustdoc-links", "--version", "3.0.2", "--locked"]

# ── ryl ───────────────────────────────────────────────────────────────────────

# ryl's prebuilt binary, through cargo-binstall: a no-op when the pinned
# version is installed. Keep the version in step with ci.yml's.
[tasks.ensure-ryl]
toolchain = "stable"
install_crate = { crate_name = "cargo-binstall", binary = "cargo-binstall", test_arg = "-V" }
command = "cargo"
args = ["binstall", "ryl@0.29.0", "--no-confirm", "--disable-strategies", "compile"]
