[config]
default_to_workspace = false

[tasks.default]
dependencies = [
    "fix",
    "ci",
    "doc",
]

[tasks.doc]
command = "cargo"
args = ["doc", "--no-deps"]

[tasks.setup]
dependencies = ["ensure-mdbook-suite"]

[tasks.fix-bimm]
command = "cargo"
args = ["make", "--cwd", "demos/bimm", "--makefile", "Makefile.toml", "fix"]

[tasks.fix-sims]
command = "cargo"
args = ["make", "--cwd", "demos/sims", "--makefile", "Makefile.toml", "fix"]

[tasks.fix-chat]
command = "cargo"
args = ["make", "--cwd", "demos/chat", "--makefile", "Makefile.toml", "fix"]

[tasks.check-all]
dependencies = [
    "check-bimm",
    "check-sims",
    "check-chat",
]

[tasks.check-bimm]
command = "cargo"
args = ["make", "--cwd", "demos/bimm", "--makefile", "Makefile.toml", "check"]

[tasks.check-sims]
command = "cargo"
args = ["make", "--cwd", "demos/sims", "--makefile", "Makefile.toml", "check"]

[tasks.check-chat]
command = "cargo"
args = ["make", "--cwd", "demos/chat", "--makefile", "Makefile.toml", "check"]

# ── individual tasks ──────────────────────────────────────────────────────────

[tasks.check-format]
description = "Check formatting (nightly rustfmt)"
workspace = false
toolchain = "nightly"
install_crate = "rustfmt"
command = "cargo"
args = ["fmt", "--check"]

[tasks.format]
description = "Apply formatting (nightly rustfmt)"
workspace = false
toolchain = "nightly"
install_crate = "rustfmt"
command = "cargo"
args = ["fmt"]

[tasks.clippy]
description = "Lint (treat warnings as errors)"
command = "cargo"
args = ["clippy", "--no-deps"]

[tasks.clippy-fix]
description = "AutoFix Lint (treat warnings as errors)"
command = "cargo"
args = ["clippy", "--fix", "--allow-staged", "--allow-dirty", "--no-deps"]

[tasks.test]
description = "Test with default features"
workspace = false
command = "cargo"
args = ["test", "--workspace"]

# ── convenience composites ────────────────────────────────────────────────────

[tasks.fix]
dependencies = [
    "clippy-fix",
    "format",
    "fix-bimm",
    "fix-sims",
    "fix-chat",
]

[tasks.tests-all]
description = "All test variants (default, ahash, no_std)"
dependencies = ["test"]

[tasks.ci]
description = "Full CI validation (mirrors GitHub Actions)"
dependencies = [
    "check-format",
    "clippy",
    "tests-all",
]

# ── mdBook ────────────────────────────────────────────────────────────────────

[tasks.book]
description = "Build the mdBook in ./book"
dependencies = ["ensure-mdbook-suite"]
cwd = "book"
command = "mdbook"
args = ["build"]

[tasks.book-serve]
description = "Serve the mdBook locally with live reload"
dependencies = ["ensure-mdbook-suite"]
cwd = "book"
command = "mdbook"
args = ["serve", "--open"]

[tasks.book-clean]
description = "Remove the mdBook build output"
dependencies = ["ensure-mdbook-suite"]
cwd = "book"
command = "mdbook"
args = ["clean"]

[tasks.ensure-mdbook-suite]
dependencies = [
    "ensure-mdbook",
    "ensure-mdbook-katex",
    "ensure-mdbook-linkcheck",
    "ensure-mdbook-linkcheck2",
    "ensure-mdbook-mermaid",
]

[tasks.ensure-mdbook]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook", "--version", "0.5.1", "--locked", "--force"]

[tasks.ensure-mdbook-katex]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-katex", "--version", "0.10.0-alpha", "--locked", "--force"]

[tasks.ensure-mdbook-linkcheck]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-linkcheck", "--version", "0.7.7", "--locked", "--force"]

[tasks.ensure-mdbook-linkcheck2]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-linkcheck2", "--version", "0.12.0", "--locked", "--force"]

[tasks.ensure-mdbook-mermaid]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-mermaid", "--version", "0.17.0", "--locked", "--force"]