[config]
default_to_workspace = false

[tasks.default]
dependencies = [
    "fix",
    "ci",
    "doc",
]

[tasks.doc]
description = "Build the workspace API docs, then bunsen's docs.rs configuration"
command = "cargo"
args = ["doc", "--no-deps"]
dependencies = ["doc-docsrs"]

[tasks.doc-docsrs]
description = "Build bunsen's API docs alone, with the feature list docs.rs uses"
script = '''
features=$(cargo metadata --no-deps --format-version 1 \
  | jq -r '.packages[] | select(.name == "bunsen") | .metadata.docs.rs.features | join(",")')
cargo doc -p bunsen --no-deps --features "$features"
'''

[tasks.setup]
dependencies = ["ensure-mdbook-suite"]

# ── individual tasks ──────────────────────────────────────────────────────────

[tasks.check-format]
description = "Check formatting (nightly rustfmt)"
workspace = false
toolchain = "nightly"
install_crate = "rustfmt"
command = "cargo"
args = ["fmt", "--check"]

[tasks.format]
description = "Apply formatting (nightly rustfmt)"
workspace = false
toolchain = "nightly"
install_crate = "rustfmt"
command = "cargo"
args = ["fmt"]

[tasks.clippy]
description = "Lint (treat warnings as errors)"
command = "cargo"
args = ["clippy", "--no-deps"]

[tasks.clippy-fix]
description = "AutoFix Lint (treat warnings as errors)"
command = "cargo"
args = ["clippy", "--fix", "--allow-staged", "--allow-dirty", "--no-deps"]

[tasks.test]
description = "Test with default features"
workspace = false
command = "cargo"
args = ["test", "--workspace"]

# ── convenience composites ────────────────────────────────────────────────────

[tasks.fix]
dependencies = [
    "clippy-fix",
    "format",
]

[tasks.tests-all]
description = "All test variants (default, ahash, no_std)"
dependencies = ["test"]

[tasks.ci]
description = "Full CI validation (mirrors GitHub Actions)"
dependencies = [
    "check-format",
    "clippy",
    "tests-all",
]

# ── mdBook ────────────────────────────────────────────────────────────────────

[tasks.book]
description = "Build the mdBook in ./book, linking into local API docs (book/src/api)"
dependencies = ["ensure-mdbook-suite"]
cwd = "book"
command = "mdbook"
args = ["build"]

[tasks.book-check]
description = "Build the book as CI does: every unresolved API link is an error"
extend = "book"
env = { MDBOOK_PREPROCESSOR__RUSTDOC_LINKS__FAIL_ON_WARNINGS = "always" }

[tasks.book-release]
description = "Build the book for publishing: API links pinned to this version on docs.rs"
extend = "book"
env = { CI = "1", MDBOOK_OUTPUT__HTML__SITE_URL = "/bunsen/book/" }

[tasks.book-serve]
description = "Serve the mdBook locally with live reload"
dependencies = ["ensure-mdbook-suite"]
cwd = "book"
command = "mdbook"
args = ["serve", "--open"]

[tasks.book-clean]
description = "Remove the mdBook build output"
dependencies = ["ensure-mdbook-suite"]
cwd = "book"
command = "mdbook"
args = ["clean"]

[tasks.ensure-mdbook-suite]
dependencies = [
    "ensure-mdbook",
    "ensure-mdbook-katex",
    "ensure-mdbook-linkcheck2",
    "ensure-mdbook-mermaid",
    "ensure-mdbook-rustdoc-links",
]

# `cargo install` without `--force` is a no-op when the pinned version is
# already installed, and replaces any other installed version.

[tasks.ensure-mdbook]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook", "--version", "0.5.4", "--locked"]

[tasks.ensure-mdbook-katex]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-katex", "--version", "0.10.0", "--locked"]

[tasks.ensure-mdbook-linkcheck2]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-linkcheck2", "--version", "0.13.0", "--locked"]

[tasks.ensure-mdbook-mermaid]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-mermaid", "--version", "0.17.1", "--locked"]

[tasks.ensure-mdbook-rustdoc-links]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-rustdoc-links", "--version", "3.0.2", "--locked"]