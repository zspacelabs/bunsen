[config]
default_to_workspace = false

[tasks.default]
dependencies = [
    "fix",
    "ci",
    "doc",
]

[tasks.doc]
description = "Build the workspace API docs, then bunsen's docs.rs configuration"
command = "cargo"
args = ["doc", "--no-deps"]
dependencies = ["doc-docsrs"]

[tasks.doc-docsrs]
description = "Build bunsen's API docs alone, with the feature list docs.rs uses"
script = '''
features=$(cargo metadata --no-deps --format-version 1 \
  | jq -r '.packages[] | select(.name == "bunsen") | .metadata.docs.rs.features | join(",")')
cargo doc -p bunsen --no-deps --features "$features"
'''

[tasks.setup]
dependencies = ["ensure-mdbook-suite"]

# ── individual tasks ──────────────────────────────────────────────────────────

[tasks.check-format]
description = "Check formatting (nightly rustfmt)"
workspace = false
toolchain = "nightly"
install_crate = "rustfmt"
command = "cargo"
args = ["fmt", "--check"]

[tasks.format]
description = "Apply formatting (nightly rustfmt)"
workspace = false
toolchain = "nightly"
install_crate = "rustfmt"
command = "cargo"
args = ["fmt"]

[tasks.clippy]
description = "Lint (treat warnings as errors)"
command = "cargo"
args = ["clippy", "--no-deps"]

[tasks.clippy-fix]
description = "AutoFix Lint (treat warnings as errors)"
command = "cargo"
args = ["clippy", "--fix", "--allow-staged", "--allow-dirty", "--no-deps"]

[tasks.test]
description = "Test with default features"
workspace = false
command = "cargo"
args = ["test", "--workspace"]

# ── validation ────────────────────────────────────────────────────────────────
#
# The validation crates (`crates/validation/*`) cross-check each model against
# its reference. None of this runs in `ci` or `test`: their build scripts fetch
# the assets they compare (STYLE.md, "Network access"), so each run here is
# asked for by name.
#
# `validate-cpu` is the cheap half, the checks on the checkpoints alone (~150
# MB), on the CPU. `validate-ci` is what `validation.yml` runs when asked:
# Silero's and Whisper's whole suites, on the CPU (~730 MB). `validate-<model>`
# is a model's whole suite, ONNX reference included (GBs on a cold cache), on
# `VALIDATION_BACKEND` (default `wgpu`; or `vulkan`, `cuda`, `metal`).
#
# `BUNSEN_ASSET_CACHE`, set to a directory, keeps every fetched asset there by
# its digest, so a `cargo clean` or a new toolchain does not fetch it again.

[tasks.validate-cpu]
description = "Validation on the checkpoints alone, on the CPU (fetches ~150 MB)"
workspace = false
env = { BURN_DEVICE = "flex" }
script = '''
cargo test -p silero-model-validation --features weights
cargo test -p whisper-model-validation --features weights
'''

[tasks.validate-ci]
description = "Silero's and Whisper's whole suites on the CPU, as validation.yml runs them (fetches ~730 MB)"
workspace = false
env = { BURN_DEVICE = "flex" }
script = '''
cargo test --release -p silero-model-validation --features download,gpu-tests
cargo test --release -p whisper-model-validation --features download,gpu-tests
'''

[tasks.validate-silero]
description = "Silero VAD's whole validation suite (fetches ~4 MB)"
workspace = false
script = "cargo test --release -p silero-model-validation --features download,gpu-tests,${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-whisper]
description = "Whisper's whole validation suite (fetches ~725 MB)"
workspace = false
script = "cargo test --release -p whisper-model-validation --features download,gpu-tests,${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-parakeet]
description = "Parakeet's whole validation suite (fetches ~5 GB)"
workspace = false
script = "cargo test --release -p parakeet-model-validation --features download,gpu-tests,${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-qwen3-asr]
description = "Qwen3-ASR's whole validation suite (fetches ~6.7 GB)"
workspace = false
script = "cargo test --release -p qwen3-asr-model-validation --features download,gpu-tests,${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-qwen3]
description = "Qwen3's whole validation suite (fetches ~24 GB)"
workspace = false
script = "cargo test --release -p qwen3-model-validation --features download,gpu-tests,${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-sortformer]
description = "Sortformer's whole validation suite (fetches ~3 GB, and the ASR checkpoints it scores with)"
workspace = false
script = "cargo test --release -p sortformer-model-validation --features download,gpu-tests,${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-voxtral]
description = "Voxtral Realtime's whole validation suite (fetches ~19 GB)"
workspace = false
script = "cargo test --release -p voxtral-model-validation --features download,gpu-tests,${VALIDATION_BACKEND:-wgpu}"

[tasks.validate-all]
description = "Every model's whole validation suite (fetches ~50 GB on a cold cache)"
workspace = false
dependencies = [
    "validate-silero",
    "validate-whisper",
    "validate-parakeet",
    "validate-qwen3-asr",
    "validate-qwen3",
    "validate-sortformer",
    "validate-voxtral",
]

# ── exercise ──────────────────────────────────────────────────────────────────
#
# `bunsen-asr`, built in release mode for one GPU backend, over a real clip:
# what a user runs, end to end, rather than a test. For a local machine with an
# accelerator, never CI: `exercise-all` fetches every model into the weights
# cache (tens of GB). The backend is required, as the task's argument:
#
#   cargo make exercise-defaults metal
#   cargo make exercise-all cuda --only whisper
#
# `tools/exercise_asr.toml` holds the default-model cases; `tools/exercise_asr.py`
# runs them, scores each transcript against the clip's, and writes a report to
# `target/exercise/`.

[tasks.exercise-defaults]
description = "Every ASR kit with its default model, on BACKEND (wgpu, vulkan, cuda, metal): each family, profile, the VAD gate, the diarizer"
workspace = false
command = "python3"
args = ["tools/exercise_asr.py", "defaults", "${@}"]

[tasks.exercise-all]
description = "Every model every ASR family and the diarizer list, on BACKEND (wgpu, vulkan, cuda, metal); fetches tens of GB"
workspace = false
command = "python3"
args = ["tools/exercise_asr.py", "all", "${@}"]

# ── convenience composites ────────────────────────────────────────────────────

[tasks.fix]
dependencies = [
    "clippy-fix",
    "format",
]

[tasks.tests-all]
description = "All test variants (default, ahash, no_std)"
dependencies = ["test"]

[tasks.ci]
description = "Full CI validation (mirrors GitHub Actions)"
dependencies = [
    "check-format",
    "clippy",
    "tests-all",
]

# ── mdBook ────────────────────────────────────────────────────────────────────

[tasks.book]
description = "Build the mdBook in ./book, linking into local API docs (book/src/api)"
dependencies = ["ensure-mdbook-suite"]
cwd = "book"
command = "mdbook"
args = ["build"]

[tasks.book-check]
description = "Build the book as CI does: every unresolved API link is an error"
extend = "book"
env = { MDBOOK_PREPROCESSOR__RUSTDOC_LINKS__FAIL_ON_WARNINGS = "always" }

[tasks.book-release]
description = "Build the book for publishing: API links pinned to this version on docs.rs"
extend = "book"
env = { CI = "1", MDBOOK_OUTPUT__HTML__SITE_URL = "/bunsen/book/" }

[tasks.book-serve]
description = "Serve the mdBook locally with live reload"
dependencies = ["ensure-mdbook-suite"]
cwd = "book"
command = "mdbook"
args = ["serve", "--open"]

[tasks.book-clean]
description = "Remove the mdBook build output"
dependencies = ["ensure-mdbook-suite"]
cwd = "book"
command = "mdbook"
args = ["clean"]

[tasks.ensure-mdbook-suite]
dependencies = [
    "ensure-mdbook",
    "ensure-mdbook-katex",
    "ensure-mdbook-linkcheck2",
    "ensure-mdbook-mermaid",
    "ensure-mdbook-rustdoc-links",
]

# `cargo install` without `--force` is a no-op when the pinned version is
# already installed, and replaces any other installed version.

[tasks.ensure-mdbook]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook", "--version", "0.5.4", "--locked"]

[tasks.ensure-mdbook-katex]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-katex", "--version", "0.10.0", "--locked"]

[tasks.ensure-mdbook-linkcheck2]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-linkcheck2", "--version", "0.13.0", "--locked"]

[tasks.ensure-mdbook-mermaid]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-mermaid", "--version", "0.17.1", "--locked"]

[tasks.ensure-mdbook-rustdoc-links]
toolchain = "stable"
command = "cargo"
args = ["install", "mdbook-rustdoc-links", "--version", "3.0.2", "--locked"]