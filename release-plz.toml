# Configuration for release-plz: https://release-plz.dev/docs/config
#
# release-plz automates versioning and publishing for this Cargo workspace:
#
#   * On every push to `main` it opens (or updates) a "release PR" that bumps the
#     workspace version and regenerates each released crate's CHANGELOG.md from
#     the conventional-commit history since the last release.
#   * When that release PR is merged, it tags the release, publishes the crates
#     to crates.io, and creates a GitHub release.
#
# See the "# Release" section of CONTRIBUTING.md for the human-facing workflow.

[workspace]
# Opt-in model: nothing is released unless a [[package]] entry below sets
# `release = true`. This automatically keeps the `examples/*` binaries and the
# unpublished `bunsen-preview-chat-dataloader` crate out of the release process.
release = false

# Regenerate each released crate's CHANGELOG.md from git history (via git-cliff).
changelog_update = true

# Detect API-breaking changes with cargo-semver-checks and pick the bump level
# (major/minor/patch) accordingly.
semver_check = true

# Cut a GitHub release (and git tag) for each published crate.
git_release_enable = true

# Only release when the release PR is merged — not on every push to `main`.
# Without this, the `release` job publishes any crate whose manifest version
# isn't on crates.io yet the moment it lands on `main`. That's what caused
# `bunsen-preview-chat-dataloader` (manifest 0.21.3, never published) to attempt
# a 0.21.3 back-publish. With releases gated on the release PR, a newly-added
# crate first publishes at the *next* bumped version, alongside the others.
#
# The gate is the merged PR's branch name: `release` runs only when the commit
# at the head of `main` came from a PR whose branch starts with `release-plz-`
# (the `pr_branch_prefix` default). That also matters for recovery. If a
# release dies part-way — some crates published, the rest not — `release-pr`
# sees "local version > registry version", only refreshes changelogs, and opens
# nothing; an ordinary fix PR does not trigger `release` either. To resume,
# merge any PR from a branch named `release-plz-*`: `release` then publishes
# whatever is still missing at the manifest version. Squash merges are fine —
# release-plz handles them explicitly.
release_always = false


# --- Published crates -------------------------------------------------------
# All four crates share a single version (lockstep) via `version_group`, which
# matches the `version.workspace = true` inheritance in the root Cargo.toml: a
# bump to any one of them moves all of them to the same new version, and the
# inter-crate `version = "x.y.z"` path-dependency requirements are updated
# automatically.

[[package]]
name = "bunsen"
release = true
version_group = "bunsen"

[[package]]
name = "bunsen-contracts-macros"
release = true
version_group = "bunsen"

[[package]]
name = "bunsen-firehose"
release = true
version_group = "bunsen"

[[package]]
name = "bunsen-firehose-image"
release = true
version_group = "bunsen"

[[package]]
name = "bunsen-arrow-dataloaders"
release = true
version_group = "bunsen"

[[package]]
name = "bunsen-bundled-silero"
release = true
version_group = "bunsen"

[[package]]
name = "bunsen-bundled-whisper"
release = true
version_group = "bunsen"
