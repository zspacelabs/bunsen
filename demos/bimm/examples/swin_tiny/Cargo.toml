[package]
name = "swin_tiny"
publish = false
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true


[features]
default = []
wgpu = ["burn/wgpu"]
cuda = ["burn/cuda"]
metal = ["burn/metal"]


[dependencies]
burn = { workspace = true, features = ["train", "fusion", "autotune", "vision", "dataset", "flex"] }
bunsen = { workspace = true }
bunsen-firehose = { workspace = true }
bunsen-firehose-image = { workspace = true }

serde = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive"] }
rand = { workspace = true }
anyhow = { workspace = true }
