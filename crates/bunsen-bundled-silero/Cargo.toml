[package]
name = "bunsen-bundled-silero"
description = "Bunsen bundled Silero VAD assets: the pretrained weights, and optionally the ONNX-generated reference model."
publish = true

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
burn = { workspace = true, features = ["store"] }
burn-store = { workspace = true }
document-features = { workspace = true }

[build-dependencies]
burn-onnx = { workspace = true, optional = true }

[lints]
workspace = true

[features]
## Generate the ONNX-generated models in `crate::onnx_gen`.
onnx_gen = ["dep:burn-onnx"]
