[package]
name = "silero-bench"
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }

serde_json = { workspace = true }
burn = { workspace = true, features = ["fusion", "autotune"] }
# `fetch`: the run fetches `silero/vad-16k` (1.2 MB) into the default
# pretrained cache on first use, never the build.
bunsen = { path = "../../public/bunsen", features = ["testing", "fetch"] }

[lints]
workspace = true
