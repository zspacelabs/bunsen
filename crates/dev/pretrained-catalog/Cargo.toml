[package]
name = "pretrained-catalog"
description = "A CLI, examples and integration tests over bunsen's build catalogs: import a stack, list, show and resolve entries, and run selection pipelines with each stage explained."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
bunsen = { path = "../../public/bunsen", default-features = false, features = ["std"] }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-saphyr = { workspace = true, features = ["serialize"] }

[[bin]]
name = "pretrained-catalog"
path = "src/bin/pretrained-catalog.rs"

[lints]
workspace = true
