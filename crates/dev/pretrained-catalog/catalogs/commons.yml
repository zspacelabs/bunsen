# Groups that more than one catalog refers to: publishers and contracts.
# Contracts are named at the root; `of_kind(contract)` lists them, and each
# build is in exactly one.
description: "Shared groups: publishers and contracts."
entries:
  - kind: namespace
    name: qwen
    facet: publisher
    description: "Qwen, Alibaba Cloud's model team."
  - kind: namespace
    name: openai
    facet: publisher
    description: "OpenAI."

  - kind: contract
    name: qwen3-lm
    description: "A Qwen3-architecture causal LM, as transformers lays it out."
    dependency_keys:
      required: [checkpoint, config, tokenizer]
      optional: [generation_config]
  - kind: contract
    name: whisper-asr
    description: "An OpenAI Whisper checkpoint and its tiktoken vocabulary."
    dependency_keys:
      required: [checkpoint, vocabulary]
