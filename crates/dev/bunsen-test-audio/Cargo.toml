[package]
name = "bunsen-test-audio"
description = "The audio the workspace's tests and validation suites read: committed clips with their provenance and ground truth. A leaf: it does not depend on bunsen."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
## Nothing by default: building this crate fetches nothing.
default = []

## Fetch a 60 s excerpt of the AMI Meeting Corpus (meeting EN2002d,
## Mix-Headset, 1.9 MB of 16 kHz PCM) with its speaker reference (RTTM) and
## its transcript by speaker, digest-pinned: `AMI_EN2002D_2132`. For the
## diarization validation; CI never turns it on.
ami = ["dep:bunsen-fetch"]

[build-dependencies]
bunsen-fetch = { path = "../../public/bunsen-fetch", features = ["fetch"], optional = true }

[dev-dependencies]
sha2 = { workspace = true }
