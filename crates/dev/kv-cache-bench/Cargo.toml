[package]
name = "kv-cache-bench"
description = "Times decode-shaped KV cache growth: Whisper's concatenation, the shared `KVCache`, and per-layer preallocated buffers."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = []
## Make `--device cuda` available.
cuda = ["bunsen-app/cuda"]
## Make `--device metal` available.
metal = ["bunsen-app/metal"]
## Make `--device vulkan` available.
vulkan = ["bunsen-app/vulkan"]
## Make `--device wgpu` available.
wgpu = ["bunsen-app/wgpu"]
## burn's fusion backend; off by default, as in `bunsen-tool`.
fusion = ["burn/fusion"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../public/bunsen" }
bunsen-app = { path = "../../public/bunsen-app" }
clap = { workspace = true, features = ["derive"] }

[lints]
workspace = true
