[package]
name = "bunsen"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/bunsen/latest/"
description = "burn neural network extension library"

[lints]
workspace = true

[dependencies]
bimm-contracts = { workspace = true }

# There is a dep/gate bug that requires "ndarray" when using "network".
burn = { workspace = true, features = ["network", "ndarray"] }
dirs = { workspace = true }

crc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

anyhow = { workspace = true }
num-traits = { workspace = true }

[dev-dependencies]
burn = { workspace = true, features = ["autodiff", "wgpu"] }
hamcrest = { workspace = true }
indoc = { workspace = true }
criterion = { workspace = true }


[features]
default = []
std = []

[[bench]]
name = "drop_block"
harness = false
