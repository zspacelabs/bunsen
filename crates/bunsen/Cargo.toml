[package]
name = "bunsen"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/bunsen/latest/"
description = "bunsen is a community companion library for burn"

[lints]
workspace = true

[features]
default = [
    "reflection",
    "train",
]
std = [
    "burn/std",
    "bunsen-contracts/std",
]

reflection = [
    "std",
    "dep:xot",
    "dep:paste",
    "dep:xee-xpath",
    "dep:spanned_error_message",
]
train = [
    "std",
    "burn/train",
    "dep:hashbrown",
]
cache = [
    "std",
    "dep:bunsen-cache",
]

#! Enables testing support features.
testing = [
    "flex"
]

cuda = ["burn/cuda"]
metal = ["burn/metal"]
wgpu = ["burn/wgpu"]
flex = ["burn/flex"]

[dependencies]
bunsen-cache = { path = "../bunsen-cache", version = "0.21.0-pre.1", optional = true }
bunsen-contracts = { path = "../bunsen-contracts", version = "0.21.0-pre.1" }

burn = { workspace = true }
# kit-locked public deps:
hashbrown = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

anyhow = { workspace = true }
num-traits = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

spanned_error_message = { workspace = true, optional = true }
paste = { workspace = true, optional = true }
xot = { workspace = true, optional = true }
xee-xpath = { workspace = true, optional = true }

[dev-dependencies]
bunsen = { path = ".", features = ["testing"] }
burn = { workspace = true, features = ["autodiff"] }
hamcrest = { workspace = true }
indoc = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "drop_block"
harness = false
