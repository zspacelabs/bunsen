[package]
name = "sortformer-model-validation"
description = "Validates bunsen's Sortformer diarization against pretrained references: ONNX exports of Nemotron-3-Diarization and Sortformer v2.1, and onnxruntime's own runs of them. Fetches its model assets; hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Fetch the reference graphs and generate the models from them, and pull in
## the checkpoints compared against them: NVIDIA's `Nemotron-3-Diarization`
## and streaming Sortformer v2 and v2.1, whose weights the graphs carry; and
## the speech recognizers diarized transcription is scored with (Phonon-2,
## Phonon-1, Whisper `base`).
##
## **Off by default.** Enabling this makes `bunsen-bundled-sortformer`'s build
## reach the network on a cold cache (~3 GB), which a plain
## `cargo build --workspace` must never do. Every asset is verified against a
## pinned SHA-256, so a warm build is offline and reproducible.
download = [
    "dep:bunsen-bundled-sortformer",
    "bunsen-bundled-sortformer/onnx_gen",
    "bunsen-bundled-sortformer/checkpoint_nemotron",
    "bunsen-bundled-sortformer/onnx_gen_v2_1",
    "bunsen-bundled-sortformer/checkpoint_v2",
    "bunsen-bundled-sortformer/checkpoint_v2_1",
    "bunsen-test-audio/ami",
    "bunsen/fermion",
    "bunsen/whisper-weights",
    "dep:bunsen-bundled-parakeet",
    "bunsen-bundled-parakeet/checkpoint",
    "dep:bunsen-bundled-qwen3-asr",
    "bunsen-bundled-qwen3-asr/checkpoint",
    "dep:bunsen-bundled-whisper",
    "bunsen-bundled-whisper/checkpoint",
    "bunsen-bundled-whisper/vocab",
]

## Compile every test that loads a model.
##
## **Off by default**, and orthogonal to the backend features: this selects
## *whether* those tests are built, a backend feature selects *which*
## accelerator runs them, and both are passed. Needs `download` too.
gpu-tests = []

## Run the cross-check on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the cross-check on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the cross-check on CUDA.
cuda = ["bunsen/cuda"]

## Run the cross-check on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../public/bunsen", features = ["testing", "nemo"] }
bunsen-bundled-sortformer = {
    path = "../../public/bunsen-bundled-sortformer",
    optional = true
}
bunsen-bundled-parakeet = {
    path = "../../public/bunsen-bundled-parakeet",
    optional = true
}
bunsen-bundled-qwen3-asr = {
    path = "../../public/bunsen-bundled-qwen3-asr",
    optional = true
}
bunsen-bundled-whisper = {
    path = "../../public/bunsen-bundled-whisper",
    optional = true
}
bunsen-test-audio = { path = "../../dev/bunsen-test-audio" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
