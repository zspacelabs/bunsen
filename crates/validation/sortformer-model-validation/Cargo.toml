[package]
name = "sortformer-model-validation"
description = "Validates bunsen's Sortformer diarization against pretrained references: an ONNX export, and onnxruntime's own run of it. Fetches its model assets; hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Fetch the reference graph and generate the model from it, and pull in the
## checkpoint compared against it: NVIDIA's `Nemotron-3-Diarization`, whose
## weights the graph carries.
##
## **Off by default.** Enabling this makes `bunsen-bundled-sortformer`'s build
## reach the network on a cold cache (~800 MB), which a plain
## `cargo build --workspace` must never do. Every asset is verified against a
## pinned SHA-256, so a warm build is offline and reproducible.
download = [
    "dep:bunsen-bundled-sortformer",
    "bunsen-bundled-sortformer/onnx_gen",
    "bunsen-bundled-sortformer/checkpoint_nemotron",
]

## Compile every test that loads a model.
##
## **Off by default**, and orthogonal to the backend features: this selects
## *whether* those tests are built, a backend feature selects *which*
## accelerator runs them, and both are passed. Needs `download` too.
gpu-tests = []

## Run the cross-check on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the cross-check on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the cross-check on CUDA.
cuda = ["bunsen/cuda"]

## Run the cross-check on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../public/bunsen", features = ["testing"] }
bunsen-bundled-sortformer = {
    path = "../../public/bunsen-bundled-sortformer",
    optional = true
}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
