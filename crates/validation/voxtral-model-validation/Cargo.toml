[package]
name = "voxtral-model-validation"
description = "Validates bunsen's Voxtral Realtime against pretrained references: an ONNX export, onnxruntime's run of it, and transformers. Fetches its model assets; hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Fetch the reference graphs and generate the models from them, and fetch
## the checkpoint compared against them: Mistral's
## `Voxtral-Mini-4B-Realtime-2602`.
##
## **Off by default.** Enabling this makes `bind-voxtral-onnx`'s build
## reach the network on a cold cache (~28 GB), which a plain
## `cargo build --workspace` must never do. Every asset is verified against a
## pinned SHA-256, so a warm build is offline and reproducible.
download = [
    "dep:bind-voxtral-onnx",
    "bind-voxtral-onnx/onnx_gen",
    "bind-voxtral-onnx/checkpoint",
]

## Compile every test that loads a model.
##
## **Off by default**, and orthogonal to the backend features: this selects
## *whether* those tests are built, a backend feature selects *which*
## accelerator runs them, and both are passed. Needs `download` too.
gpu-tests = []

## Run the cross-check on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the cross-check on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the cross-check on CUDA.
cuda = ["bunsen/cuda"]

## Run the cross-check on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../public/bunsen", features = ["testing", "cache"] }
bunsen-test-audio = { path = "../../dev/bunsen-test-audio" }
bind-voxtral-onnx = {
    path = "../../onnx/bind-voxtral-onnx",
    optional = true
}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
