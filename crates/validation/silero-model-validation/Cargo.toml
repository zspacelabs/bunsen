[package]
name = "silero-model-validation"
description = "Validates bunsen's Silero VAD against the ONNX reference it was transliterated from, and against a committed golden trace."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Fetch upstream's ONNX graph (2.8 MB) and `silero_vad_16k.safetensors`
## (1.2 MB) at build time, and generate the reference model from the graph.
## **Off by default**: a plain build never reaches the network.
download = [
    "dep:bunsen-bundled-silero",
    "bunsen-bundled-silero/onnx_gen",
    "bunsen-bundled-silero/checkpoint",
]

## Compile the cross-checks, which load the models.
##
## Needs `download` too, for the assets they compare; without both, the crate
## has no tests.
gpu-tests = []

## Run the validation on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the validation on CUDA.
##
## Known to diverge: see the golden test's note.
cuda = ["bunsen/cuda"]

## Run the validation on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../public/bunsen", features = ["testing", "cache"] }
bunsen-bundled-silero = { path = "../../public/bunsen-bundled-silero", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
serial_test = { workspace = true }
