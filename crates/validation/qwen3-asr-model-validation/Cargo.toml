[package]
name = "qwen3-asr-model-validation"
description = "Validates bunsen's Qwen3-ASR against pretrained references: an ONNX export, onnxruntime's run of it, and transformers. Fetches its model assets; hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Fetch the reference graphs and generate the models from them.
##
## **Off by default.** Enabling this makes `bunsen-bundled-qwen3-asr`'s build
## reach the network on a cold cache (~3.8 GB), which a plain
## `cargo build --workspace` must never do. Every asset is verified against a
## pinned SHA-256, so a warm build is offline and reproducible.
download = [
    "dep:bunsen-bundled-qwen3-asr",
    "bunsen-bundled-qwen3-asr/onnx_gen",
]

## Compile every test that loads a model.
##
## **Off by default**, and orthogonal to the backend features: this selects
## *whether* those tests are built, a backend feature selects *which*
## accelerator runs them, and both are passed. Needs `download` too.
gpu-tests = []

## Run the cross-check on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the cross-check on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the cross-check on CUDA.
cuda = ["bunsen/cuda"]

## Run the cross-check on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../public/bunsen", features = ["testing"] }
bunsen-bundled-qwen3-asr = {
    path = "../../public/bunsen-bundled-qwen3-asr",
    optional = true
}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
