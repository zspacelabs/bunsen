[package]
name = "bunsen-firehose-image"
rust-version.workspace = true
edition.workspace = true

authors.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
documentation = "https://docs.rs/bunsen-firehose-image/latest/"
description = "Image operators for bunsen-firehose: loading, seeded augmentation, and conversion to burn tensor data"

# docs.rs builds with `testing`, so the API docs show `test_util`.
[package.metadata.docs.rs]
features = ["testing"]

[lints]
workspace = true

[features]
## Test support: the `test_util` module (a deterministic test image and an
## image-similarity assertion), with the `image-compare` dependency it needs,
## and bunsen's `testing`. Not a default; this crate's own tests turn it on
## through a dev-dependency on this crate itself.
testing = ["dep:image-compare", "bunsen/testing"]

[dependencies]
burn = { workspace = true, features = ["std", "dataset", "vision"] }
bunsen-firehose = { version = "0.41.0", path = "../bunsen-firehose" }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

bunsen = { version = "0.41.0", path = "../bunsen", default-features = false, features = ["std"] }

rand = { workspace = true, features = ["std"] }
inventory = { workspace = true }

indoc = { workspace = true }

image = { workspace = true, features = ["jpeg", "png", "gif", "serde"] }

image-compare = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
bunsen = { features = ["testing"], path = "../bunsen" }
serial_test = { workspace = true }
# This crate's own tests build with its `testing`, and through it bunsen's.
# Path only: an unpublished dev-dependency is dropped from the published
# manifest.
bunsen-firehose-image = { path = ".", features = ["testing"] }
