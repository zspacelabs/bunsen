[package]
name = "bunsen-asr"
description = "Speech to text on bunsen, one subcommand per model family: Parakeet TDT (FermionResearch's Phonon-2 by default), Qwen3-ASR (Phonon-1), and Whisper."
publish = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
homepage = "https://zspacelabs.ai/bunsen/book/"
documentation = "https://docs.rs/bunsen-asr/latest/"
readme = "README.md"
keywords = ["speech-recognition", "transcription", "whisper", "parakeet", "burn"]
categories = ["command-line-utilities", "multimedia::audio", "science"]

[[bin]]
name = "bunsen-asr"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["live"]
## `<family> live`: the microphone through the host's audio API (`cpal`;
## on Linux it links ALSA, `libasound2-dev`), and Ctrl-C as a clean stop.
live = ["dep:cpal", "dep:ctrlc"]
## Make `--device cuda` available.
cuda = ["bunsen-app/cuda"]
## Make `--device metal` available.
metal = ["bunsen-app/metal"]
## Make `--device vulkan` available.
vulkan = ["bunsen-app/vulkan"]
## Make `--device wgpu` available.
wgpu = ["bunsen-app/wgpu"]

[dependencies]
burn = { workspace = true }
# The backend is chosen at run time with `--device`, from those compiled in
# through this crate's backend features; the CPU is always there.
#
# `fermion` reads the Phonon archives; `indicatif` puts bunsen's progress bar
# on every weights transfer.
bunsen = { version = "0.39.0", path = "../bunsen", features = [
    "store",
    "store_safetensors",
    "store_pytorch",
    "audio",
    "tokenizer",
    "fermion",
    "indicatif",
] }
bunsen-app = { version = "0.39.0", path = "../bunsen-app" }
clap = { workspace = true, features = ["derive"] }
cpal = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
