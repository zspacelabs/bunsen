[package]
name = "bunsen-app"
description = "Shared command-line plumbing for bunsen's binaries: device and precision selection, logging, shard selection, and the weights cache's flags and commands."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
homepage = "https://zspacelabs.ai/bunsen/book/"
documentation = "https://docs.rs/bunsen-app/latest/"
readme = "README.md"
keywords = ["burn", "cli", "clap", "bunsen"]
categories = ["command-line-interface"]
publish = true

[dependencies]
burn = { workspace = true, features = ["std", "flex"] }
bunsen = { version = "0.42.0", path = "../bunsen", features = ["std", "testing", "fetch", "cache"] }

clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
log = { workspace = true }
# `cache list`'s dates.
time = { workspace = true, features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
## Make `--device cuda` available.
cuda = ["burn/cuda"]
## Make `--device metal` available.
metal = ["burn/metal"]
## Make `--device vulkan` available.
vulkan = ["burn/vulkan"]
## Make `--device wgpu` available.
wgpu = ["burn/wgpu"]
## burn's terminal dashboard for training metrics, drawn when stdout is a
## terminal; plain text logs otherwise.
tui = ["burn/tui"]

[lints]
workspace = true
