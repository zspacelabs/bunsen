[package]
name = "bunsen-bundled-silero"
description = "Bunsen bundled Silero VAD assets: the pretrained weights, generated offline from a committed ONNX graph, and optionally the ONNX-generated reference model."
publish = true

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

# docs.rs builds with `onnx_gen`, so the API docs show the generated model.
# docs.rs builds have no network, and none is needed: the build script
# generates from the committed ONNX graph whatever the features, and
# `onnx_gen` only compiles in the model it generated.
[package.metadata.docs.rs]
features = ["onnx_gen"]

[dependencies]
burn = { workspace = true, features = ["store"] }
burn-store = { workspace = true }
document-features = { workspace = true }

[build-dependencies]
# Not optional: the build script generates the burnpack weights from the
# committed ONNX graph whether or not the generated Rust model is wanted,
# and hashes what it generated.
burn-onnx = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true

[features]
## Expose the ONNX-generated reference model in `crate::onnx_gen`.
##
## The weights are generated from the ONNX graph either way; this only
## decides whether the generated Rust model is compiled in.
onnx_gen = []
