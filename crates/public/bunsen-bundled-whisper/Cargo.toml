[package]
name = "bunsen-bundled-whisper"
description = "Bunsen bundled Whisper assets: fetches OpenAI's base checkpoint, its tokenizer vocabularies and an ONNX reference model at build time, digest-pinned, each behind a feature. Hosts none."
publish = true

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
burn = { workspace = true, features = ["store"] }
burn-store = { workspace = true, features = ["std"] }
document-features = { workspace = true }

[build-dependencies]
bunsen-fetch = { version = "0.39.0", path = "../bunsen-fetch", features = ["fetch"] }
burn-onnx = { workspace = true, optional = true }

[lints]
workspace = true

[features]
## Nothing by default: building this crate as a workspace member fetches
## nothing. `whisper-model-validation/weights` turns on `checkpoint` and
## `vocab`; `whisper-model-validation/download` turns on `onnx_gen` too.
default = []

## Fetch `OpenAI`'s multilingual "base.pt", laid out under `cache_dir()`.
##
## A bunsen pretrained cache rooted at that directory resolves `openai/base`
## from it, offline; `whisper-model-validation` checks the Whisper kit's
## pretrained pathway on it.
checkpoint = []

## Fetch Whisper's two `.tiktoken` rank files and expose them as
## `multilingual_tiktoken()` and `gpt2_tiktoken()`, laid out under
## `cache_dir()`.
##
## The base vocabularies: every multilingual checkpoint uses the first, the
## `*.en` checkpoints the second. Under 2 MB together, so they are fetched
## rather than committed only for consistency with the checkpoint — one
## mechanism, one cache, one pin per asset. Independent of `checkpoint`.
vocab = []

## Fetch the `onnx-community/whisper-base` export and generate Rust models
## from it, in `crate::onnx_gen`.
##
## This is the *reference implementation*, not the weights bunsen ships: it
## exists so `whisper-model-validation` has something with independent
## provenance to disagree with. Independent of `checkpoint` — they are
## different assets and neither implies the other.
onnx_gen = ["dep:burn-onnx"]
