[package]
name = "bunsen-firehose"
rust-version.workspace = true
edition.workspace = true

authors.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
documentation = "https://docs.rs/bunsen-firehose/latest/"
description = "A column-oriented data pipeline for burn: typed schemas, build plans and registered operators, run as a burn Batcher"

[lints]
workspace = true

[dependencies]
burn = { workspace = true, features = ["std", "dataset", "vision"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

num-traits = { workspace = true }

globwalk = { workspace = true }

bunsen = { version = "0.38.0", path = "../bunsen", default-features = false, features = ["std"] }

inventory = { workspace = true }

indoc = { workspace = true }

regex = { workspace = true }
regex-macro = { workspace = true }

[dev-dependencies]
bunsen = { path = "../bunsen", features = ["testing"] }

