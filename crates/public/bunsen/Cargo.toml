[package]
name = "bunsen"
edition.workspace = true

authors.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

rust-version.workspace = true
homepage = "https://zspacelabs.ai/bunsen/book/"
documentation = "https://docs.rs/bunsen/latest/"
description = "bunsen is a batteries included common library for burn"

# docs.rs builds this feature list, not `all-features`: `whisper-weights`
# makes `bunsen-bundled-whisper`'s build script download ~145 MB, and docs.rs
# builds have no network. The backends only change which backend
# `support::testing::PerformanceBackend` names. The book's API links resolve
# against this same list (`book/book.toml`, `build.docs-rs`), and so do CI's
# isolated doc build and `cargo make doc`. docs.rs sets `--cfg docsrs`
# itself, so there are no `rustdoc-args` here.
[package.metadata.docs.rs]
features = ["fetch", "indicatif", "silero-weights", "testing", "audit"]

[lints]
workspace = true


[[bench]]
name = "drop_block"
harness = false

[[bench]]
name = "contracts"
harness = false

[[bench]]
name = "math"
harness = false

[[bench]]
name = "lbm"
harness = false

[[bench]]
name = "whisper_decode"
harness = false


[features]
# The defaults are what most consumers want; test support (`testing`) and
# audit probes (`audit`) are opt-in, because they pull in a CPU backend,
# audio decoding, a tokenizer and the tracing-test stack.
default = [
    "reflection",
    "train",
    "store_pytorch",
    "store_safetensors",
    "store_burnpack",
]

## Use the standard library (`burn/std`). Every other feature except the
## backends turns this on.
std = [
    "burn/std",
]

## Enable the XmlModuleTree reflection api for querying and transforming modules.
reflection = [
    "std",
    "dep:xot",
    "dep:xee-xpath",
    "dep:spanned_error_message",
]

## Enable the burn-store.
store = [
    "std",
    "cache",
    "burn/store",
]

## Read PyTorch `.pt` checkpoints through the burn-store.
store_pytorch = [
    "store",
    "burn-store/pytorch",
]

## Read `transformers`' `model.safetensors` through the burn-store: what a
## Hugging Face repo serves.
store_safetensors = [
    "store",
    "burn-store/safetensors",
]

## Read burn's own burnpack (`.bpk`) files through the burn-store: what
## Silero VAD's weights ship as.
store_burnpack = [
    "store",
    "burn-store/burnpack",
]

## Enable features to use with `burn/train`.
train = [
    "std",
    "burn/train",
    "dep:hashbrown",
    "dep:log",
    "dep:paste",
]

## Enable the disk cache: where files land (`BunsenDiskCache` and its paths),
## digests (`sha256_of`, `verify_sha256`), links (`link_or_copy`), the shard
## and weights indexes over local files. Nothing here reaches the network;
## that is `fetch`.
cache = [
    "std",
    "dep:directories-next",
    "dep:sha2",
]

## Reach the network at run time, through `ureq`: `fetch_file`,
## `load_cached_path` / `load_data_path`, `fetch_many`, and the URL sources of
## `PretrainedCache::resolve` and `ShardSet::fetch`. Never at build time; that
## switch is `download`.
fetch = [
    "cache",
    "dep:ureq",
]

## Draws a byte progress bar on stderr for each cache transfer, through
## `indicatif`. When on, `BunsenDiskCacheOptions::default()` carries an
## `IndicatifObserver`; `without_transfer_observers()` drops it.
indicatif = [
    "fetch",
    "dep:indicatif",
]

## Enables audio io support features.
##
## `hound` reads WAV; `symphonia` reads the compressed formats (mp3).
audio = [
    "std",
    "dep:hound",
    "dep:symphonia",
]

## Turns token ids into text, through `wordchipper`.
##
## Ids never need this: a kit's token layout (`kits::speech::whisper::WhisperTokenLayout`
## and every special id) is derived arithmetically and always available.
## Only `kits::tokens::WordchipperDetokenizer` is behind it. `wordchipper` comes in with
## `default-features = false` — no downloader, no TLS, no thread pool — so
## the cost to a consumer that has nothing else from it is small; see the
## feature's entry in `CHANGELOG.md` for the measured number.
tokenizer = [
    "std",
    "dep:wordchipper",
]

## Include the silero-vad pretrained weights in the build.
silero-weights = [
    "store",
    "store_burnpack",
    "dep:bunsen-bundled-silero",
]

## Make `bunsen-bundled-whisper`'s pretrained cache directory available: it
## fetches `OpenAI`'s `base` checkpoint and the two `.tiktoken` vocabularies
## at build time, digest-pinned, and lays them out as a `PretrainedCache`
## root. bunsen's own tests point a cache at it, offline. Nothing in the
## Whisper kit's tables depends on this: bundling is a populated cache
## directory, not a kind of source, and a deployment populates the runtime
## cache the same way (`models fetch` in `whisper-cli`).
##
## **This makes the build reach the network** on a cold cache: unlike Silero's,
## Whisper's weights are 145 MB and are fetched rather than committed. Every
## asset is digest-pinned and cached, so a warm build is offline; see
## `bunsen-bundled-whisper`.
whisper-weights = [
    "store",
    "store_pytorch",
    "dep:bunsen-bundled-whisper",
    "bunsen-bundled-whisper/checkpoint",
    "bunsen-bundled-whisper/vocab",
]

## Enable the cuda backend in the bunsen build.
## This will impact the bunsen::support::testing::PerformanceBackend choice.
## Dependents which enable backends for burn without enabling them for bunsen
## can still use those backends with bunsen; only bunsen-specific features will
## be disabled.
cuda = ["burn/cuda"]
## Enable the metal backend in the bunsen build.
## This will impact the bunsen::support::testing::PerformanceBackend choice.
## Dependents which enable backends for burn without enabling them for bunsen
## can still use those backends with bunsen; only bunsen-specific features will
## be disabled.
metal = ["burn/metal"]
## Enable the vulkan backend in the bunsen build.
## This will impact the bunsen::support::testing::PerformanceBackend choice.
## Dependents which enable backends for burn without enabling them for bunsen
## can still use those backends with bunsen; only bunsen-specific features will
## be disabled.
vulkan = ["burn/vulkan"]
## Enable the wgpu backend in the bunsen build.
## This will impact the bunsen::support::testing::PerformanceBackend choice.
## Dependents which enable backends for burn without enabling them for bunsen
## can still use those backends with bunsen; only bunsen-specific features will
## be disabled.
wgpu = ["burn/wgpu"]
## Enable the flex backend in the bunsen build.
## This will impact the bunsen::support::testing::PerformanceBackend choice.
## Dependents which enable backends for burn without enabling them for bunsen
## can still use those backends with bunsen; only bunsen-specific features will
## be disabled.
flex = ["burn/flex"]


## Test support: `support::testing` (test backends and devices, seeded
## tensors, device memory, assertion helpers), with the `audio`, `tokenizer`
## and `flex` features it needs. Not a default; bunsen's own tests turn it on
## through a dev-dependency on bunsen itself.
testing = [
    "audio",
    "tokenizer",
    "flex",
    "dep:rand",
    "dep:tracing",
    "dep:tracing-test",
    "dep:tracing-subscriber",
]

## Enables the `audit` module: audit probes, stream recording and
## verification, and stored baselines.
audit = [
    "testing",
    "dep:ciborium",
]

[dependencies]
bunsen-contracts-macros = { version = "0.36.1", path = "../bunsen-contracts-macros" }

bunsen-bundled-silero = { version = "0.36.1",
    path = "../bunsen-bundled-silero",
    optional = true
}

bunsen-bundled-whisper = { version = "0.36.1",
    path = "../bunsen-bundled-whisper",
    optional = true
}

# `log`, as `burn`'s optimizers and `Learner` use it.
log = { workspace = true, optional = true }

tracing = { workspace = true, optional = true }
tracing-test = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

burn = { workspace = true }
burn-store = { workspace = true, optional = true }

# burner-locked public deps:
hashbrown = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ciborium = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
crc = { workspace = true }
# `zlib-rs`, in every build: Whisper's `compression_ratio` must compress as
# upstream's zlib does, and flate2's default backend, `miniz_oxide`,
# compresses short loops far less tightly. Without the feature here, the
# backend would depend on what else in the build enables flate2's features.
flate2 = { workspace = true, features = ["zlib-rs"] }

directories-next = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

dashmap = { workspace = true }

time = { workspace = true, features = ["formatting", "macros", "local-offset"] }

num-traits = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
dyn-clone = { workspace = true }

document-features = { workspace = true }
paste = { workspace = true, optional = true }

spanned_error_message = { workspace = true, optional = true }
xot = { workspace = true, optional = true }
xee-xpath = { workspace = true, optional = true }

hound = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }

# Decode-only. `default-features = false` is the point: the default set pulls
# a downloader, TLS and rayon, none of which turning ids into text needs.
wordchipper = { workspace = true, default-features = false, optional = true }


[dev-dependencies]
# bunsen's own tests and doctests use its test support and audit probes,
# neither of which is a default feature. Cargo merges a dev-dependency's
# features into every build of the crate's tests, doctests and benches, so
# this one leaves the defaults off: under `--no-default-features` those
# targets build without them, and a test that needs a default feature
# carries a `cfg(feature = ...)` gate for it.
bunsen = { path = ".", default-features = false, features = ["testing", "audit"] }
burn = { workspace = true, features = ["autodiff"] }
serde = { workspace = true }
serde_json = { workspace = true }

assert_float_eq = { workspace = true }
serial_test = { workspace = true }
nearly = { workspace = true }
hamcrest = { workspace = true }
indoc = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
