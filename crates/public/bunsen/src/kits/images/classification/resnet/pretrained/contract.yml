# What the resnet kit's loader reads: an ImageNet-1k ResNet state dict, and
# the geometry it is laid out in, which a state dict doesn't carry.
resnet-classifier:
  $kind: contract
  $description: "A ResNet image classifier: a PyTorch state dict, in the geometry its build states."
  $resources:
    checkpoint:
      $format: [pytorch fp32]
      $description: "The state dict, torchvision's or timm's."
    labels:
      $format: [synsets]
      $optional: true
      $description: "The class labels: one `WordNet` synset per class, in class order."
    label_names:
      $format: [synset-lemmas]
      $optional: true
      $description: "Each synset's lemmas, its readable name."
  $args:
    geometry: { $type: geometry, $description: "The network's blocks and widths." }
    eval_transform:
      $type: $object
      $optional: true
      $description: >-
        The eval transform its images go through: an `ImageEvalTransformConfig`, as it serializes.
  geometry:
    $kind: type
    $description: >-
      A `ResNetContractConfig`, as it serializes: the loader verifies it against the weights.
    $type: $object
