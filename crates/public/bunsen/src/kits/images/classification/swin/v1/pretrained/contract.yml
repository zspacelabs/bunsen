# What the swin v1 kit's loader reads: a Swin V1's weights, and its geometry, which a state dict
# doesn't carry: a timm hub repo's config.json, or stated.
swin-v1-classifier:
  $kind: contract
  $description: >-
    A Swin V1 image classifier: a timm hub repo's checkpoint (safetensors) and `config.json`.
  $resources:
    checkpoint:
      $format: [safetensors]
      $description: "The state dict: a timm hub repo's `model.safetensors`."
    config:
      $format: [json]
      $optional: true
      $description: "A timm hub repo's `config.json`: its architecture, classes, pool and eval
        transform."
    labels:
      $format: [synsets]
      $optional: true
      $description: "The class labels: one `WordNet` synset per class, in class order."
    label_names:
      $format: [synset-lemmas]
      $optional: true
      $description: "Each synset's lemmas, its readable name."
  $args:
    geometry:
      $type: geometry
      $optional: true
      $description: "The network's geometry; without it, `config.json`'s architecture."
    eval_transform:
      $type: $object
      $optional: true
      $description: >-
        The eval transform its images go through: an `ImageEvalTransformConfig`, as it serializes.
  geometry:
    $kind: type
    $description: >-
      A `SwinV1ContractConfig`, as it serializes.
    $type: $object
