# What the whisper kit's loader reads: an openai-whisper checkpoint, which
# carries its own dims, the tiktoken vocabulary of its token layout, and the
# geometry a build promises, which the loader checks the checkpoint against.
whisper-asr:
  $kind: contract
  $description: >-
    An OpenAI Whisper checkpoint, as openai-whisper saves it, and its tiktoken vocabulary.
  $resources:
    checkpoint:
      $format: [pytorch fp16]
      $description: "The `.pt`: the weights and the dims they are laid out in."
    vocabulary:
      $format: [tiktoken]
      $description: "`multilingual.tiktoken` or `gpt2.tiktoken`, as the token layout needs."
  $args:
    geometry: { $type: geometry, $description: "The dims the checkpoint must have." }
  geometry:
    $kind: type
    $description: >-
      A `WhisperGeometry`, as it serializes: the loader checks the checkpoint's dims against it.
    $type: $object
