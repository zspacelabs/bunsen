[package]
name = "bunsen-tool"
description = "bunsen's models on the command line. `bunsen-tool asr`: speech to text, by profile or with Parakeet TDT, Qwen3-ASR, Voxtral Realtime or Whisper, and who spoke when, through NVIDIA's Sortformer; `bunsen-tool chat`: chat with Qwen3 or nanochat. The chat driver is also a library, `bunsen_tool::chat`."
publish = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
homepage = "https://zspacelabs.ai/bunsen/book/"
documentation = "https://docs.rs/bunsen-tool/latest/"
readme = "README.md"
keywords = ["speech-recognition", "transcription", "chat", "cli", "burn"]
categories = ["command-line-utilities", "multimedia::audio", "science"]

[[bin]]
name = "bunsen-tool"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["speech", "live", "webhook", "mqtt"]
## `asr`: speech to text and diarization (`bunsen_tool::asr`), on bunsen's speech
## kits.
speech = [
    "bunsen/speech",
]
## `asr live` and `asr family <family> live`: the microphone through the host's audio API (`cpal`;
## on Linux it links ALSA, `libasound2-dev`), and Ctrl-C as a clean stop.
live = ["speech", "dep:cpal", "dep:ctrlc"]
## `--publish` to a `webhook` target: each record POSTed as JSON (`ureq`).
webhook = ["speech", "dep:ureq"]
## `--publish` to an `mqtt` target: each record published to a broker
## (`rumqttc`, plain TCP).
mqtt = ["speech", "dep:rumqttc"]
## Make `--device cuda` available.
cuda = ["bunsen-app/cuda"]
## Make `--device metal` available.
metal = ["bunsen-app/metal"]
## Make `--device vulkan` available.
vulkan = ["bunsen-app/vulkan"]
## Make `--device wgpu` available.
wgpu = ["bunsen-app/wgpu"]

[dependencies]
burn = { workspace = true }
# The backend is chosen at run time with `--device`, from those compiled in
# through this crate's backend features; the CPU is always there.
#
# Without bunsen's defaults: the kits, the checkpoint readers (`store`), the
# cache every command loads through, `indicatif`'s progress bar on every
# weights transfer, and the tokenizers every chat family, `decide` and Whisper
# read text through (`tokenizer`). `speech` adds the speech kits.
bunsen = { version = "0.42.0", path = "../bunsen", default-features = false, features = [
    "kits",
    "store",
    "cache",
    "indicatif",
    "tokenizer",
] }
bunsen-app = { version = "0.42.0", path = "../bunsen-app" }
clap = { workspace = true, features = ["derive"] }
cpal = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }
log = { workspace = true }
# Qwen3's chat template renders through `minijinja`, with Python's string
# methods (`minijinja-contrib`'s `pycompat`).
minijinja = { version = "2", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
rumqttc = { version = "0.25.1", default-features = false, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# A `version` tag's release order, for the `latest` selection step.
semver = { workspace = true }
# "did you mean?" on a failed lookup.
strsim = { workspace = true }
# YAML, for `--format yml`.
serde-saphyr = { workspace = true, features = ["serialize"] }
time = { workspace = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
bunsen = { path = "../bunsen", features = ["testing"] }
tempfile = { workspace = true }
