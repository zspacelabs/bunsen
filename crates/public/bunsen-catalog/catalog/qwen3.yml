# Generated by `cargo catalog update` from its probe-contract source; don't edit by hand.
$description: The Qwen3 checkpoints bunsen knows by name.
qwen:
  $kind: namespace
  $merge: update
  qwen3:
    $kind: namespace
    $description: Qwen's dense Qwen3 language models, as transformers ships them.
    $facet: family
    $requires:
    - instruct
    - thinking
    - reasoning
    - language
    - parameters
    hybrid:
      $kind: template_class
      $description: >-
        The Qwen3 chat models that think or answer at once, as the chat template's
        `enable_thinking` says.
      instruct: true
      reasoning: true
      $presets:
        $axes:
          thinking:
            $offers:
            - thinking
            - no-thinking
            $default: thinking
        thinking:
          $description: >-
            think before answering, under the card's thinking sampling (the checkpoint's
            generation_config.json)
          $patch:
            generation:
              template_kwargs:
                enable_thinking: true
        no-thinking:
          $description: "answer at once, under the card's non-thinking sampling: temperature 0.7, top-p 0.8, top-k 20, min-p 0"
          $patch:
            generation:
              sampling:
                min_p: 0.0
                temperature: 0.7
                top_k: 20
                top_p: 0.8
              template_kwargs:
                enable_thinking: false
    qwen3-2507:
      $kind: namespace
      $description: "The Qwen3 2507 updates: one thinking mode each, and a 256K context."
    qwen3guard:
      $kind: namespace
      $description: "Qwen3Guard-Gen: Qwen3 tuned to moderate prompts and responses."
