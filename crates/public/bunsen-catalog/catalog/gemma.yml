# Generated by `cargo catalog update` from its probe-contract source; don't edit by hand.
$description: The Gemma checkpoints bunsen knows by name.
gemma:
  $kind: namespace
  $merge: update
  gemma:
    $kind: namespace
    $description: Google's Gemma 1, 2 and 3 text models, from their unsloth/ mirrors.
    $facet: family
    $requires:
      - instruct
      - thinking
      - reasoning
      - language
      - parameters
    gemma:
      $kind: template_class
      $description: "Google's Gemma models: a row's own chat template where it has one, else
        bunsen's rendering of Gemma's turn format."
      reasoning: false
      $presets:
        $common:
          generation:
            chat_template: |-
              {{- bos_token -}}
              {%- if messages and messages[0]['role'] == 'system' -%}
              {%- set prefix = messages[0]['content'] | trim ~ '\n\n' -%}
              {%- set turns = messages[1:] -%}
              {%- else -%}
              {%- set prefix = '' -%}
              {%- set turns = messages -%}
              {%- endif -%}
              {%- for message in turns -%}
              {%- set role = 'model' if message['role'] == 'assistant' else message['role'] -%}
              {{- '<start_of_turn>' ~ role ~ '\n' ~ (prefix if loop.first else '') ~ (message['content'] | trim) ~ '<end_of_turn>\n' -}}
              {%- endfor -%}
              {%- if add_generation_prompt -%}
              {{- '<start_of_turn>model\n' -}}
              {%- endif -%}
        $axes:
          thinking:
            $offers:
              - no-thinking
            $default: no-thinking
        no-thinking:
          $description: "Answer at once: this model doesn't think."
    gemma-3-270m:
      $kind: build
      $description: "Gemma 3 270M: the pretrained model."
      $template_class: gemma
      $license: Gemma Terms of Use
      $origin: https://huggingface.co/google/gemma-3-270m
      $contract: gemma-lm
      $resources:
        checkpoint: checkpoint
        config: config
        generation_config: generation_config
        tokenizer: tokenizer
        tokenizer_config: tokenizer_config
      instruct: false
      language:
        - en
        - "*"
      parameters: 270000000
      $presets:
        $common:
          generation:
            sampling:
              min_p: null
              temperature: 1.0
              top_k: 64
              top_p: 0.95
            stop_ids:
              - 1
      checkpoint:
