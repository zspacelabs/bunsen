# Generated by `cargo catalog update` from its probe-contract source; don't edit by hand.
$description: The Qwen3.5 checkpoints bunsen knows by name.
qwen:
  $kind: namespace
  $merge: update
  qwen3.5:
    $kind: namespace
    $description: >-
      Qwen's dense Qwen3.5 language models (their text models), as transformers ships
      them.
    $facet: family
    $requires:
      - instruct
      - thinking
      - reasoning
      - language
      - parameters
    qwen3.5:
      $kind: template_class
      $description: "The Qwen3.5 chat models that think before answering unless the chat template's
        `enable_thinking` is false: the 4B and up."
      instruct: true
      reasoning: true
      $presets:
        $axes:
          thinking:
            $offers:
              - thinking
              - no-thinking
            $default: thinking
        thinking:
          $description: "think before answering, under the card's thinking sampling for text:
            temperature 1.0, top-p 0.95, top-k 20, min-p 0 (its presence penalty of 1.5 is not one
            of bunsen's knobs)"
          $patch:
            generation:
              sampling:
                min_p: 0.0
                temperature: 1.0
                top_k: 20
                top_p: 0.95
              template_kwargs:
                enable_thinking: true
        no-thinking:
          $description: "answer at once, under the card's non-thinking sampling for text:
            temperature 1.0, top-p 1.0, top-k 20, min-p 0 (its presence penalty of 2.0 is not one of
            bunsen's knobs)"
          $patch:
            generation:
              sampling:
                min_p: 0.0
                temperature: 1.0
                top_k: 20
                top_p: 1.0
              template_kwargs:
                enable_thinking: false
