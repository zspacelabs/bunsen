          $patch:
            streaming:
              chunk_len: 9
              fifo_len: 264
              latest_boost: 0.05
              left_context: 0
              min_pos_scores_rate: 0.5
              pred_score_threshold: 0.25
              right_context: 4
              silence_frames_per_speaker: 1
              silence_threshold: 0.2
              spkcache_len: 264
              strong_boost_rate: 0.75
              update_period: 222
              weak_boost_rate: 1.5
        offline:
          $description: "30.4 s: chunks of 340 frames with 40 of look-ahead; the most accurate, for
            files"
          $patch:
            streaming:
              chunk_len: 340
              fifo_len: 40
              latest_boost: 0.05
              left_context: 0
              min_pos_scores_rate: 0.5
              pred_score_threshold: 0.25
              right_context: 40
