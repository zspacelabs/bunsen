# Generated by `cargo catalog update` from its probe-contract source; don't edit by hand.
$description: The Whisper checkpoints bunsen knows by name.
openai:
  $kind: namespace
  $merge: update
  whisper:
    $kind: namespace
    $description: OpenAI's Whisper checkpoints, as `openai-whisper` names and pins them.
    $facet: family
    $requires:
      - language
      - translate
      - parameters
    multilingual:
      $kind: template_class
      $description: "The multilingual checkpoints that translate: transcribe in the speech's own
        language, or translate to English."
      language:
        - en
        - "*"
      translate: true
      $presets:
        $axes:
          task:
            $offers:
              - transcribe
              - translate
            $default: transcribe
        transcribe:
          $description: emit the speech in its own language
          $patch:
            task: Transcribe
        translate:
          $description: translate the speech to English
          $patch:
            task: Translate
    gpt2.tiktoken:
      $kind: resource
      $file: gpt2.tiktoken
      $format: tiktoken
      $sha256: 306cd27f03c1a714eca7108e03d66b7dc042abe8c258b44c199a7ed9838dd930
      $size: 835554
      $sources:
        - $base_url: >-
            https://raw.githubusercontent.com/openai/whisper/839639a223b92ad61851baae9ad8a695ccb41ce5/whisper/assets
    multilingual.tiktoken:
      $kind: resource
      $file: multilingual.tiktoken
      $format: tiktoken
      $sha256: b34b360dbb493e781e479794586d661700670d65564001f23024971d1f2fa126
      $size: 816730
      $sources:
        - $base_url: >-
            https://raw.githubusercontent.com/openai/whisper/839639a223b92ad61851baae9ad8a695ccb41ce5/whisper/assets
    large:
      $kind: namespace
      $description: The large Whisper models.
      release:
        $kind: release
        $description: The large Whisper releases, each a drop-in update.
      large-v1:
        $kind: build
        $description: 1550 M parameters, multilingual.
        $join:
          - $group: release
            $released: 2022-09
        $template_class: multilingual
        $license: MIT
        $origin: https://github.com/openai/whisper/blob/main/whisper/__init__.py
        $contract: whisper-asr
        $resources:
          checkpoint: checkpoint
          vocabulary: multilingual.tiktoken
        $args:
          geometry:
            d_head: 64
            d_model: 1280
            max_audio_ctx: 3000
            max_text_ctx: 448
            n_decoder_layers: 32
            n_encoder_layers: 32
            n_mels: 80
            vocab_size: 51865
        parameters: 1550000000
        checkpoint:
          $kind: resource
          $file: large-v1.pt
          $format: pytorch fp16
          $sha256: e4b87e7e0bf463eb8e6956e646f1e277e901512310def2c24bf0e11bd3c28e9a
          $size: 3086999982
