# Generated by `cargo catalog update` from its probe-contract source; don't edit by hand.
$description: "The ResNet checkpoints bunsen knows by name: torchvision's, and timm's hub repos."
resnet:
  $kind: namespace
  $description: ResNet ImageNet-1k classifiers.
  $facet: family
torchvision:
  $kind: namespace
  $merge: update
  resnet18:
    $kind: build
    $description: TorchVision ResNet-18.
    $join:
      - resnet
    $license: bsd-3-clause
    $origin: https://github.com/pytorch/vision
    $contract: resnet-classifier
    $resources:
      checkpoint: checkpoint
      label_names: /imagenet/lemmas
      labels: /imagenet/synsets-1k
    $args:
      eval_transform:
        channels: 3
        crop_mode: Center
        crop_pct: 0.875
        interpolation: Bilinear
        mean:
          - 0.485
          - 0.456
          - 0.406
        size:
          - 224
          - 224
        std:
          - 0.229
          - 0.224
          - 0.225
      geometry:
        activation: Relu
        anti_alias: null
        attention: null
        avg_down: false
        bottleneck_policy: null
        channels:
          - 64
          - 128
          - 256
          - 512
        conv_stem_width: 64
        drop_rate: 0.0
        global_pool: Avg
        in_channels: 3
        layers:
          - 2
          - 2
          - 2
          - 2
        normalization:
          Batch:
            epsilon: 0.00001
            momentum: 0.1
            num_features: 0
        num_classes: 1000
        output_stride: 32
        replace_stem_pool: false
        stem_type: Single
        stem_width: 64
    checkpoint:
      $kind: resource
      $file: resnet18-f37072fd.pth
