# Generated by `cargo catalog update` from its probe-contract source; don't edit by hand.
$description: "bunsen's vocabulary: the contracts, facets, registered axes and tags, and the
  template-class root."
$contracts:
  laya-decision:
    $kind: contract
    $description: "A Laya decision model: a ModernBERT encoder and a decision head, in one
      safetensors file."
    $resources:
      agent_config:
        $description: The decision head's config.
        $format:
          - json
      checkpoint:
        $description: The encoder's and the head's weights.
        $format:
          - safetensors
      encoder_config:
        $description: The encoder's transformers `config.json`.
        $format:
          - json
      tokenizer:
        $format:
          - tokenizer.json
      tokenizer_config:
        $format:
          - tokenizer_config.json
  resnet-classifier:
    $kind: contract
    $description: "A ResNet image classifier: a PyTorch state dict, in the geometry its build
      states."
    $resources:
      checkpoint:
        $description: The state dict, torchvision's or timm's.
        $format:
          - pytorch fp32
    $args:
      geometry:
        $description: The network's blocks and widths.
        $type: geometry
    geometry:
      $kind: type
      $description: "A `ResNetContractConfig`, as it serializes: the loader verifies it against the
        weights."
      $type: $object
  gemma-lm:
    $kind: contract
    $description: "A Gemma 1, 2 or 3 text model, as transformers lays it out: its geometry from
      `config.json`."
    $resources:
      chat_template:
        $description: The chat template, as its own file.
        $format:
          - chat_template.jinja
        $optional: true
      checkpoint:
        $description: "The weights: one file, or an index and its shards."
        $format:
          - safetensors
          - safetensors-index
      config:
        $description: "transformers' `config.json`: the geometry."
        $format:
          - json
      generation_config:
        $description: The stop tokens and the sampling.
        $format:
          - generation_config.json
      tokenizer:
        $format:
          - tokenizer.json
      tokenizer_config:
        $description: >-
          The special tokens, and the chat template when no `chat_template.jinja` is
          given.
        $format:
          - tokenizer_config.json
  nanochat-lm:
    $kind: contract
    $description: "A nanochat GPT, as upstream's training run writes it: its geometry from the run's
      `meta_*.json`."
    $resources:
      checkpoint:
        $description: The model's state dict, `model_*.pt`.
        $format:
          - pytorch
      meta:
        $description: "The run's `meta_*.json`: the geometry."
        $format:
          - nanochat-meta.json
      token_bytes:
        $description: "`token_bytes.pt`: each token's length in bytes, for bits per byte."
        $format:
          - pytorch
      tokenizer:
        $description: "`tokenizer.pkl`: the pickled tiktoken encoding."
        $format:
          - tiktoken-pickle
  qwen3-lm:
    $kind: contract
    $description: "A dense Qwen3 causal LM, as transformers lays it out: its geometry from
      `config.json`."
    $resources:
      checkpoint:
        $description: "The weights: one file, or an index and its shards."
        $format:
          - safetensors
          - safetensors-index
      config:
        $description: "transformers' `config.json`: the geometry, and the positions it was trained
          on."
        $format:
          - json
      generation_config:
        $description: The stop tokens and the sampling.
        $format:
          - generation_config.json
      tokenizer:
        $format:
          - tokenizer.json
      tokenizer_config:
        $description: The chat template, and the special tokens.
        $format:
          - tokenizer_config.json
  qwen3.5-lm:
    $kind: contract
    $description: "A dense Qwen3.5 checkpoint's text model, as transformers lays it out: its
      geometry from `config.json`."
    $resources:
      chat_template:
        $description: The chat template, as its own file.
        $format:
          - chat_template.jinja
        $optional: true
      checkpoint:
        $description: "The weights: one file, or an index and its shards."
        $format:
          - safetensors
          - safetensors-index
      config:
        $description: "transformers' `config.json`: the geometry, under `text_config`."
        $format:
          - json
      generation_config:
        $description: The stop tokens and the sampling.
        $format:
          - generation_config.json
        $optional: true
      tokenizer:
        $format:
          - tokenizer.json
      tokenizer_config:
        $description: >-
          The special tokens, and the chat template when no `chat_template.jinja` is
          given.
        $format:
          - tokenizer_config.json
  parakeet-asr:
    $kind: contract
    $description: "A Parakeet TDT speech recognizer: a Phonon-2 archive, or transformers'
      safetensors and its tokenizer."
    $resources:
      checkpoint:
        $description: "The weights: a Phonon-2 archive carries its config and vocabulary too."
        $format:
          - phonon archive
          - safetensors
      vocabulary:
        $description: The tokenizer, beside safetensors weights.
        $format:
          - tokenizer.json
        $optional: true
  qwen3-asr:
    $kind: contract
    $description: "A Qwen3-ASR speech recognizer: a Phonon-1 archive or transformers' safetensors,
      and its tokenizer."
    $abstract: true
    $resources:
      checkpoint:
        $description: "The weights: a Phonon-1 archive carries its vocabulary too."
        $format:
          - phonon archive
          - safetensors
      vocabulary:
        $description: "The tokenizer, beside safetensors weights: a Phonon-1 archive carries its
          own."
        $format:
          - tokenizer.json
        $optional: true
    geometry:
      $kind: type
      $description: "A `Qwen3AsrConfig`, as it serializes: the loader verifies it against the
        weights."
      $type: $object
    probed:
      $kind: contract
      $description: Its geometry read from transformers' `config.json`.
      $resources:
        config:
          $description: "transformers' `config.json`: the geometry."
          $format:
            - json
    stated:
      $kind: contract
      $description: Its geometry stated, for weights that carry none.
      $args:
        geometry:
          $description: The audio tower's and the text model's dims.
          $type: geometry
  voxtral-asr:
    $kind: contract
    $description: "A Voxtral Realtime speech recognizer: its safetensors and its tekken vocabulary."
    $abstract: true
    $resources:
      checkpoint:
        $description: The weights.
        $format:
          - safetensors
      vocabulary:
        $format:
          - tekken.json
    geometry:
      $kind: type
      $description: "A `VoxtralConfig`, as it serializes: the loader verifies it against the
        weights."
      $type: $object
    probed:
      $kind: contract
      $description: Its geometry read from transformers' `config.json`.
      $resources:
        config:
          $description: "transformers' `config.json`: the geometry."
          $format:
            - json
    stated:
      $kind: contract
      $description: Its geometry stated, for weights that carry none.
      $args:
        geometry:
          $description: The audio encoder's and the text decoder's dims.
          $type: geometry
  whisper-asr:
    $kind: contract
    $description: >-
      An OpenAI Whisper checkpoint, as openai-whisper saves it, and its tiktoken
      vocabulary.
    $resources:
      checkpoint:
        $description: "The `.pt`: the weights and the dims they are laid out in."
        $format:
          - pytorch fp16
      vocabulary:
        $description: "`multilingual.tiktoken` or `gpt2.tiktoken`, as the token layout needs."
        $format:
          - tiktoken
    $args:
      geometry:
        $description: The dims the checkpoint must have.
        $type: geometry
    geometry:
      $kind: type
      $description: "A `WhisperGeometry`, as it serializes: the loader checks the checkpoint's dims
        against it."
      $type: $object
  sortformer-diarizer:
    $kind: contract
    $description: "A Sortformer speaker diarizer: a `.nemo` archive, which carries its config, or
      transformers' safetensors."
    $resources:
      checkpoint:
        $description: The weights, and in a `.nemo` its NeMo config.
        $format:
          - nemo
          - safetensors
  silero-vad:
    $kind: contract
    $description: "The Silero voice-activity detector at 16 kHz: upstream's state dict."
    $resources:
      checkpoint:
        $description: The 16 kHz branch's weights.
        $format:
          - safetensors
publisher:
  $kind: facet
  $description: Who publishes the checkpoints.
family:
  $kind: facet
  $description: A line of related architectures.
thinking:
  $kind: axis
  $description: whether the model thinks before it answers.
  $axis: bool
task:
  $kind: axis
  $description: "what the model emits: the speech's own language, or English."
  $axis: categorical
  $members:
    - transcribe
    - translate
latency:
  $kind: axis
  $description: how far behind the audio the diarizer runs.
  $axis: categorical
  $members:
    - ultra-low
    - very-low
    - low
    - offline
    - high
postprocess:
  $kind: axis
  $description: how speaker activity becomes turns.
  $axis: categorical
  $members:
    - none
    - dihard3
    - callhome
vad-policy:
  $kind: axis
  $description: how speech regions are cut from the VAD's probabilities.
  $axis: categorical
  $members:
    - silero
    - faster-whisper
language:
  $kind: tag
  $description: the languages it handles, as BCP 47 tags; "*" for unspecified others.
  $type: $languages
parameters:
  $kind: tag
  $description: >-
    the total parameter count, tied weights counted once, as the publisher states
    it.
  $type: $count
active_parameters:
  $kind: tag
  $description: the parameters active per token, for a mixture of experts.
  $type: $count
scores:
  $kind: tag
  $description: measured scores, by name.
  $type:
    $map: $number
reasoning:
  $kind: tag
  $description: it was trained to reason.
  $type: $bool
instruct:
  $kind: tag
  $description: Tuned to follow instructions; `false` for a pretrained base checkpoint.
  $type: $bool
translate:
  $kind: tag
  $description: it can translate.
  $type: $bool
template_class_root:
  $kind: template_class
  $description: The root of every template-class chain.
  $required_facets:
    - publisher
    - family
