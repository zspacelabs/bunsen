[alias]
# Runs the validation crates under a profile (`tools/validate`; README.md,
# "Choosing what to validate").
validate = "run -q -p validate --"
# Builds bunsen's built-in catalog from its probe contracts
# (`catalog_builder`).
catalog = "run -q -p catalog-builder --"
# Times the kits' decodes on the catalog's checkpoints (`tools/timing`).
timing = "run -q -p timing --bin timing --"
