  laya:
    package: laya-model-validation
    features: [checkpoints, gpu-tests]
    models:
      laya:
        size: small
        gb: 0.85
        core: true
        dtypes: [f32]
        varies: the English model - ModernBERT-large (global and two-sided local layers, two rotary
          bases), the decision head, ModernBERT's tokenizer, a state cut to 512 tokens
      laya-multilingual:
        size: small
        gb: 0.68
        core: true
        dtypes: [f32]
        varies: mmBERT-base (one rotary base, a 256k vocabulary), Gemma's SentencePiece tokenizer
          and its `<mask>` specials, a non-English state, a state cut to 1024 tokens
      laya-typed-decisions:
        size: small
        gb: 0.85
        core: false
        dtypes: [f32]
        varies: the English model's architecture, trained on typed questions
  qwen3-tts:
    package: qwen3-tts-model-validation
    features: [checkpoints, gpu-tests]
    models:
      qwen3-tts-12hz-0.6b-customvoice:
        size: medium
        gb: 2.5
        core: true
        dtypes: [f32, bf16]
        varies: the 0.6B CustomVoice model - a Qwen3 talker over summed text and codec
          embeddings, the code predictor (a depth decoder over 15 codebooks), the dual-track prompt
          (stock speakers, languages and a dialect under `auto`, text upfront and interleaved); the
          12 Hz codec's decoder (split RVQ, windowed attention, ConvNeXt upsamplers, a SnakeBeta
          vocoder, chunked decode); the tokenizer from slow files; the TTS driver, its speech
          transcribed by Whisper
  zonos3:
    package: zonos3-model-validation
    features: [checkpoints, gpu-tests]
    models:
      zonos3-mini:
        size: medium
        gb: 2.4
        core: true
        dtypes: [f32, bf16]
        varies: the only model - attention-residual routing over a hybrid of gated DeltaNet and
          gated attention layers, sparse MoE with a latent bottleneck, speaker / condition rows,
          the delayed codebook prompt; its codec's decoder (ConvNeXt, inverse STFT, resampler);
          the SuperBPE tokenizer
