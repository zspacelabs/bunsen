# The models the validation crates check, and what each stands for.
#
# `cargo validate` (`tools/validate`) reads this and a profile
# (`profiles/*.yml`) and runs the chosen models' tests; see README.md,
# "Choosing what to validate".
#
# Per crate:
#   package     the validation crate.
#   features    always on when the crate runs.
#   reference   the feature that builds the crate's ONNX reference, turned on
#               when a chosen model has `reference: true`.
#
# Each test of a model has the model's id in its path, as a whole segment
# (`qwen3-0.6b` -> `...::qwen3_0_6b::...`).
#
# Per model (the id is bunsen's row name):
#   size        `small` (fetches up to ~1 GB, its reference included),
#               `medium` (up to ~10 GB) or `large`.
#   gb          what it fetches on a cold cache.
#   core        whether it is a representative: the one model for an
#               architecture variation the kit has. The others repeat one.
#   reference   whether its tests need the crate's `reference` feature.
#   dtypes      what it is checked in; `bf16` checks run on `cuda` alone.
#   varies      the variation it stands for (core), or repeats (not core).
#
# A test is a *driver* check when its path has a `driver` segment
# (`speech::driver::phonon_2`): a stream driver held to the same model's
# one-shot decode. Every other test of a model is a *model* check: the model
# against its reference. A profile's `checks` chooses between them.

crates:
  qwen3:
    package: qwen3-model-validation
    features: [checkpoints, gpu-tests]
    reference: reference
    models:
      qwen3-0.6b:
        size: medium
        gb: 3.9
        core: true
        reference: true
        dtypes: [f32]
        varies: the tied head, the ONNX reference (2.4 GB), the thinking chat template and its sessions
      qwen3-1.7b:
        size: medium
        gb: 4.1
        core: false
        dtypes: [f32]
        varies: a wider geometry of qwen3-0.6b's architecture
      qwen3-4b:
        size: medium
        gb: 8.0
        core: false
        dtypes: [f32]
        varies: a deeper geometry of qwen3-0.6b's architecture
      qwen3-4b-instruct-2507:
        size: medium
        gb: 8.0
        core: false
        dtypes: [f32]
        varies: a rotary base of 5e6 (a config value the config tests read), the non-thinking template and its sessions

  silero:
    package: silero-model-validation
    features: [checkpoints, gpu-tests]
    reference: reference
    models:
      silero/vad-16k:
        size: small
        gb: 0.004
        core: true
        reference: true
        dtypes: [f32]
        varies: the only model - its ONNX graph (both rates), the bundle, the kits' recording, the stream
  whisper:
    package: whisper-model-validation
    features: [checkpoints, gpu-tests]
    reference: reference
    models:
      openai/base:
        size: small
        gb: 0.7
        core: true
        reference: true
        dtypes: [f32]
        varies: the OpenAI layout and its decodes, the ONNX reference, the bundle, the transformers conversion
      openai/tiny:
        size: small
        gb: 0.08
        core: false
        dtypes: [f32]
        varies: base's architecture, smaller - the stream driver against its one-shot decode, which CI runs
  sortformer:
    package: sortformer-model-validation
    features: [checkpoints, gpu-tests]
    reference: reference
    models:
      nemotron-3-diarization:
        size: small
        gb: 0.8
        core: true
        reference: true
        dtypes: [f32]
        varies: Nemotron-3's feature stacking, its ONNX reference, the streaming presets against NeMo
      sortformer-v2.1:
        size: small
        gb: 1.0
        core: true
        reference: true
        dtypes: [f32]
        varies: the streaming v2 family from its .nemo, its ONNX reference, the latencies against NeMo
      sortformer-v2:
        size: small
        gb: 0.5
        core: false
        dtypes: [f32]
        varies: v2 weights on v2.1's architecture
      sortformer-speakers:
        size: small
        gb: 0.7
        core: false
        dtypes: [f32]
        varies: not a row - speakers over the Parakeet (Phonon-2), Qwen3-ASR (Phonon-1) and Whisper (base) engines, with Nemotron's diarizer

  parakeet:
    package: parakeet-model-validation
    features: [checkpoints, gpu-tests]
    reference: reference
    models:
      fermion/phonon-2:
        size: small
        gb: 0.2
        core: true
        dtypes: [f32]
        varies: the Fermion archive path (a fine-tune on parakeet-tdt-0.6b-v3's architecture), held to its own transformers decode
      nvidia/parakeet-tdt-0.6b-v3:
        size: medium
        gb: 5.0
        core: true
        reference: true
        dtypes: [f32]
        varies: NVIDIA's base weights, the ONNX reference (2.5 GB), stage by stage, the stream driver

  qwen3-asr:
    package: qwen3-asr-model-validation
    features: [checkpoints, gpu-tests]
    reference: reference
    models:
      fermion/phonon-1:
        size: small
        gb: 0.4
        core: true
        dtypes: [f32]
        varies: the Fermion archive path (a fine-tune on Qwen3-ASR-0.6B's architecture), and its stream driver
      fermion/phonon-1-micro:
        size: small
        gb: 0.3
        core: false
        dtypes: [f32]
        varies: a smaller geometry from the same archive path
      fermion/phonon-1-big:
        size: small
        gb: 0.6
        core: false
        dtypes: [f32]
        varies: a larger geometry from the same archive path
      qwen/qwen3-asr-0.6b:
        size: medium
        gb: 5.4
        core: true
        reference: true
        dtypes: [f32]
        varies: Qwen's base weights, the ONNX reference (3.8 GB), stage by stage, the alignment heads

  nanochat:
    package: nanochat-model-validation
    features: [checkpoints, gpu-tests]
    models:
      nanochat-d20-rl:
        size: medium
        gb: 2.1
        core: true
        dtypes: [f32, bf16]
        varies: upstream's 2025 model (nanochat-students/rl-d20), its tokenizer, chat sessions, bf16 sampling
      nanochat-d18-sft:
        size: medium
        gb: 2.1
        core: true
        dtypes: [f32, bf16]
        varies: upstream's 2026 model (nitishpandey04/nanochat-d18-sft) - smear, value embeddings, windows - its tokenizer, chat sessions
      nanochat-d20-base:
        size: medium
        gb: 2.1
        core: false
        dtypes: [f32, bf16]
        varies: another stage of the 2025 model (nanochat-students/base-d20)
      nanochat-d20-mid:
        size: medium
        gb: 2.1
        core: false
        dtypes: [f32, bf16]
        varies: another stage of the 2025 model (nanochat-students/mid-d20)
      nanochat-d18-base:
        size: medium
        gb: 2.1
        core: false
        dtypes: [f32, bf16]
        varies: another stage of the 2026 model (nitishpandey04/nanochat-d18-base)
  voxtral:
    package: voxtral-model-validation
    features: [checkpoints, gpu-tests]
    reference: reference
    models:
      mistralai/voxtral-mini-4b-realtime-2602:
        size: large
        gb: 28.3
        core: true
        reference: true
        dtypes: [f32]
        varies: the only model - its ONNX reference (19.4 GB), the front end, the tekken vocabulary, streaming transcription
