# The models the validation crates check, and what each stands for.
#
# `cargo validate` (`tools/validate`) reads this and a profile
# (`profiles/*.yml`) and runs the chosen models' tests; see README.md,
# "Choosing what to validate".
#
# Per crate:
#   package     the validation crate.
#   features    always on when the crate runs.
#   reference   the feature that builds the crate's ONNX reference, turned on
#               when a chosen model has `reference: true`.
#
# Each test of a model has the model's id in its path, as a whole segment
# (`qwen3-0.6b` -> `...::qwen3_0_6b::...`).
#
# Per model (the id is bunsen's row name):
#   size        `small` (fetches up to ~1 GB, its reference included),
#               `medium` (up to ~10 GB) or `large`.
#   gb          what it fetches on a cold cache.
#   core        whether it is a representative: the one model for an
#               architecture variation the kit has. The others repeat one.
#   reference   whether its tests need the crate's `reference` feature.
#   dtypes      what it is checked in; `bf16` checks run on `cuda` alone.
#   varies      the variation it stands for (core), or repeats (not core).
#
# A test is a *driver* check when its path has a `driver` segment
# (`speech::driver::phonon_2`): a stream driver held to the same model's
# one-shot decode. Every other test of a model is a *model* check: the model
# against its reference. A profile's `checks` chooses between them.

crates:
  qwen3:
    package: qwen3-model-validation
    features: [checkpoints, gpu-tests]
    reference: reference
    models:
      qwen3-0.6b:
        size: medium
        gb: 3.9
        core: true
        reference: true
        dtypes: [f32, bf16]
        varies: the tied head, the ONNX reference (2.4 GB), the thinking chat template and its
          sessions; the long bf16 report (`long_bf16::`)
      qwen3-1.7b:
        size: medium
        gb: 4.1
        core: false
        dtypes: [f32]
        varies: a wider geometry of qwen3-0.6b's architecture
      qwen3-4b:
        size: medium
        gb: 8.0
        core: false
        dtypes: [f32, bf16]
        varies: a deeper geometry of qwen3-0.6b's architecture
      qwen3-4b-instruct-2507:
        size: medium
        gb: 8.0
        core: false
        dtypes: [f32]
        varies: a rotary base of 5e6 (a config value the config tests read), the non-thinking
          template and its sessions
      qwen3-8b:
        size: large
        gb: 16.4
        core: true
        dtypes: [bf16]
        varies: the untied output head (`tie_word_embeddings` false); bf16 on cuda alone, too large
          for float32 on 24 GB

  gemma:
    package: gemma-model-validation
    features: [checkpoints, gpu-tests]
    models:
      gemma-3-270m:
        size: small
        gb: 0.5
        core: true
        dtypes: [f32]
        varies: Gemma 3 at its smallest - the sandwich, QK-norm, the 5:1 pattern and its two rotary
          tables, the scaled embedding, the tied head; a decode past its window (512)
      gemma-3-1b-pt:
        size: medium
        gb: 2.0
        core: false
        dtypes: [f32]
        varies: a wider, deeper geometry of gemma-3-270m's architecture
      gemma-3-4b-pt:
        size: medium
        gb: 8.6
        core: true
        dtypes: [f32]
        varies: the linear x8 global table, grouped-query heads, the multimodal checkpoint's text
          model (its tower dropped), a window of 1024
      gemma-2-2b:
        size: large
        gb: 10.5
        core: true
        dtypes: [f32]
        varies: Gemma 2 - the attention and final soft-caps, alternating layers, one table; stored
          in f32 on disk; a decode past its window (4096)
      gemma-2-9b:
        size: large
        gb: 18.5
        core: true
        dtypes: [bf16]
        varies: Gemma 2 in bf16 on cuda alone (too large for float32 on 24 GB), where bunsen's bf16
          norms are measured against transformers'
      gemma-2-9b-it:
        size: large
        gb: 18.5
        core: true
        dtypes: [bf16]
        varies: the instruction-tuned Gemma 2 9B in bf16 on cuda alone (too large for float32 on 24
          GB), at the end of the long conversation
      gemma-3-1b-it:
        size: medium
        gb: 2.0
        core: true
        dtypes: [f32, bf16]
        varies: the instruction-tuned Gemma 3 - its greedy decode, the long conversation in f32 and
          bf16 (bf16 on cuda alone), chat sessions against transformers' replies (stopping at the
          end of a turn), the tokenizer and the chat template that folds a system turn into the
          first user turn
      gemma-2-2b-it:
        size: medium
        gb: 5.2
        core: true
        dtypes: [f32, bf16]
        varies: the instruction-tuned Gemma 2 - its greedy decode and the long conversation in f32
          (on the CPU, as its table binds no wgpu buffer) and bf16 (on cuda alone), chat sessions
          against transformers' replies, Gemma 2's chat template, which refuses a system turn

