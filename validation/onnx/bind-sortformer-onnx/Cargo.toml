[package]
name = "bind-sortformer-onnx"
description = "Bunsen bundled Sortformer diarization assets: fetches NVIDIA's Nemotron-3-Diarization and streaming Sortformer v2 and v2.1 checkpoints, and ONNX exports of Nemotron and v2.1, at build time, digest-pinned, each behind a feature, and generates Rust reference models from the exports. Hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
burn = { workspace = true, features = ["store"] }
burn-store = { workspace = true, features = ["std"] }
document-features = { workspace = true }

[build-dependencies]
bunsen-fetch = { path = "../../../crates/public/bunsen-fetch", features = ["fetch"] }
burn-onnx = { workspace = true, optional = true }
onnx-ir = { workspace = true, optional = true }

[lints]
workspace = true

[features]
## Nothing by default: building this crate as a workspace member fetches
## nothing. `sortformer-model-validation/download` turns on every feature.
default = []

## Fetch NVIDIA's `Nemotron-3-Diarization` as `transformers` ships it
## (`model.safetensors`, 397 MB, and `config.json`), laid out under
## `cache_dir()`.
##
## A bunsen pretrained cache rooted at that directory resolves
## `nvidia/nemotron-3-diarization` from it, offline. These are the weights the
## `onnx_gen` reference carries.
checkpoint_nemotron = []

## Fetch `altunenes/parakeet-rs`'s ONNX export of NVIDIA's
## `Nemotron-3-Diarization` (401 MB), rewrite the two constructs `burn-onnx`
## cannot import, and generate a Rust model from it, in `crate::onnx_gen`.
##
## This is the *reference implementation*: it exists so
## `sortformer-model-validation` has something with independent provenance to
## disagree with. The export carries the weights of NVIDIA's checkpoint
## exactly.
onnx_gen = ["dep:burn-onnx", "dep:onnx-ir"]

## Fetch NVIDIA's streaming Sortformer v2 (`diar_streaming_sortformer_4spk-v2`)
## `.nemo` (471 MB), laid out under `cache_dir()`. CC-BY-4.0.
checkpoint_v2 = []

## Fetch NVIDIA's streaming Sortformer v2.1
## (`diar_streaming_sortformer_4spk-v2.1`) `.nemo` (471 MB), laid out under
## `cache_dir()`: the weights the `onnx_gen_v2_1` reference carries. NVIDIA
## Open Model License.
checkpoint_v2_1 = []

## Fetch `Scrybl`'s ONNX export of NVIDIA's streaming Sortformer v2.1 (492 MB,
## `NeMo`'s own export at opset 17) and generate a Rust model from it, in
## `crate::onnx_gen`: the v2 family's *reference implementation*.
onnx_gen_v2_1 = ["dep:burn-onnx"]
