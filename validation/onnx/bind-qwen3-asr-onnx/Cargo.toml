[package]
name = "bind-qwen3-asr-onnx"
description = "Bunsen bundled Qwen3-ASR assets: fetches FermionResearch's Phonon-1 builds, Qwen's Qwen3-ASR-0.6B and an ONNX export of it at build time, digest-pinned, each behind a feature, and generates Rust reference models from the export. Hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
burn = { workspace = true, features = ["store"] }
burn-store = { workspace = true, features = ["std"] }
document-features = { workspace = true }

[build-dependencies]
bunsen-fetch = { path = "../../../crates/public/bunsen-fetch", features = ["fetch"] }
burn-onnx = { workspace = true, optional = true }

[lints]
workspace = true

[features]
## Nothing by default: building this crate as a workspace member fetches
## nothing. `qwen3-asr-model-validation/download` turns on every feature.
default = []

## Fetch `FermionResearch`'s Phonon-1 archive (415 MB), laid out under
## `cache_dir()`: a bunsen pretrained cache rooted there resolves
## `fermion/phonon-1` from it, offline.
checkpoint = []

## Fetch Phonon-1-Micro (285 MB) and Phonon-1-Big (581 MB), laid out under
## `cache_dir()`. Independent of `checkpoint`.
variant_checkpoints = []

## Fetch Qwen's `Qwen3-ASR-0.6B-hf` `model.safetensors` (1.6 GB) and
## `tokenizer.json`, laid out under `cache_dir()`: a bunsen pretrained cache
## rooted there resolves `qwen/qwen3-asr-0.6b` from it, offline.
base_checkpoint = []

## Fetch the `OpenVoiceOS/qwen3-asr-0.6b-onnx` export of `Qwen3-ASR-0.6B`
## (~3.8 GB) and generate Rust models from it, in `crate::onnx_gen`.
##
## This is the *reference implementation*: it exists so
## `qwen3-asr-model-validation` has something with independent provenance to
## disagree with. The export carries Qwen's base weights.
onnx_gen = ["dep:burn-onnx"]
