# The gemma kit's pretrained catalog source: `cargo validate catalog` builds it into
# `crates/public/bunsen/src/kits/language/gemma/pretrained/catalog.json`.
#
# Every row is on the `unsloth/` mirror of Google's repo: Google's Gemma 1-3
# repos are gated, the mirrors' files are not.
kit: gemma
out: crates/public/bunsen/src/kits/language/gemma/pretrained/catalog.json
name: "well-known"
description: "the Gemma checkpoints bunsen knows by name"
groups:
  - name: "gemma"
    description: "Google's Gemma 1, 2 and 3 text models, from their unsloth/ mirrors"
    license: "Gemma Terms of Use"
    origin: "https://ai.google.dev/gemma"
    rows:
      - name: "gemma-3-270m"
        description: "Gemma 3 270M: the pretrained model"
        license: "Gemma Terms of Use"
        origin: "https://huggingface.co/google/gemma-3-270m"
        family: "gemma"
        prefab: "gemma-3-270m"
        bundles: ["gemma/gemma-3-270m"]
        probe:
          - { probe: "generation_config", file: "generation_config", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
      - name: "gemma-3-270m-it"
        description: "Gemma 3 270M, instruction-tuned"
        license: "Gemma Terms of Use"
        origin: "https://huggingface.co/google/gemma-3-270m-it"
        family: "gemma"
        prefab: "gemma-3-270m"
        bundles: ["gemma/gemma-3-270m-it"]
        probe:
          - { probe: "generation_config", file: "generation_config", into: ["base"] }
          - { probe: "tokenizer_config", file: "tokenizer_config", token: "<end_of_turn>", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
          - { probe: "chat_template", file: "chat_template", into: ["base"] }
      - name: "gemma-3-1b-pt"
        description: "Gemma 3 1B: the pretrained model"
        license: "Gemma Terms of Use"
        origin: "https://huggingface.co/google/gemma-3-1b-pt"
        family: "gemma"
        prefab: "gemma-3-1b"
        bundles: ["gemma/gemma-3-1b-pt"]
        probe:
          - { probe: "generation_config", file: "generation_config", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
      - name: "gemma-3-1b-it"
        description: "Gemma 3 1B, instruction-tuned"
        license: "Gemma Terms of Use"
        origin: "https://huggingface.co/google/gemma-3-1b-it"
        family: "gemma"
        prefab: "gemma-3-1b"
        bundles: ["gemma/gemma-3-1b-it"]
        probe:
          - { probe: "generation_config", file: "generation_config", into: ["base"] }
          - { probe: "tokenizer_config", file: "tokenizer_config", token: "<end_of_turn>", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
          - { probe: "chat_template", file: "chat_template", into: ["base"] }
      - name: "gemma-3-4b-pt"
        description: "Gemma 3 4B: the pretrained model's text model"
        license: "Gemma Terms of Use"
        origin: "https://huggingface.co/google/gemma-3-4b-pt"
        family: "gemma"
        prefab: "gemma-3-4b"
        bundles: ["gemma/gemma-3-4b-pt"]
        probe:
          - { probe: "generation_config", file: "generation_config", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
      - name: "gemma-3-4b-it"
        description: "Gemma 3 4B, instruction-tuned: its text model"
        license: "Gemma Terms of Use"
        origin: "https://huggingface.co/google/gemma-3-4b-it"
        family: "gemma"
