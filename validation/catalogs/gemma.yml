        description: "Gemma 2B (Gemma 1): the pretrained model"
        license: "Gemma Terms of Use"
        origin: "https://huggingface.co/google/gemma-2b"
        family: "gemma"
        prefab: "gemma-2b"
        bundles: ["gemma/gemma-2b"]
        probe:
          - { probe: "generation_config", file: "generation_config", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
      - name: "gemma-2b-it"
        description: "Gemma 2B (Gemma 1), instruction-tuned"
        license: "Gemma Terms of Use"
        origin: "https://huggingface.co/google/gemma-2b-it"
        family: "gemma"
        prefab: "gemma-2b"
        bundles: ["gemma/gemma-2b-it"]
        probe:
          - { probe: "generation_config", file: "generation_config", into: ["base"] }
          - { probe: "tokenizer_config", file: "tokenizer_config", token: "<end_of_turn>", into: ["base"] }
