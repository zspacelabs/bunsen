        family: "gemma"
        prefab: "gemma-7b"
        bundles: ["gemma/gemma-7b"]
        probe:
          - { probe: "generation_config", file: "generation_config", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
      - name: "gemma-7b-it"
        description: "Gemma 7B (Gemma 1), instruction-tuned"
        license: "Gemma Terms of Use"
        origin: "https://huggingface.co/google/gemma-7b-it"
        family: "gemma"
        prefab: "gemma-7b"
        bundles: ["gemma/gemma-7b-it"]
        probe:
          - { probe: "generation_config", file: "generation_config", into: ["base"] }
          - { probe: "tokenizer_config", file: "tokenizer_config", token: "<end_of_turn>", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
families:
  - name: "gemma"
    description: "Google's Gemma models: a row's own chat template where it has one, else bunsen's rendering of Gemma's turn format"
    presets:
      # Gemma's turn format, as bunsen writes it, for the rows without a template
      # (the pretrained models): `<bos>`, then each turn as
      # `<start_of_turn>{user|model}\n{content, trimmed}<end_of_turn>\n`, a system
      # turn folded into the first user turn (as Gemma 3's own template folds it),
      # and `<start_of_turn>model\n` to open the reply. A row's probed template
      # lies over it.
      base:
        generation:
          chat_template: |-
            {{- bos_token -}}
            {%- if messages and messages[0]['role'] == 'system' -%}
            {%- set prefix = messages[0]['content'] | trim ~ '\n\n' -%}
            {%- set turns = messages[1:] -%}
            {%- else -%}
            {%- set prefix = '' -%}
            {%- set turns = messages -%}
            {%- endif -%}
            {%- for message in turns -%}
            {%- set role = 'model' if message['role'] == 'assistant' else message['role'] -%}
            {{- '<start_of_turn>' ~ role ~ '\n' ~ (prefix if loop.first else '') ~ (message['content'] | trim) ~ '<end_of_turn>\n' -}}
            {%- endfor -%}
            {%- if add_generation_prompt -%}
            {{- '<start_of_turn>model\n' -}}
            {%- endif -%}
