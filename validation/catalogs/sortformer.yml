# The sortformer kit's pretrained catalog source: `cargo validate catalog` builds it into
# `crates/public/bunsen/src/kits/speech/diarization/sortformer/pretrained/catalog.json`.
kit: sortformer
out: crates/public/bunsen/src/kits/speech/diarization/sortformer/pretrained/catalog.json
name: "well-known"
description: "the Sortformer diarizers bunsen knows by name"
groups:
  - name: "nvidia"
    description: "NVIDIA's Sortformer speaker diarizers: Nemotron-3-Diarization as transformers ships it, the streaming Sortformer v2 and v2.1 as NeMo does"
    origin: "https://huggingface.co/nvidia"
    rows:
      - name: "nemotron-3-diarization"
        description: "Nemotron-3-Diarization: 100 M parameters, up to 8 speakers, 10 ms frames, streaming"
        license: "OpenMDW-1.1"
        origin: "https://huggingface.co/nvidia/Nemotron-3-Diarization"
        family: "nemotron"
        bundles: ["nvidia/nemotron-3-diarization"]
      - name: "diar_streaming_sortformer_4spk-v2"
        aliases: ["sortformer-v2"]
        description: "Streaming Sortformer v2: 117 M parameters, up to 4 speakers, 80 ms frames"
        license: "NVIDIA Open Model License"
        origin: "https://huggingface.co/nvidia/diar_streaming_sortformer_4spk-v2"
        family: "sortformer-v2"
        bundles: ["nvidia/diar_streaming_sortformer_4spk-v2"]
      - name: "diar_streaming_sortformer_4spk-v2.1"
        aliases: ["sortformer-v2.1"]
        description: "Streaming Sortformer v2.1: 117 M parameters, up to 4 speakers, 80 ms frames"
        license: "NVIDIA Open Model License"
        origin: "https://huggingface.co/nvidia/diar_streaming_sortformer_4spk-v2.1"
        family: "sortformer-v2"
        bundles: ["nvidia/diar_streaming_sortformer_4spk-v2.1"]
bundles:
  - name: "nvidia/nemotron-3-diarization"
    description: "Nemotron-3-Diarization: model.safetensors"
    license: "OpenMDW-1.1"
    origin: "https://huggingface.co/nvidia/Nemotron-3-Diarization"
    namespace: "nvidia"
    hub: { repo: "nvidia/Nemotron-3-Diarization", revision: "f667ed73aee57d40cc39428eb768b4fd87a0a29e" }
    resources:
      - { key: "checkpoint", file: "model.safetensors", kind: "safetensors", dtype: "float32" }
  - name: "nvidia/diar_streaming_sortformer_4spk-v2"
    description: "Streaming Sortformer v2: diar_streaming_sortformer_4spk-v2.nemo"
    license: "NVIDIA Open Model License"
    origin: "https://huggingface.co/nvidia/diar_streaming_sortformer_4spk-v2"
    namespace: "nvidia"
    hub: { repo: "nvidia/diar_streaming_sortformer_4spk-v2", revision: "84edd514b8ef68004c10086918cd62f2148cbd59" }
    resources:
      - { key: "checkpoint", file: "diar_streaming_sortformer_4spk-v2.nemo", kind: "nemo", dtype: "float32" }
  - name: "nvidia/diar_streaming_sortformer_4spk-v2.1"
    description: "Streaming Sortformer v2.1: diar_streaming_sortformer_4spk-v2.1.nemo"
    license: "NVIDIA Open Model License"
    origin: "https://huggingface.co/nvidia/diar_streaming_sortformer_4spk-v2.1"
    namespace: "nvidia"
    hub: { repo: "nvidia/diar_streaming_sortformer_4spk-v2.1", revision: "cd03eee90fbec18297ac31b8c21546e596b7f71c" }
    resources:
      - { key: "checkpoint", file: "diar_streaming_sortformer_4spk-v2.1.nemo", kind: "nemo", dtype: "float32" }

# The presets every model of a family has: the model cards' streaming
# latencies, and NeMo's turn post-processing. Latency is (chunk_len +
# right_context) encoder frames of 80 ms.
families:
  - name: "nemotron"
    description: "Nemotron-3-Diarization: its model card's streaming latencies"
    presets:
      presets:
        - name: "ultra-low"
          description: "0.32 s: chunks of 3 frames with 1 of look-ahead"
          patch: { streaming: { chunk_len: 3, right_context: 1, fifo_len: 264, spkcache_len: 264, update_period: 222, left_context: 0, silence_frames_per_speaker: 1, pred_score_threshold: 0.25, latest_boost: 0.05, strong_boost_rate: 0.75, weak_boost_rate: 1.5, min_pos_scores_rate: 0.5, silence_threshold: 0.2 } }
        - name: "very-low"
          description: "0.64 s: chunks of 6 frames with 2 of look-ahead"
          patch: { streaming: { chunk_len: 6, right_context: 2, fifo_len: 264, spkcache_len: 264, update_period: 222, left_context: 0, silence_frames_per_speaker: 1, pred_score_threshold: 0.25, latest_boost: 0.05, strong_boost_rate: 0.75, weak_boost_rate: 1.5, min_pos_scores_rate: 0.5, silence_threshold: 0.2 } }
        - name: "low"
          description: "1.04 s: chunks of 9 frames with 4 of look-ahead"
          patch: { streaming: { chunk_len: 9, right_context: 4, fifo_len: 264, spkcache_len: 264, update_period: 222, left_context: 0, silence_frames_per_speaker: 1, pred_score_threshold: 0.25, latest_boost: 0.05, strong_boost_rate: 0.75, weak_boost_rate: 1.5, min_pos_scores_rate: 0.5, silence_threshold: 0.2 } }
        - name: "offline"
          description: "30.4 s: chunks of 340 frames with 40 of look-ahead; the most accurate, for files"
          patch: { streaming: { chunk_len: 340, right_context: 40, fifo_len: 40, spkcache_len: 264, update_period: 300, left_context: 0, silence_frames_per_speaker: 1, pred_score_threshold: 0.25, latest_boost: 0.05, strong_boost_rate: 0.75, weak_boost_rate: 1.5, min_pos_scores_rate: 0.5, silence_threshold: 0.2 } }
        - name: "none"
          description: "NeMo's bypass: thresholds of 0.5, no padding, no filters"
          patch: { turns: { onset: 0.5, offset: 0.5, pad_onset: 0.0, pad_offset: 0.0, min_duration_on: 0.0, min_duration_off: 0.0, filter_speech_first: true } }
        - name: "dihard3"
          description: "NeMo's parameters tuned for streaming Sortformer v2 on DIHARD III dev"
          patch: { turns: { onset: 0.56, offset: 1.0, pad_onset: 0.063, pad_offset: 0.002, min_duration_on: 0.007, min_duration_off: 0.151, filter_speech_first: true } }
        - name: "callhome"
          description: "NeMo's parameters tuned for streaming Sortformer v2 on CALLHOME part 1"
          patch: { turns: { onset: 0.641, offset: 0.561, pad_onset: 0.229, pad_offset: 0.079, min_duration_on: 0.511, min_duration_off: 0.296, filter_speech_first: true } }
      axes:
        - name: "latency"
          description: "how far behind the audio the diarizer runs"
          members: ["ultra-low", "very-low", "low", "offline"]
        - name: "postprocess"
          description: "how speaker activity becomes turns"
          members: ["none", "dihard3", "callhome"]
      default: ["low", "none"]
  - name: "sortformer-v2"
    description: "The streaming Sortformer v2 and v2.1: their model card's streaming latencies, with one frame of left context and three silence slots per speaker"
    presets:
      presets:
        - name: "ultra-low"
          description: "0.32 s: chunks of 3 frames with 1 of look-ahead"
          patch: { streaming: { chunk_len: 3, right_context: 1, left_context: 1, fifo_len: 188, spkcache_len: 188, update_period: 144, silence_frames_per_speaker: 3, pred_score_threshold: 0.25, latest_boost: 0.05, strong_boost_rate: 0.75, weak_boost_rate: 1.5, min_pos_scores_rate: 0.5, silence_threshold: 0.2 } }
        - name: "low"
          description: "1.04 s: chunks of 6 frames with 7 of look-ahead"
          patch: { streaming: { chunk_len: 6, right_context: 7, left_context: 1, fifo_len: 188, spkcache_len: 188, update_period: 144, silence_frames_per_speaker: 3, pred_score_threshold: 0.25, latest_boost: 0.05, strong_boost_rate: 0.75, weak_boost_rate: 1.5, min_pos_scores_rate: 0.5, silence_threshold: 0.2 } }
        - name: "high"
          description: "10 s: chunks of 124 frames with 1 of look-ahead"
          patch: { streaming: { chunk_len: 124, right_context: 1, left_context: 1, fifo_len: 124, spkcache_len: 188, update_period: 124, silence_frames_per_speaker: 3, pred_score_threshold: 0.25, latest_boost: 0.05, strong_boost_rate: 0.75, weak_boost_rate: 1.5, min_pos_scores_rate: 0.5, silence_threshold: 0.2 } }
        - name: "offline"
          description: "30.4 s: chunks of 340 frames with 40 of look-ahead; the most accurate, for files"
          patch: { streaming: { chunk_len: 340, right_context: 40, left_context: 1, fifo_len: 40, spkcache_len: 188, update_period: 300, silence_frames_per_speaker: 3, pred_score_threshold: 0.25, latest_boost: 0.05, strong_boost_rate: 0.75, weak_boost_rate: 1.5, min_pos_scores_rate: 0.5, silence_threshold: 0.2 } }
        - name: "none"
          description: "NeMo's bypass: thresholds of 0.5, no padding, no filters"
          patch: { turns: { onset: 0.5, offset: 0.5, pad_onset: 0.0, pad_offset: 0.0, min_duration_on: 0.0, min_duration_off: 0.0, filter_speech_first: true } }
        - name: "dihard3"
          description: "NeMo's parameters tuned for streaming Sortformer v2 on DIHARD III dev"
          patch: { turns: { onset: 0.56, offset: 1.0, pad_onset: 0.063, pad_offset: 0.002, min_duration_on: 0.007, min_duration_off: 0.151, filter_speech_first: true } }
        - name: "callhome"
          description: "NeMo's parameters tuned for streaming Sortformer v2 on CALLHOME part 1"
          patch: { turns: { onset: 0.641, offset: 0.561, pad_onset: 0.229, pad_offset: 0.079, min_duration_on: 0.511, min_duration_off: 0.296, filter_speech_first: true } }
      axes:
        - name: "latency"
          description: "how far behind the audio the diarizer runs"
          members: ["ultra-low", "low", "high", "offline"]
        - name: "postprocess"
          description: "how speaker activity becomes turns"
          members: ["none", "dihard3", "callhome"]
      default: ["low", "none"]
