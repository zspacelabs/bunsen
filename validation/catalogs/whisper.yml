families:
  - name: "multilingual"
    description: "The multilingual checkpoints that translate: transcribe in the speech's own language, or translate to English"
    presets:
      presets:
        - name: "transcribe"
          description: "emit the speech in its own language"
          patch: { task: "Transcribe" }
        - name: "translate"
          description: "translate the speech to English"
          patch: { task: "Translate" }
      axes:
        - name: "task"
          description: "what the model emits: the speech's own language, or English"
          members: ["transcribe", "translate"]
      default: ["transcribe"]
