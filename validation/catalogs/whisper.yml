        description: "39 M parameters, multilingual"
        license: "MIT"
        origin: "https://github.com/openai/whisper/blob/main/whisper/__init__.py"
        prefab: "tiny"
        family: "multilingual"
        bundles: ["openai/tiny.pt", "openai/multilingual.tiktoken"]
