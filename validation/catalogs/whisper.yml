# The whisper kit's pretrained catalog source: `cargo validate catalog` builds it into
# `crates/public/bunsen/src/kits/speech/asr/whisper/pretrained/catalog.json`.
kit: whisper
out: crates/public/bunsen/src/kits/speech/asr/whisper/pretrained/catalog.json
name: "well-known"
description: "the Whisper checkpoints bunsen knows by name"
groups:
  - name: "openai"
    description: "OpenAI's Whisper checkpoints, as `openai-whisper` names and pins them"
    license: "MIT"
    origin: "https://github.com/openai/whisper/blob/main/whisper/__init__.py"
    rows:
      - name: "tiny.en"
        description: "39 M parameters, English-only"
        license: "MIT"
        origin: "https://github.com/openai/whisper/blob/main/whisper/__init__.py"
        prefab: "tiny.en"
        bundles: ["openai/tiny.en.pt", "openai/gpt2.tiktoken"]
