# The laya kit's pretrained catalog source: `cargo validate catalog` builds it into
# `crates/public/bunsen/src/kits/decision/laya/pretrained/catalog.json`.
#
# The three checkpoints share one repo: the English model at its root, the multilingual
# and typed-decisions models in their own folders, each with its encoder's config, its
# head's `rl_agent_config.json` and its tokenizer beside it.
kit: laya
out: crates/public/bunsen/src/kits/decision/laya/pretrained/catalog.json
name: "well-known"
description: "the Laya decision models bunsen knows by name"
groups:
  - name: "laya"
    description: "convaiinnovations' Laya decision models: a ModernBERT encoder and a decision head"
    license: "Apache-2.0"
    origin: "https://huggingface.co/convaiinnovations/laya"
    rows:
      - name: "laya"
        aliases: ["laya-en"]
        description: "Laya, English: ModernBERT-large (28 layers, 1024 wide), 421M parameters, prompts of 512 tokens"
        license: "Apache-2.0"
        origin: "https://huggingface.co/convaiinnovations/laya"
        bundles: ["laya/laya"]
      - name: "laya-multilingual"
        description: "Laya, multilingual: mmBERT-base (22 layers, 768 wide, a 256k vocabulary), 322M parameters, prompts of 1024 tokens"
        license: "Apache-2.0"
        origin: "https://huggingface.co/convaiinnovations/laya"
        bundles: ["laya/laya-multilingual"]
      - name: "laya-typed-decisions"
        description: "Laya, typed decisions: the English model trained on typed questions, prompts of 1024 tokens"
        license: "Apache-2.0"
        origin: "https://huggingface.co/convaiinnovations/laya"
        bundles: ["laya/laya-typed-decisions"]
bundles:
  - name: "laya/laya"
    description: "Laya, English: model.safetensors, its encoder's config, its head's config, its tokenizer"
    license: "Apache-2.0"
    origin: "https://huggingface.co/convaiinnovations/laya"
    namespace: "laya"
    hub: { repo: "convaiinnovations/laya", revision: "7b928d828b7b0e022f929d9bd2e44165aa270148" }
    resources:
      - { key: "checkpoint", file: "model.safetensors", kind: "safetensors", dtype: "float16" }
      - { key: "encoder_config", file: "encoder/config.json", kind: "json" }
      - { key: "agent_config", file: "rl_agent_config.json", kind: "json" }
      - { key: "tokenizer", file: "tokenizer/tokenizer.json", kind: "tokenizer.json" }
      - { key: "tokenizer_config", file: "tokenizer/tokenizer_config.json", kind: "tokenizer_config.json" }
  - name: "laya/laya-multilingual"
    description: "Laya, multilingual: multilingual/model.safetensors, its encoder's config, its head's config, its tokenizer"
    license: "Apache-2.0"
    origin: "https://huggingface.co/convaiinnovations/laya"
    namespace: "laya"
    hub: { repo: "convaiinnovations/laya", revision: "7b928d828b7b0e022f929d9bd2e44165aa270148" }
    resources:
      - { key: "checkpoint", file: "multilingual/model.safetensors", kind: "safetensors", dtype: "float16" }
      - { key: "encoder_config", file: "multilingual/encoder/config.json", kind: "json" }
      - { key: "agent_config", file: "multilingual/rl_agent_config.json", kind: "json" }
      - { key: "tokenizer", file: "multilingual/tokenizer/tokenizer.json", kind: "tokenizer.json" }
      - { key: "tokenizer_config", file: "multilingual/tokenizer/tokenizer_config.json", kind: "tokenizer_config.json" }
  - name: "laya/laya-typed-decisions"
    description: "Laya, typed decisions: typed-decisions/model.safetensors, its encoder's config, its head's config, its tokenizer"
    license: "Apache-2.0"
    origin: "https://huggingface.co/convaiinnovations/laya"
    namespace: "laya"
    hub: { repo: "convaiinnovations/laya", revision: "7b928d828b7b0e022f929d9bd2e44165aa270148" }
    resources:
      - { key: "checkpoint", file: "typed-decisions/model.safetensors", kind: "safetensors", dtype: "float16" }
      - { key: "encoder_config", file: "typed-decisions/encoder/config.json", kind: "json" }
      - { key: "agent_config", file: "typed-decisions/rl_agent_config.json", kind: "json" }
      - { key: "tokenizer", file: "typed-decisions/tokenizer/tokenizer.json", kind: "tokenizer.json" }
      - { key: "tokenizer_config", file: "typed-decisions/tokenizer/tokenizer_config.json", kind: "tokenizer_config.json" }
