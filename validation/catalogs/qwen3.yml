families:
  - name: "hybrid"
    description: "The Qwen3 chat models that think or answer at once, as the chat template's `enable_thinking` says"
    presets:
      presets:
        - name: "thinking"
          description: "think before answering, under the card's thinking sampling (the checkpoint's generation_config.json)"
          patch: { generation: { template_kwargs: { enable_thinking: true } } }
        - name: "no-thinking"
          description: "answer at once, under the card's non-thinking sampling: temperature 0.7, top-p 0.8, top-k 20, min-p 0"
          patch: { generation: { template_kwargs: { enable_thinking: false }, sampling: { temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0 } } }
      axes:
        - name: "thinking-mode"
          description: "whether the model thinks before it answers"
          members: ["thinking", "no-thinking"]
      default: ["thinking"]
