# The nanochat kit's pretrained catalog source: `cargo validate catalog` builds it into
# `crates/public/bunsen/src/kits/gpts/nanochat/pretrained/catalog.json`.
kit: nanochat
out: crates/public/bunsen/src/kits/gpts/nanochat/pretrained/catalog.json
name: "well-known"
description: "the nanochat checkpoints bunsen knows by name"
groups:
  - name: "nanochat-students"
    description: "nanochat-students' d20 run of upstream nanochat's 2025 model: base, mid and RL"
    license: "Apache-2.0"
    origin: "https://huggingface.co/nanochat-students"
    rows:
      - name: "base-d20"
        aliases: ["nanochat-d20-base"]
        description: "nanochat-students' d20 after pretraining (step 21400): upstream's 2025 model, 561M, base"
        license: "Apache-2.0"
        origin: "https://huggingface.co/nanochat-students/base-d20"
        prefab: "nanochat-d20"
        bundles: ["nanochat-students/base-d20"]
      - name: "mid-d20"
        aliases: ["nanochat-d20-mid"]
        description: "nanochat-students' d20 after midtraining (step 765): upstream's 2025 model, 561M, chat format"
        license: "Apache-2.0"
        origin: "https://huggingface.co/nanochat-students/mid-d20"
        prefab: "nanochat-d20"
        bundles: ["nanochat-students/mid-d20"]
      - name: "rl-d20"
        aliases: ["nanochat-d20-rl"]
        description: "nanochat-students' d20 after its RL stage (step 650): upstream's 2025 model, 561M, chat"
        license: "Apache-2.0"
        origin: "https://huggingface.co/nanochat-students/rl-d20"
        prefab: "nanochat-d20"
        bundles: ["nanochat-students/rl-d20"]
  - name: "nitishpandey04"
    description: "nitishpandey04's d18 run of upstream nanochat's 2026 model: base and SFT"
    license: "MIT"
    origin: "https://huggingface.co/nitishpandey04"
    rows:
      - name: "nanochat-d18-base"
        description: "nitishpandey04's d18 after pretraining (step 3712): upstream's 2026 model, 702M, base"
        license: "MIT"
        origin: "https://huggingface.co/nitishpandey04/nanochat-d18-base"
        prefab: "nanochat-d18-2026"
        bundles: ["nitishpandey04/nanochat-d18-base"]
      - name: "nanochat-d18-sft"
        description: "nitishpandey04's d18 after SFT (step 478): upstream's 2026 model, 702M, chat"
        license: "MIT"
        origin: "https://huggingface.co/nitishpandey04/nanochat-d18-sft"
        prefab: "nanochat-d18-2026"
        bundles: ["nitishpandey04/nanochat-d18-sft"]
bundles:
  - name: "nanochat-students/base-d20"
    description: "nanochat-students' d20 after pretraining (step 21400): upstream's 2025 model, 561M, base: model_*.pt, meta, tokenizer"
    license: "Apache-2.0"
    origin: "https://huggingface.co/nanochat-students/base-d20"
    namespace: "nanochat-students"
    hub: { repo: "nanochat-students/base-d20", revision: "4c6e4e8d8468a6b66302a472cb950bb73a1e2a61" }
    resources:
      - { key: "checkpoint", file: "model_021400.pt", kind: "pytorch" }
      - { key: "meta", file: "meta_021400.json", kind: "nanochat-meta.json" }
      - { key: "tokenizer", file: "tokenizer.pkl", kind: "tiktoken-pickle" }
      - { key: "token_bytes", file: "token_bytes.pt", kind: "pytorch" }
  - name: "nanochat-students/mid-d20"
    description: "nanochat-students' d20 after midtraining (step 765): upstream's 2025 model, 561M, chat format: model_*.pt, meta, tokenizer"
    license: "Apache-2.0"
    origin: "https://huggingface.co/nanochat-students/mid-d20"
    namespace: "nanochat-students"
    hub: { repo: "nanochat-students/mid-d20", revision: "8db9593636d2b4dd8546cb211f3586f90da49269" }
    resources:
      - { key: "checkpoint", file: "model_000765.pt", kind: "pytorch" }
      - { key: "meta", file: "meta_000765.json", kind: "nanochat-meta.json" }
      - { key: "tokenizer", file: "tokenizer.pkl", kind: "tiktoken-pickle" }
      - { key: "token_bytes", file: "token_bytes.pt", kind: "pytorch" }
  - name: "nanochat-students/rl-d20"
    description: "nanochat-students' d20 after its RL stage (step 650): upstream's 2025 model, 561M, chat: model_*.pt, meta, tokenizer"
    license: "Apache-2.0"
    origin: "https://huggingface.co/nanochat-students/rl-d20"
    namespace: "nanochat-students"
    hub: { repo: "nanochat-students/rl-d20", revision: "22fbb6a82b381a7b0b4f04f3bc5f3580a996745e" }
    resources:
      - { key: "checkpoint", file: "model_000650.pt", kind: "pytorch" }
      - { key: "meta", file: "meta_000650.json", kind: "nanochat-meta.json" }
      - { key: "tokenizer", file: "tokenizer.pkl", kind: "tiktoken-pickle" }
      - { key: "token_bytes", file: "token_bytes.pt", kind: "pytorch" }
  - name: "nitishpandey04/nanochat-d18-base"
    description: "nitishpandey04's d18 after pretraining (step 3712): upstream's 2026 model, 702M, base: model_*.pt, meta, tokenizer"
    license: "MIT"
    origin: "https://huggingface.co/nitishpandey04/nanochat-d18-base"
    namespace: "nitishpandey04"
    hub: { repo: "nitishpandey04/nanochat-d18-base", revision: "bd4999f3186942207bac6b4b41ff743381e5fc8b" }
    resources:
      - { key: "checkpoint", file: "base_checkpoints/d18/model_003712.pt", kind: "pytorch" }
      - { key: "meta", file: "base_checkpoints/d18/meta_003712.json", kind: "nanochat-meta.json" }
      - { key: "tokenizer", file: "tokenizer/tokenizer.pkl", kind: "tiktoken-pickle" }
      - { key: "token_bytes", file: "tokenizer/token_bytes.pt", kind: "pytorch" }
  - name: "nitishpandey04/nanochat-d18-sft"
    description: "nitishpandey04's d18 after SFT (step 478): upstream's 2026 model, 702M, chat: model_*.pt, meta, tokenizer"
    license: "MIT"
    origin: "https://huggingface.co/nitishpandey04/nanochat-d18-sft"
    namespace: "nitishpandey04"
    hub: { repo: "nitishpandey04/nanochat-d18-sft", revision: "e2c7c119fee2a0caf6a0c69704ccbe57bad87e63" }
    resources:
      - { key: "checkpoint", file: "chatsft_checkpoints/d18/model_000478.pt", kind: "pytorch" }
      - { key: "meta", file: "chatsft_checkpoints/d18/meta_000478.json", kind: "nanochat-meta.json" }
      - { key: "tokenizer", file: "tokenizer/tokenizer.pkl", kind: "tiktoken-pickle" }
      - { key: "token_bytes", file: "tokenizer/token_bytes.pt", kind: "pytorch" }
