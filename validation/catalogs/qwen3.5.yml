# The qwen3.5 kit's pretrained catalog source: `cargo validate catalog` builds it into
# `crates/public/bunsen/src/kits/language/qwen3_5/pretrained/catalog.json`.
#
# The dense repos carry no `generation_config.json` (but the 27B's): a row's
# stop tokens come from its `tokenizer_config.json` (its `eos_token`, and a
# chat row's `<|endoftext|>`), and a chat row's sampling from its family's
# presets, as the model card recommends.
#
# Two families, by what the checkpoint's own template does without
# `enable_thinking`: the 4B, 9B and 27B think first (`qwen3.5`, "Qwen3.5
# models operate in thinking mode by default"), the 0.8B and 2B answer at
# once (`qwen3.5-small`, "Qwen3.5-0.8B operates in non-thinking mode by
# default"). Each family's default preset is what its template does unset.
kit: qwen3.5
out: crates/public/bunsen/src/kits/language/qwen3_5/pretrained/catalog.json
name: "well-known"
description: "the Qwen3.5 checkpoints bunsen knows by name"
groups:
  - name: "qwen"
    description: "Qwen's dense Qwen3.5 language models (their text models), as transformers ships them"
    license: "Apache-2.0"
    origin: "https://huggingface.co/Qwen"
    rows:
      - name: "qwen3.5-0.8b"
        description: "Qwen3.5-0.8B: thinking and non-thinking chat (its text model)"
        license: "Apache-2.0"
        origin: "https://huggingface.co/Qwen/Qwen3.5-0.8B"
        prefab: "qwen3.5-0.8b"
        bundles: ["qwen/qwen3.5-0.8b"]
        family: "qwen3.5-small"
        probe:
          - { probe: "tokenizer_config", file: "tokenizer_config", into: ["base"] }
          - { probe: "tokenizer_config", file: "tokenizer_config", token: "<|endoftext|>", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
          - { probe: "chat_template", file: "chat_template", into: ["base"] }
      - name: "qwen3.5-0.8b-base"
        description: "Qwen3.5-0.8B-Base: the pretrained model, no chat tuning (its text model)"
        license: "Apache-2.0"
        origin: "https://huggingface.co/Qwen/Qwen3.5-0.8B-Base"
        prefab: "qwen3.5-0.8b"
        bundles: ["qwen/qwen3.5-0.8b-base"]
        probe:
          - { probe: "tokenizer_config", file: "tokenizer_config", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
      - name: "qwen3.5-2b"
        description: "Qwen3.5-2B: thinking and non-thinking chat (its text model)"
        license: "Apache-2.0"
        origin: "https://huggingface.co/Qwen/Qwen3.5-2B"
        prefab: "qwen3.5-2b"
        bundles: ["qwen/qwen3.5-2b"]
        family: "qwen3.5-small"
        probe:
          - { probe: "tokenizer_config", file: "tokenizer_config", into: ["base"] }
          - { probe: "tokenizer_config", file: "tokenizer_config", token: "<|endoftext|>", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
          - { probe: "chat_template", file: "chat_template", into: ["base"] }
      - name: "qwen3.5-2b-base"
        description: "Qwen3.5-2B-Base: the pretrained model, no chat tuning (its text model)"
        license: "Apache-2.0"
        origin: "https://huggingface.co/Qwen/Qwen3.5-2B-Base"
        prefab: "qwen3.5-2b"
        bundles: ["qwen/qwen3.5-2b-base"]
        probe:
          - { probe: "tokenizer_config", file: "tokenizer_config", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
      - name: "qwen3.5-4b"
        description: "Qwen3.5-4B: thinking and non-thinking chat (its text model)"
        license: "Apache-2.0"
        origin: "https://huggingface.co/Qwen/Qwen3.5-4B"
        prefab: "qwen3.5-4b"
        bundles: ["qwen/qwen3.5-4b"]
        family: "qwen3.5"
        probe:
          - { probe: "tokenizer_config", file: "tokenizer_config", into: ["base"] }
          - { probe: "tokenizer_config", file: "tokenizer_config", token: "<|endoftext|>", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
          - { probe: "chat_template", file: "chat_template", into: ["base"] }
      - name: "qwen3.5-4b-base"
        description: "Qwen3.5-4B-Base: the pretrained model, no chat tuning (its text model)"
        license: "Apache-2.0"
        origin: "https://huggingface.co/Qwen/Qwen3.5-4B-Base"
        prefab: "qwen3.5-4b"
        bundles: ["qwen/qwen3.5-4b-base"]
        probe:
          - { probe: "tokenizer_config", file: "tokenizer_config", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
      - name: "qwen3.5-9b"
        description: "Qwen3.5-9B: thinking and non-thinking chat (its text model)"
        license: "Apache-2.0"
        origin: "https://huggingface.co/Qwen/Qwen3.5-9B"
        prefab: "qwen3.5-9b"
        bundles: ["qwen/qwen3.5-9b"]
        family: "qwen3.5"
        probe:
          - { probe: "tokenizer_config", file: "tokenizer_config", into: ["base"] }
          - { probe: "tokenizer_config", file: "tokenizer_config", token: "<|endoftext|>", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
          - { probe: "chat_template", file: "chat_template", into: ["base"] }
      - name: "qwen3.5-9b-base"
        description: "Qwen3.5-9B-Base: the pretrained model, no chat tuning (its text model)"
        license: "Apache-2.0"
        origin: "https://huggingface.co/Qwen/Qwen3.5-9B-Base"
        prefab: "qwen3.5-9b"
        bundles: ["qwen/qwen3.5-9b-base"]
        probe:
          - { probe: "tokenizer_config", file: "tokenizer_config", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
      - name: "qwen3.5-27b"
        description: "Qwen3.5-27B: thinking and non-thinking chat (its text model); 54 GB in bf16, more than a card holds"
        license: "Apache-2.0"
        origin: "https://huggingface.co/Qwen/Qwen3.5-27B"
        prefab: "qwen3.5-27b"
        bundles: ["qwen/qwen3.5-27b"]
        family: "qwen3.5"
        probe:
          - { probe: "generation_config", file: "generation_config", into: ["base"] }
          - { probe: "tokenizer_config", file: "tokenizer_config", into: ["base"] }
          - { probe: "tokenizer_config", file: "tokenizer_config", token: "<|endoftext|>", into: ["base"] }
          - { probe: "chat_template", file: "tokenizer_config", into: ["base"] }
          - { probe: "chat_template", file: "chat_template", into: ["base"] }
families:
  - name: "qwen3.5"
    description: "The Qwen3.5 chat models that think before answering unless the chat template's `enable_thinking` is false: the 4B and up"
    presets:
      presets:
        - name: "thinking"
          description: "think before answering, under the card's thinking sampling for text: temperature 1.0, top-p 0.95, top-k 20, min-p 0 (its presence penalty of 1.5 is not one of bunsen's knobs)"
          patch: { generation: { template_kwargs: { enable_thinking: true }, sampling: { temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0 } } }
        - name: "no-thinking"
          description: "answer at once, under the card's non-thinking sampling for text: temperature 1.0, top-p 1.0, top-k 20, min-p 0 (its presence penalty of 2.0 is not one of bunsen's knobs)"
          patch: { generation: { template_kwargs: { enable_thinking: false }, sampling: { temperature: 1.0, top_p: 1.0, top_k: 20, min_p: 0.0 } } }
      axes:
        - name: "thinking-mode"
          description: "whether the model thinks before it answers"
          members: ["thinking", "no-thinking"]
      default: ["thinking"]
  - name: "qwen3.5-small"
    description: "The small Qwen3.5 chat models, which answer at once unless the chat template's `enable_thinking` is true: the 0.8B and 2B"
    presets:
      presets:
        - name: "thinking"
          description: "think before answering, under the card's thinking sampling for text: temperature 1.0, top-p 0.95, top-k 20, min-p 0 (its presence penalty of 1.5 is not one of bunsen's knobs)"
          patch: { generation: { template_kwargs: { enable_thinking: true }, sampling: { temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0 } } }
        - name: "no-thinking"
          description: "answer at once, under the card's non-thinking sampling for text: temperature 1.0, top-p 1.0, top-k 20, min-p 0 (its presence penalty of 2.0 is not one of bunsen's knobs)"
          patch: { generation: { template_kwargs: { enable_thinking: false }, sampling: { temperature: 1.0, top_p: 1.0, top_k: 20, min_p: 0.0 } } }
      axes:
        - name: "thinking-mode"
          description: "whether the model thinks before it answers"
          members: ["thinking", "no-thinking"]
      default: ["no-thinking"]
