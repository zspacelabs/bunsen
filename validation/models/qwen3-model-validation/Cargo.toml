[package]
name = "qwen3-model-validation"
description = "Validates bunsen's Qwen3 against pretrained references: an ONNX export, onnxruntime's run of it, and transformers. Fetches its model assets; hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Compile the tests against Qwen's checkpoints. Each fetches what it reads
## at run time, through bunsen's pinned rows, into the weights cache
## (`BUNSEN_CACHE_DIR`, or the user's cache directory): a model's files are
## fetched once, when a test of it first runs, and shared with everything
## else that loads it through bunsen.
##
## **Off by default**, so a plain `cargo test` here reaches no network.
## Which models' tests run is the profile's (`validation/models.yml`,
## `cargo validate`); this only compiles them.
checkpoints = ["bunsen/fetch"]

## Fetch `onnx-community/Qwen3-0.6B-ONNX`'s export and generate the reference
## model from it, at build time (`bind-qwen3-onnx/onnx_gen`, 2.4 GB), and
## compile the tests against it.
reference = ["dep:bind-qwen3-onnx", "bind-qwen3-onnx/onnx_gen"]

## Compile the `checkpoints` tests that run a model on a backend.
##
## **Off by default**, and orthogonal to the backend features: this selects
## *whether* those tests are built, a backend feature selects *which*
## accelerator runs them, and both are passed.
gpu-tests = []

## Run the cross-check on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the cross-check on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the cross-check on CUDA.
cuda = ["bunsen/cuda"]

## Run the cross-check on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../../crates/public/bunsen", features = ["testing", "cache"] }
# The chat driver, without the binary's audio capture and publish targets.
bunsen-tool = { path = "../../../crates/public/bunsen-tool", default-features = false }
bind-qwen3-onnx = {
    path = "../../onnx/bind-qwen3-onnx",
    optional = true
}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
