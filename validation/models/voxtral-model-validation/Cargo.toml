[package]
name = "voxtral-model-validation"
description = "Validates bunsen's Voxtral Realtime against pretrained references: an ONNX export, onnxruntime's run of it, and transformers. Fetches its model assets; hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Compile the tests against Mistral's `Voxtral-Mini-4B-Realtime-2602`.
## Each fetches what it reads at run time, through bunsen's pinned row, into
## the weights cache (`BUNSEN_CACHE_DIR`, or the user's cache directory),
## shared with everything else that loads it through bunsen; the vocabulary
## test fetches `tekken.json` alone.
##
## **Off by default**, so a plain `cargo test` here reaches no network.
## Which models' tests run is the profile's (`validation/models.yml`,
## `tools/validate.py`); this only compiles them.
checkpoints = ["bunsen/fetch"]

## Fetch `onnx-community/Voxtral-Mini-4B-Realtime-2602-ONNX`'s fp32 export
## (19.4 GB) and generate the reference models from it, at build time
## (`bind-voxtral-onnx/onnx_gen`), and compile the tests against them.
reference = ["dep:bind-voxtral-onnx", "bind-voxtral-onnx/onnx_gen"]

## Compile the `checkpoints` and `reference` tests that run a model on a
## backend.
##
## **Off by default**, and orthogonal to the backend features: this selects
## *whether* those tests are built, a backend feature selects *which*
## accelerator runs them, and both are passed.
gpu-tests = []

## Run the cross-check on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the cross-check on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the cross-check on CUDA.
cuda = ["bunsen/cuda"]

## Run the cross-check on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../../crates/public/bunsen", features = ["testing", "cache"] }
bunsen-test-audio = { path = "../../../crates/dev/bunsen-test-audio" }
bind-voxtral-onnx = {
    path = "../../onnx/bind-voxtral-onnx",
    optional = true
}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
