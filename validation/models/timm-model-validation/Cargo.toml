[package]
name = "timm-model-validation"
description = "Validates bunsen's timm image families (ResNet, ViT) against timm itself, on ImageNet's validation images pulled at run time. Fetches its model assets and the images; hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Compile the tests and the fixture plan against the pretrained checkpoints
## and ImageNet's validation shard (`timm/imagenet-1k-validation`, gated:
## the Hub token of an account that has accepted ImageNet's terms). Each is
## fetched at run time, through bunsen's pinned rows, into the weights cache
## (`BUNSEN_CACHE_DIR`, or the user's cache directory).
##
## **Off by default**, so a plain `cargo test` here reaches no network.
## Which models' tests run is the profile's (`validation/models.yml`,
## `cargo validate`); this only compiles them.
checkpoints = ["bunsen/fetch"]

## Compile the `checkpoints` tests that run a model on a backend.
##
## **Off by default**, and orthogonal to the backend features: this selects
## *whether* those tests are built, a backend feature selects *which*
## accelerator runs them, and both are passed.
gpu-tests = []

## Run the checks on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the checks on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the checks on CUDA.
cuda = ["bunsen/cuda"]

## Run the checks on Metal.
metal = ["bunsen/metal"]

[[bin]]
name = "timm-fixture-plan"
required-features = ["checkpoints"]

[dependencies]
burn = { workspace = true }
# `images`: decoding the validation images; `cache`: the weights cache.
bunsen = { path = "../../../crates/public/bunsen", features = ["testing", "cache", "images"] }
safetensors = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
