[package]
name = "parakeet-model-validation"
description = "Validates bunsen's Parakeet TDT against pretrained references: an ONNX export, and onnxruntime's own run of it. Fetches its model assets; hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Compile the tests against the checkpoints (NVIDIA's
## `parakeet-tdt-0.6b-v3`, `FermionResearch`'s Phonon-2). Each fetches what
## it reads at run time, through bunsen's pinned rows, into the weights cache
## (`BUNSEN_CACHE_DIR`, or the user's cache directory), shared with
## everything else that loads them through bunsen.
##
## **Off by default**, so a plain `cargo test` here reaches no network.
## Which models' tests run is the profile's (`validation/models.yml`,
## `cargo validate`); this only compiles them.
checkpoints = ["bunsen/fetch", "bunsen/fermion"]

## Fetch the `istupakov/parakeet-tdt-0.6b-v3-onnx` export and generate the
## reference models from it, at build time (`bind-parakeet-onnx/onnx_gen`,
## 2.5 GB), and compile the tests against them.
reference = ["dep:bind-parakeet-onnx", "bind-parakeet-onnx/onnx_gen"]

## Compile the `checkpoints` and `reference` tests that run a model on a
## backend.
##
## **Off by default**, and orthogonal to the backend features: this selects
## *whether* those tests are built, a backend feature selects *which*
## accelerator runs them, and both are passed.
gpu-tests = []

## Run the cross-check on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the cross-check on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the cross-check on CUDA.
cuda = ["bunsen/cuda"]

## Run the cross-check on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../../crates/public/bunsen", features = ["testing"] }
bunsen-test-audio = { path = "../../../crates/dev/bunsen-test-audio" }
bind-parakeet-onnx = {
    path = "../../onnx/bind-parakeet-onnx",
    optional = true
}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
