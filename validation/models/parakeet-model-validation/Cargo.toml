[package]
name = "parakeet-model-validation"
description = "Validates bunsen's Parakeet TDT against pretrained references: an ONNX export, and onnxruntime's own run of it. Fetches its model assets; hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Fetch the reference graphs and generate the models from them, and pull in
## the checkpoints compared against them: NVIDIA's `parakeet-tdt-0.6b-v3`,
## whose weights the graphs carry, and `FermionResearch`'s Phonon-2.
##
## **Off by default.** Enabling this makes `bind-parakeet-onnx`'s build
## reach the network on a cold cache (~5 GB), which a plain
## `cargo build --workspace` must never do. Every asset is verified against a
## pinned SHA-256, so a warm build is offline and reproducible.
download = [
    "bunsen/fermion",
    "dep:bind-parakeet-onnx",
    "bind-parakeet-onnx/onnx_gen",
    "bind-parakeet-onnx/checkpoint",
    "bind-parakeet-onnx/base_checkpoint",
]

## Compile every test that loads a model.
##
## **Off by default**, and orthogonal to the backend features: this selects
## *whether* those tests are built, a backend feature selects *which*
## accelerator runs them, and both are passed. Needs `download` too.
gpu-tests = []

## Run the cross-check on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the cross-check on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the cross-check on CUDA.
cuda = ["bunsen/cuda"]

## Run the cross-check on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../../crates/public/bunsen", features = ["testing"] }
bunsen-test-audio = { path = "../../../crates/dev/bunsen-test-audio" }
bind-parakeet-onnx = {
    path = "../../onnx/bind-parakeet-onnx",
    optional = true
}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
