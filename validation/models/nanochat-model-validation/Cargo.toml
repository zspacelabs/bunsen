[package]
name = "nanochat-model-validation"
description = "Validates bunsen's nanochat against upstream nanochat's own decodes of community checkpoints of its 2025 and 2026 models. Fetches its model assets; hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Compile the tests against the community checkpoints (`nanochat-students`'
## d20 base, mid and RL, `nitishpandey04`'s d18 base and SFT). Each fetches
## what it reads at run time, through bunsen's pinned rows, into the weights
## cache (`BUNSEN_CACHE_DIR`, or the user's cache directory), shared with
## everything else that loads them through bunsen.
##
## **Off by default**, so a plain `cargo test` here reaches no network.
## Which models' tests run is the profile's (`validation/models.yml`,
## `cargo validate`); this only compiles them.
checkpoints = ["bunsen/fetch"]

## Compile the `checkpoints` tests that run a model on a backend.
##
## **Off by default**, and orthogonal to the backend features: this selects
## *whether* those tests are built, a backend feature selects *which*
## accelerator runs them, and both are passed.
gpu-tests = []

## Run the checks on `wgpu`, in f32. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the checks on Vulkan, in f32.
vulkan = ["bunsen/vulkan"]

## Run the checks on CUDA: in f32, and in bf16 against upstream's bf16 run.
cuda = ["bunsen/cuda"]

## Run the checks on Metal, in f32.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../../crates/public/bunsen", features = ["testing", "cache"] }
# The chat driver, without the binary's audio capture and publish targets.
bunsen-tool = { path = "../../../crates/public/bunsen-tool", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
