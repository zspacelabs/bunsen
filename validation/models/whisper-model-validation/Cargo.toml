[package]
name = "whisper-model-validation"
description = "Validates bunsen's Whisper against pretrained references: an ONNX export, and openai-whisper's own decode. Fetches its model assets; hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true


[features]
default = []

## Fetch `OpenAI`'s `base.pt` and both `.tiktoken` vocabularies (~150 MB) at
## build time, through `bind-whisper-onnx`, and compile the checks that
## need only them: the kit's pretrained pathway on real files (`bundled`).
## They load at most one model, so they run on the CPU.
##
## **Off by default.** The assets arrive as `bind-whisper-onnx`'s
## directory, laid out as bunsen's pretrained cache; `weights_cache()` roots
## the cache there, offline, so routing them through the library's own cache
## is also what this crate is validating.
weights = [
    "dep:bind-whisper-onnx",
    "bind-whisper-onnx/checkpoint",
    "bind-whisper-onnx/vocab",
]

## `weights`, and fetch `openai/whisper-base`'s `model.safetensors`
## (~290 MB), and compile the check of the kit's `transformers` loader on
## it against `base.pt` (`bundled::hf`). It loads two models on the CPU.
hf-weights = [
    "weights",
    "bind-whisper-onnx/hf_checkpoint",
]

## `hf-weights`, and fetch the reference graphs and generate the models from
## them (~725 MB in all).
##
## **Off by default.** Enabling this makes `bind-whisper-onnx`'s build
## reach the network on a cold cache, which a plain `cargo build --workspace`
## must never do. Every asset is verified against a pinned SHA-256, so a warm
## build is offline and reproducible.
download = [
    "hf-weights",
    "bind-whisper-onnx/onnx_gen",
]

## Compile every test that loads a model.
##
## **Off by default**, and orthogonal to the backend features: this selects
## *whether* those tests are built, a backend feature selects *which*
## accelerator runs them, and both are passed.
##
## Needs `download` too, for the assets they compare. Without it, the suite
## is the fixture-integrity checks, which load no model.
gpu-tests = []

## Run the cross-check on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the cross-check on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the cross-check on CUDA.
cuda = ["bunsen/cuda"]

## Run the cross-check on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../../crates/public/bunsen", features = ["testing", "tokenizer"] }
bunsen-test-audio = { path = "../../../crates/dev/bunsen-test-audio" }
bind-whisper-onnx = {
    path = "../../onnx/bind-whisper-onnx",
    optional = true
}

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

serial_test = { workspace = true }
tempfile = { workspace = true }
