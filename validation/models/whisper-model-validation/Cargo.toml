[package]
name = "whisper-model-validation"
description = "Validates bunsen's Whisper against pretrained references: an ONNX export, and openai-whisper's own decode. Fetches its model assets; hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true


[features]
default = []

## Compile the tests against `OpenAI`'s `base`: each fetches what it reads
## at run time (`base.pt`, a `.tiktoken` vocabulary), through bunsen's pinned
## rows, into the weights cache (`BUNSEN_CACHE_DIR`, or the user's cache
## directory), shared with everything else that loads them through bunsen.
##
## **Off by default**, so a plain `cargo test` here reaches no network.
## Which models' tests run is the profile's (`validation/models.yml`,
## `tools/validate.py`); this only compiles them.
checkpoints = ["bunsen/fetch"]

## Fetch the `onnx-community/whisper-base` export and generate the reference
## models from it, at build time, and the bundle the conversion is
## cross-checked with: `base.pt`, both `.tiktoken` vocabularies and
## `openai/whisper-base`'s `model.safetensors`, laid out by
## `bind-whisper-onnx` as bunsen's pretrained cache (~725 MB in all); and
## compile the tests against them: the reference checks, and the `bundled`
## checks of the kit's pretrained pathway on the bundle's files. Bundling is
## for verification, so it comes in here alone.
reference = [
    "dep:bind-whisper-onnx",
    "bind-whisper-onnx/onnx_gen",
    "bind-whisper-onnx/checkpoint",
    "bind-whisper-onnx/vocab",
    "bind-whisper-onnx/hf_checkpoint",
]

## Compile every test that loads a model.
##
## **Off by default**, and orthogonal to the backend features: this selects
## *whether* those tests are built, a backend feature selects *which*
## accelerator runs them, and both are passed.
##
## Without it, or without `checkpoints`, the suite is the fixture-integrity
## checks, which load no model.
gpu-tests = []

## Run the cross-check on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the cross-check on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the cross-check on CUDA.
cuda = ["bunsen/cuda"]

## Run the cross-check on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../../crates/public/bunsen", features = ["testing", "tokenizer"] }
bunsen-test-audio = { path = "../../../crates/dev/bunsen-test-audio" }
bind-whisper-onnx = {
    path = "../../onnx/bind-whisper-onnx",
    optional = true
}

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

serial_test = { workspace = true }
tempfile = { workspace = true }
