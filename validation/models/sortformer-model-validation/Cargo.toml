[package]
name = "sortformer-model-validation"
description = "Validates bunsen's Sortformer diarization against pretrained references: ONNX exports of Nemotron-3-Diarization and Sortformer v2.1, and onnxruntime's own runs of them. Fetches its model assets; hosts none."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Compile the tests against the checkpoints: NVIDIA's
## `Nemotron-3-Diarization` and streaming Sortformer v2 and v2.1, and the
## speech recognizers diarized transcription is scored with (Phonon-2,
## Phonon-1, Whisper `base`). Each fetches what it reads at run time, through
## bunsen's pinned rows, into the weights cache (`BUNSEN_CACHE_DIR`, or the
## user's cache directory), shared with everything else that loads them
## through bunsen; and the AMI clip they diarize (`bunsen-test-audio/ami`,
## fetched at build time).
##
## **Off by default**, so a plain `cargo test` here reaches no network.
## Which models' tests run is the profile's (`validation/models.yml`,
## `cargo validate`); this only compiles them.
checkpoints = ["bunsen/fetch", "bunsen/fermion", "bunsen-test-audio/ami"]

## Fetch the ONNX exports of `Nemotron-3-Diarization` (`altunenes/parakeet-rs`)
## and of v2.1 (`Scrybl`) and generate the reference models from them, at
## build time (`bind-sortformer-onnx`'s `onnx_gen` and `onnx_gen_v2_1`,
## ~0.9 GB), and compile the tests against them.
reference = [
    "dep:bind-sortformer-onnx",
    "bind-sortformer-onnx/onnx_gen",
    "bind-sortformer-onnx/onnx_gen_v2_1",
]

## Compile the `checkpoints` and `reference` tests that run a model on a
## backend.
##
## **Off by default**, and orthogonal to the backend features: this selects
## *whether* those tests are built, a backend feature selects *which*
## accelerator runs them, and both are passed.
gpu-tests = []

## Run the cross-check on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the cross-check on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the cross-check on CUDA.
cuda = ["bunsen/cuda"]

## Run the cross-check on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../../crates/public/bunsen", features = ["testing", "nemo"] }
bind-sortformer-onnx = {
    path = "../../onnx/bind-sortformer-onnx",
    optional = true
}
bunsen-test-audio = { path = "../../../crates/dev/bunsen-test-audio" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
