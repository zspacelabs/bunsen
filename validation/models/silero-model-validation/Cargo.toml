[package]
name = "silero-model-validation"
description = "Validates bunsen's Silero VAD against the ONNX reference it was transliterated from, and against a committed golden trace."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Fetch upstream's `silero_vad_16k.safetensors` (1.2 MB) at build time, and
## compile the checks that need only it: the kits' recorded probabilities, the
## stream, and the factory's pathway from a bundled cache. Cheap enough for
## the CPU. **Off by default**: a plain build never reaches the network.
weights = [
    "dep:bind-silero-onnx",
    "bind-silero-onnx/checkpoint",
]

## `weights`, and fetch upstream's ONNX graph (2.8 MB) and generate the
## reference model from it. **Off by default**.
download = [
    "weights",
    "bind-silero-onnx/onnx_gen",
]

## Compile the cross-checks, which load the models.
##
## Needs `download` too, for the assets they compare; without both, the crate
## has only the `weights` checks, when `weights` is on.
gpu-tests = []

## Run the validation on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the validation on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the validation on CUDA.
##
## Known to diverge: see the golden test's note.
cuda = ["bunsen/cuda"]

## Run the validation on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../../crates/public/bunsen", features = ["testing", "cache"] }
bind-silero-onnx = { path = "../../onnx/bind-silero-onnx", optional = true }

[dev-dependencies]
bunsen-test-audio = { path = "../../../crates/dev/bunsen-test-audio" }
serde_json = { workspace = true }
serial_test = { workspace = true }
