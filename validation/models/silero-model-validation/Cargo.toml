[package]
name = "silero-model-validation"
description = "Validates bunsen's Silero VAD against the ONNX reference it was transliterated from, and against a committed golden trace."
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

## Compile the checks against upstream's `silero_vad_16k.safetensors`
## (1.2 MB), which they fetch at run time through bunsen's pinned row into
## the weights cache: the kits' recorded probabilities and the stream. Cheap
## enough for the CPU. **Off by default**: a plain `cargo test` here reaches
## no network.
checkpoints = ["bunsen/fetch"]

## Fetch upstream's ONNX graph (2.8 MB) and generate the reference model from
## it, at build time, and the bundle the conversion is cross-checked with
## (`bind-silero-onnx`'s `checkpoint`: the safetensors, laid out as a
## pretrained cache); and compile the tests against them. Bundling is for
## verification, so it comes in here alone. **Off by default**.
reference = [
    "dep:bind-silero-onnx",
    "bind-silero-onnx/onnx_gen",
    "bind-silero-onnx/checkpoint",
]

## Compile the cross-checks, which load the models on a backend. Needs
## `reference` too, for what they compare against.
gpu-tests = []

## Run the validation on `wgpu`. The usual choice.
wgpu = ["bunsen/wgpu"]

## Run the validation on Vulkan.
vulkan = ["bunsen/vulkan"]

## Run the validation on CUDA.
##
## Known to diverge: see the golden test's note.
cuda = ["bunsen/cuda"]

## Run the validation on Metal.
metal = ["bunsen/metal"]

[dependencies]
burn = { workspace = true }
bunsen = { path = "../../../crates/public/bunsen", features = ["testing", "cache"] }
bind-silero-onnx = { path = "../../onnx/bind-silero-onnx", optional = true }

[dev-dependencies]
bunsen-test-audio = { path = "../../../crates/dev/bunsen-test-audio" }
serde_json = { workspace = true }
serial_test = { workspace = true }
