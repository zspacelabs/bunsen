# The resnet kit's builds: a probe-contract source of the built-in catalog. The timm hub rows are
# written by `cargo catalog timm-rows --kit resnet`.
$description: "The ResNet checkpoints bunsen knows by name: torchvision's, and timm's hub repos."
resnet:
  $kind: namespace
  $facet: family
  $description: ResNet ImageNet-1k classifiers.
torchvision:
  $kind: namespace
  $merge: update
  resnet18:
    $kind: build
    $description: TorchVision ResNet-18.
    $license: bsd-3-clause
    $origin: https://github.com/pytorch/vision
    $contract: resnet-classifier
    $join:
      - resnet
    $args:
      geometry:
        activation: Relu
        attention: null
        avg_down: false
        bottleneck_policy: null
        channels:
          - 64
          - 128
          - 256
          - 512
        conv_stem_width: 64
        in_channels: 3
        layers:
          - 2
          - 2
          - 2
          - 2
        normalization:
          Batch:
            epsilon: 0.00001
            momentum: 0.1
            num_features: 0
        num_classes: 1000
        output_stride: 32
        stem_type: Single
        stem_width: 64
      eval_transform:
        channels: 3
        size: [224, 224]
        interpolation: Bilinear
        crop_pct: 0.875
        crop_mode: Center
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
    $resources:
      checkpoint: checkpoint
      labels: /imagenet/synsets-1k
      label_names: /imagenet/lemmas
    checkpoint:
      $kind: resource
      $file: resnet18-f37072fd.pth
      $format: pytorch fp32
      $sha256: f37072fd47e89c5e827621c5baffa7500819f7896bbacec160b1a16c560e07ec
      $dtype: float32
      $sources:
        - $base_url: https://download.pytorch.org/models
