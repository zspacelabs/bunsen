# The qwen3 kit's builds: a probe-contract source of the built-in catalog.
$description: The Qwen3 checkpoints bunsen knows by name.
qwen:
  $kind: namespace
  $merge: update
  qwen3:
    $kind: namespace
    $facet: family
    $description: Qwen's dense Qwen3 language models, as transformers ships them.
    $requires:
    - instruct
    - thinking
    - reasoning
    - language
    - parameters
    hybrid:
      $kind: template_class
      $description: >-
        The Qwen3 chat models that think or answer at once, as the chat template's
        `enable_thinking` says.
      instruct: true
      reasoning: true
      $presets:
        $axes:
          thinking:
            $offers:
            - thinking
            - no-thinking
            $default: thinking
        thinking:
          $description: >-
            think before answering, under the card's thinking sampling (the checkpoint's
            generation_config.json)
          $patch:
            generation:
              template_kwargs:
                enable_thinking: true
        no-thinking:
          $description: "answer at once, under the card's non-thinking sampling: temperature 0.7, top-p 0.8, top-k 20, min-p 0"
          $patch:
            generation:
              template_kwargs:
                enable_thinking: false
              sampling:
                temperature: 0.7
                top_p: 0.8
                top_k: 20
                min_p: 0.0
    qwen3-2507:
      $kind: namespace
      $description: "The Qwen3 2507 updates: one thinking mode each, and a 256K context."
    qwen3guard:
      $kind: namespace
      $description: "Qwen3Guard-Gen: Qwen3 tuned to moderate prompts and responses."
    qwen3-0.6b:
      $kind: build
      $description: "Qwen3-0.6B: thinking and non-thinking chat."
      $license: Apache-2.0
      $origin: https://huggingface.co/Qwen/Qwen3-0.6B
      $template_class: hybrid
      $contract: qwen3-lm
      language:
      - en
      - zh
      - "*"
      parameters: 600000000
      $hub:
        $repo: Qwen/Qwen3-0.6B
        $revision: c1899de289a04d12100db370d81485cdf75e47ca
      $probes:
      - $probe: generation_config
        $resource: generation_config
        $into:
        - $common
      - $probe: chat_template
        $resource: tokenizer_config
        $into:
        - $common
      $resources:
        checkpoint: checkpoint
        config: config
        tokenizer: tokenizer
        tokenizer_config: tokenizer_config
        generation_config: generation_config
      checkpoint:
        $kind: resource
        $file: model.safetensors
        $format: safetensors
      config:
        $kind: resource
        $file: config.json
        $format: json
      tokenizer:
        $kind: resource
        $file: tokenizer.json
        $format: tokenizer.json
      tokenizer_config:
        $kind: resource
        $file: tokenizer_config.json
        $format: tokenizer_config.json
      generation_config:
        $kind: resource
        $file: generation_config.json
        $format: generation_config.json
    qwen3-0.6b-base:
      $kind: build
      $description: "Qwen3-0.6B-Base: the pretrained model, no chat tuning."
      $license: Apache-2.0
      $origin: https://huggingface.co/Qwen/Qwen3-0.6B-Base
      $contract: qwen3-lm
      language:
      - en
      - zh
      - "*"
      instruct: false
      reasoning: false
      parameters: 600000000
      $hub:
        $repo: Qwen/Qwen3-0.6B-Base
        $revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
      $probes:
      - $probe: generation_config
        $resource: generation_config
        $into:
        - $common
      - $probe: chat_template
        $resource: tokenizer_config
        $into:
        - $common
      $resources:
        checkpoint: checkpoint
        config: config
        tokenizer: tokenizer
        tokenizer_config: tokenizer_config
        generation_config: generation_config
      $presets:
        $axes:
          thinking:
            $offers:
            - no-thinking
            $default: no-thinking
        no-thinking:
          $description: "Answer at once: this model doesn't think."
      checkpoint:
        $kind: resource
        $file: model.safetensors
        $format: safetensors
      config:
        $kind: resource
        $file: config.json
        $format: json
