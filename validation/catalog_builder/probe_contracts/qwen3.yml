      $contract: qwen3-lm
      $join:
      - qwen3guard
      language:
      - en
      - zh
      - "*"
      instruct: true
      reasoning: false
      parameters: 8000000000
      $hub:
        $repo: Qwen/Qwen3Guard-Gen-8B
        $revision: 4505cb1a6f1864f21f8b27f7daf1b9a1aab6edbb
      $probes:
      - $probe: generation_config
        $resource: generation_config
        $into:
        - $common
      - $probe: chat_template
        $resource: tokenizer_config
        $into:
        - $common
      $resources:
        checkpoint: checkpoint
        config: config
        tokenizer: tokenizer
        tokenizer_config: tokenizer_config
        generation_config: generation_config
      $presets:
        $axes:
          thinking:
            $offers:
            - no-thinking
            $default: no-thinking
        no-thinking:
          $description: "Answer at once: this model doesn't think."
      checkpoint:
        $kind: resource
        $file: model.safetensors.index.json
        $format: safetensors-index
        $shards:
        - $file: model-00001-of-00005.safetensors
        - $file: model-00002-of-00005.safetensors
        - $file: model-00003-of-00005.safetensors
        - $file: model-00004-of-00005.safetensors
        - $file: model-00005-of-00005.safetensors
      config:
        $kind: resource
        $file: config.json
        $format: json
      tokenizer:
        $kind: resource
        $file: tokenizer.json
        $format: tokenizer.json
      tokenizer_config:
        $kind: resource
        $file: tokenizer_config.json
        $format: tokenizer_config.json
      generation_config:
        $kind: resource
        $file: generation_config.json
        $format: generation_config.json
