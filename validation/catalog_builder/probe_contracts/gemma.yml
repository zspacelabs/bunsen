# The gemma kit's builds: a probe-contract source of the built-in catalog.
$description: The Gemma checkpoints bunsen knows by name.
gemma:
  $kind: namespace
  $merge: update
  gemma:
    $kind: namespace
    $facet: family
    $description: Google's Gemma 1, 2 and 3 text models, from their unsloth/ mirrors.
    $requires:
      - instruct
      - thinking
      - reasoning
      - language
      - parameters
    gemma:
      $kind: template_class
      $description: "Google's Gemma models: a row's own chat template where it has one, else
        bunsen's rendering of Gemma's turn format."
      reasoning: false
      $presets:
        $common:
          generation:
            chat_template: |-
              {{- bos_token -}}
              {%- if messages and messages[0]['role'] == 'system' -%}
              {%- set prefix = messages[0]['content'] | trim ~ '\n\n' -%}
              {%- set turns = messages[1:] -%}
              {%- else -%}
              {%- set prefix = '' -%}
              {%- set turns = messages -%}
              {%- endif -%}
              {%- for message in turns -%}
              {%- set role = 'model' if message['role'] == 'assistant' else message['role'] -%}
              {{- '<start_of_turn>' ~ role ~ '\n' ~ (prefix if loop.first else '') ~ (message['content'] | trim) ~ '<end_of_turn>\n' -}}
              {%- endfor -%}
              {%- if add_generation_prompt -%}
              {{- '<start_of_turn>model\n' -}}
              {%- endif -%}
        $axes:
          thinking:
            $offers:
              - no-thinking
            $default: no-thinking
        no-thinking:
          $description: "Answer at once: this model doesn't think."
    gemma-3-270m:
      $kind: build
      $description: "Gemma 3 270M: the pretrained model."
      $license: Gemma Terms of Use
      $origin: https://huggingface.co/google/gemma-3-270m
      $template_class: gemma
      $contract: gemma-lm
      language:
        - en
        - "*"
      parameters: 270000000
      instruct: false
      $hub:
        $repo: unsloth/gemma-3-270m
        $revision: edcf1fe394ee1168e7c5538afd104cfb1f7947e6
      $probes:
        - $probe: generation_config
          $resource: generation_config
          $into:
            - $common
        - $probe: chat_template
          $resource: tokenizer_config
          $into:
            - $common
      $resources:
        checkpoint: checkpoint
        config: config
        tokenizer: tokenizer
        tokenizer_config: tokenizer_config
        generation_config: generation_config
      checkpoint:
        $kind: resource
        $file: model.safetensors
        $format: safetensors
      config:
        $kind: resource
        $file: config.json
        $format: json
      tokenizer:
        $kind: resource
        $file: tokenizer.json
        $format: tokenizer.json
      tokenizer_config:
        $kind: resource
        $file: tokenizer_config.json
        $format: tokenizer_config.json
      generation_config:
        $kind: resource
        $file: generation_config.json
        $format: generation_config.json
    gemma-3-270m-it:
      $kind: build
      $description: Gemma 3 270M, instruction-tuned.
      $license: Gemma Terms of Use
      $origin: https://huggingface.co/google/gemma-3-270m-it
      $template_class: gemma
      $contract: gemma-lm
      language:
        - en
        - "*"
      parameters: 270000000
      instruct: true
      $hub:
        $repo: unsloth/gemma-3-270m-it
        $revision: 23cf460f6bb16954176b3ddcc8d4f250501458a9
      $probes:
        - $probe: generation_config
          $resource: generation_config
          $into:
            - $common
        - $probe: tokenizer_config
          $resource: tokenizer_config
          $into:
            - $common
          $token: <end_of_turn>
        - $probe: chat_template
          $resource: tokenizer_config
          $into:
            - $common
        - $probe: chat_template
          $resource: chat_template
          $into:
            - $common
      $resources:
        checkpoint: checkpoint
        config: config
        tokenizer: tokenizer
        tokenizer_config: tokenizer_config
        generation_config: generation_config
        chat_template: chat_template
      checkpoint:
        $kind: resource
        $file: model.safetensors
        $format: safetensors
      config:
        $kind: resource
        $file: config.json
        $format: json
      tokenizer:
