        $file: tokenizer.json
        $format: tokenizer.json
      tokenizer_config:
        $kind: resource
        $file: tokenizer_config.json
        $format: tokenizer_config.json
      generation_config:
        $kind: resource
        $file: generation_config.json
        $format: generation_config.json
      chat_template:
        $kind: resource
        $file: chat_template.jinja
        $format: chat_template.jinja
