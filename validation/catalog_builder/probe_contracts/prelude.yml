# The base catalog: the facets, the registered axes and tags, and the
# template-class root. The builder gives it the kits' contracts, as its
# `$contracts`.
$description: "bunsen's vocabulary: the contracts, facets, registered axes and tags, and the template-class root."
publisher:
  $kind: facet
  $description: Who publishes the checkpoints.
family:
  $kind: facet
  $description: A line of related architectures.
thinking:
  $kind: axis
  $axis: bool
  $description: whether the model thinks before it answers.
task:
  $kind: axis
  $axis: categorical
  $description: "what the model emits: the speech's own language, or English."
  $members:
  - transcribe
  - translate
latency:
  $kind: axis
  $axis: categorical
  $description: how far behind the audio the diarizer runs.
  $members:
  - ultra-low
  - very-low
  - low
  - offline
  - high
postprocess:
  $kind: axis
  $axis: categorical
  $description: how speaker activity becomes turns.
  $members:
  - none
  - dihard3
  - callhome
vad-policy:
  $kind: axis
  $axis: categorical
  $description: how speech regions are cut from the VAD's probabilities.
  $members:
  - silero
  - faster-whisper
language:
  $kind: tag
  $type: $languages
  $description: the languages it handles, as BCP 47 tags; "*" for unspecified others.
parameters:
  $kind: tag
  $type: $count
  $description: >-
    the total parameter count, tied weights counted once, as the publisher states
    it.
active_parameters:
  $kind: tag
  $type: $count
  $description: the parameters active per token, for a mixture of experts.
scores:
  $kind: tag
  $type:
    $map: $number
  $description: measured scores, by name.
reasoning:
  $kind: tag
  $type: $bool
  $description: it was trained to reason.
instruct:
  $kind: tag
  $type: $bool
  $description: Tuned to follow instructions; `false` for a pretrained base checkpoint.
translate:
  $kind: tag
  $type: $bool
  $description: it can translate.
template_class_root:
  $kind: template_class
  $description: The root of every template-class chain.
  $required_facets:
  - publisher
  - family
