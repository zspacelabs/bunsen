# The qwen3-asr kit's builds: a probe-contract source of the built-in catalog.
$description: The Qwen3-ASR checkpoints bunsen knows by name.
qwen3-asr:
  $kind: namespace
  $facet: family
  $description: Qwen's Qwen3-ASR speech recognizers.
  $requires:
    - language
    - translate
    - parameters
fermion:
  $kind: namespace
  $merge: update
  phonon-1:
    $kind: build
    $description: "Phonon-1: Qwen3-ASR-0.6B fine-tuned for English, re-packed."
    $license: Apache-2.0
    $origin: https://huggingface.co/FermionResearch/Phonon-1
    $contract: qwen3-asr/stated
    $join:
      - qwen3-asr
    parameters: 800000000
    language:
      - en
    translate: false
    scores:
      wer.en: 6.56
    $args:
      geometry:
        audio:
          conv_channels: 480
          d_ff: 3584
          d_model: 896
          n_heads: 14
          n_layers: 18
          n_mels: 128
          n_window: 50
          n_window_infer: 800
        audio_token: 151676
        text:
          d_ff: 3072
          d_model: 1024
          head_dim: 128
          logits_dtype: F32
          n_heads: 16
          n_kv_heads: 8
          n_layers: 28
          n_vocab: 151936
          rms_eps: 1.0e-6
          rope_theta: 1000000
          softmax_dtype: F32
          tied_head: true
    $hub:
      $repo: FermionResearch/Phonon-1
      $revision: 68f96e309cd19bf5b9b72c0ead80eed92a499eae
    $resources:
      checkpoint: checkpoint
    checkpoint:
      $kind: resource
      $file: phonon-audio6.bps.tar.zst
      $format: phonon archive
  phonon-1-micro:
    $kind: build
    $description: "Phonon-1-Micro: Qwen3-ASR-0.6B fine-tuned for English, re-packed."
    $license: Apache-2.0
