          n_kv_heads: 8
          n_layers: 28
          n_vocab: 151936
          rms_eps: 1.0e-6
          rope_theta: 1000000
          softmax_dtype: F32
          tied_head: true
    $hub:
      $repo: FermionResearch/Phonon-1-Big
      $revision: 74ec0333ac8a5ede5e855489c069ef763bc99edb
