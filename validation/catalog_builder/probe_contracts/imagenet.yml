# ImageNet's class label sets: a probe-contract source of the built-in catalog.
$description: ImageNet's class label sets, as timm ships them.
imagenet:
  $kind: namespace
  $facet: family
  $description: >-
    ImageNet's class labels: each subset's WordNet synsets, in class order, and their lemmas,
    from timm's `timm/data/_info`.
  synsets-1k:
    $kind: resource
    $file: imagenet_synsets.txt
    $format: synsets
    $sha256: 70002b0ff5de60a3a17a82dbfcff291931f96225ddf941ad2e182fc39e183d15
    $sources:
      - $base_url: >-
          https://raw.githubusercontent.com/huggingface/pytorch-image-models/b4f423c19f778672f875e0948f296322c775f24b/timm/data/_info
  synsets-12k:
    $kind: resource
    $file: imagenet12k_synsets.txt
    $format: synsets
    $sha256: f6483e79f18a9b670d43d915ddba40bbcaf82cfc4e92a07bd44057b9d44935f3
    $sources:
      - $base_url: >-
          https://raw.githubusercontent.com/huggingface/pytorch-image-models/b4f423c19f778672f875e0948f296322c775f24b/timm/data/_info
  synsets-21k-goog:
    $kind: resource
    $file: imagenet21k_goog_synsets.txt
    $format: synsets
    $sha256: 66362bdedf36d933382edca5493fc562dcc17128ce36403c9e730a75f48cb2f2
    $sources:
      - $base_url: >-
          https://raw.githubusercontent.com/huggingface/pytorch-image-models/b4f423c19f778672f875e0948f296322c775f24b/timm/data/_info
  synsets-21k-miil:
    $kind: resource
    $file: imagenet21k_miil_synsets.txt
    $format: synsets
    $sha256: cd76d977daaa2f13a4a91fca0f53713f2f29675308d4ce0f0ee0e5b07a3164c6
    $sources:
      - $base_url: >-
          https://raw.githubusercontent.com/huggingface/pytorch-image-models/b4f423c19f778672f875e0948f296322c775f24b/timm/data/_info
  lemmas:
    $kind: resource
    $file: imagenet_synset_to_lemma.txt
    $format: synset-lemmas
    $sha256: 1b8babda187421a4bde0c9c5a197c36f6bdda962f7ca11ffb2813806cbb2178f
    $sources:
      - $base_url: >-
          https://raw.githubusercontent.com/huggingface/pytorch-image-models/b4f423c19f778672f875e0948f296322c775f24b/timm/data/_info
timm:
  $kind: namespace
  $merge: update
  imagenet-1k-validation:
    $kind: build
    $description: >-
      ImageNet-1k's 50,000 validation images, as timm's webdataset mirror shards them: 64 tars of
      `<key>.jpg` and `<key>.cls` (the class index). Gated: the Hub serves them to an account that
      has accepted ImageNet's terms, with its token. Fetched on use; never shipped.
    $license: other
    $origin: https://huggingface.co/datasets/timm/imagenet-1k-wds
    $contract: webdataset-shards
    $join:
      - imagenet
    $hub:
      $repo: timm/imagenet-1k-wds
      $revision: cdf403ce12f01022a0c36e584e588c0b9cebc4af
      $dataset: true
    $resources:
      shards: shards
    shards:
      $kind: resource
      $file: "imagenet1k-validation-{index}.tar"
      $format: webdataset tar
      $index_width: 2
      $count: 64
