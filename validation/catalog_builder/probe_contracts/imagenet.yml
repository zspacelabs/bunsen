# ImageNet's class label sets: a probe-contract source of the built-in catalog.
$description: ImageNet's class label sets, as timm ships them.
imagenet:
  $kind: namespace
  $description: >-
    ImageNet's class labels: each subset's WordNet synsets, in class order, and their lemmas,
    from timm's `timm/data/_info`.
  synsets-1k:
    $kind: resource
    $file: imagenet_synsets.txt
    $format: synsets
    $sha256: 70002b0ff5de60a3a17a82dbfcff291931f96225ddf941ad2e182fc39e183d15
    $sources:
      - $base_url: >-
          https://raw.githubusercontent.com/huggingface/pytorch-image-models/b4f423c19f778672f875e0948f296322c775f24b/timm/data/_info
  lemmas:
    $kind: resource
    $file: imagenet_synset_to_lemma.txt
    $format: synset-lemmas
    $sha256: 1b8babda187421a4bde0c9c5a197c36f6bdda962f7ca11ffb2813806cbb2178f
    $sources:
      - $base_url: >-
          https://raw.githubusercontent.com/huggingface/pytorch-image-models/b4f423c19f778672f875e0948f296322c775f24b/timm/data/_info
