# The silero kit's builds: a probe-contract source of the built-in catalog.
$description: The Silero VAD checkpoints bunsen fetches by name.
silero:
  $kind: namespace
  $merge: update
  silero_vad:
    $kind: namespace
    $facet: family
    $description: snakers4/silero-vad, as upstream publishes it.
    vad-16k:
      $kind: build
      $description: Silero VAD, the 16 kHz model, from upstream's safetensors.
      $license: MIT
      $origin: https://github.com/snakers4/silero-vad
      $contract: silero-vad
      $resources:
        checkpoint: checkpoint
      $presets:
        $axes:
          vad-policy:
            $offers:
            - silero
            - faster-whisper
            $default: silero
        silero:
          $description: "upstream's get_speech_timestamps defaults: regions under 250 ms dropped, 100 ms of silence to close, 30 ms of padding"
          $patch:
            vad:
              min_speech_ms: 250
              min_silence_ms: 100
              speech_pad_ms: 30
        faster-whisper:
          $description: "faster-whisper's VadOptions: no minimum region, 2000 ms of silence to close, 400 ms of padding"
          $patch:
            vad:
              min_speech_ms: 0
              min_silence_ms: 2000
              speech_pad_ms: 400
      checkpoint:
        $kind: resource
        $file: silero_vad_16k.safetensors
        $format: safetensors
        $sha256: c59271c284ae9c8335d795d60e0bfdb71aaaceec578d9bd9ffc1b8153c319ea1
        $dtype: float32
        $sources:
        - $base_url: >-
            https://raw.githubusercontent.com/snakers4/silero-vad/fb7d7c7f5df63235f0afd037d8397593829aeb41/src/silero_vad/data
