# The qwen3.5 kit's builds: a probe-contract source of the built-in catalog.
$description: The Qwen3.5 checkpoints bunsen knows by name.
qwen:
  $kind: namespace
  $merge: update
  qwen3.5:
    $kind: namespace
    $facet: family
    $description: >-
      Qwen's dense Qwen3.5 language models (their text models), as transformers ships
      them.
    $requires:
    - instruct
    - thinking
    - reasoning
    - language
    - parameters
    qwen3.5:
      $kind: template_class
      $description: "The Qwen3.5 chat models that think before answering unless the chat template's `enable_thinking` is false: the 4B and up."
      instruct: true
      reasoning: true
      $presets:
        $axes:
          thinking:
            $offers:
            - thinking
            - no-thinking
            $default: thinking
        thinking:
          $description: "think before answering, under the card's thinking sampling for text: temperature 1.0, top-p 0.95, top-k 20, min-p 0 (its presence penalty of 1.5 is not one of bunsen's knobs)"
          $patch:
            generation:
              template_kwargs:
                enable_thinking: true
              sampling:
                temperature: 1.0
                top_p: 0.95
                top_k: 20
                min_p: 0.0
        no-thinking:
          $description: "answer at once, under the card's non-thinking sampling for text: temperature 1.0, top-p 1.0, top-k 20, min-p 0 (its presence penalty of 2.0 is not one of bunsen's knobs)"
          $patch:
            generation:
              template_kwargs:
                enable_thinking: false
              sampling:
                temperature: 1.0
                top_p: 1.0
                top_k: 20
                min_p: 0.0
    qwen3.5-small:
      $kind: template_class
      $description: "The small Qwen3.5 chat models, which answer at once unless the chat template's `enable_thinking` is true: the 0.8B and 2B."
      instruct: true
      reasoning: true
      $presets:
        $axes:
          thinking:
            $offers:
            - thinking
            - no-thinking
            $default: no-thinking
        thinking:
          $description: "think before answering, under the card's thinking sampling for text: temperature 1.0, top-p 0.95, top-k 20, min-p 0 (its presence penalty of 1.5 is not one of bunsen's knobs)"
          $patch:
            generation:
              template_kwargs:
                enable_thinking: true
              sampling:
                temperature: 1.0
                top_p: 0.95
                top_k: 20
                min_p: 0.0
        no-thinking:
          $description: "answer at once, under the card's non-thinking sampling for text: temperature 1.0, top-p 1.0, top-k 20, min-p 0 (its presence penalty of 2.0 is not one of bunsen's knobs)"
          $patch:
            generation:
              template_kwargs:
                enable_thinking: false
              sampling:
                temperature: 1.0
                top_p: 1.0
                top_k: 20
                min_p: 0.0
    qwen3.5-0.8b:
      $kind: build
      $description: "Qwen3.5-0.8B: thinking and non-thinking chat (its text model)."
      $license: Apache-2.0
      $origin: https://huggingface.co/Qwen/Qwen3.5-0.8B
      $template_class: qwen3.5-small
      $contract: qwen3.5-lm
      language:
      - en
      - zh
      - "*"
      parameters: 800000000
      $hub:
        $repo: Qwen/Qwen3.5-0.8B
        $revision: 2fc06364715b967f1860aea9cf38778875588b17
      $probes:
      - $probe: tokenizer_config
        $resource: tokenizer_config
        $into:
        - $common
      - $probe: tokenizer_config
        $resource: tokenizer_config
        $into:
        - $common
        $token: <|endoftext|>
      - $probe: chat_template
        $resource: tokenizer_config
        $into:
        - $common
      - $probe: chat_template
        $resource: chat_template
        $into:
        - $common
      $resources:
        checkpoint: checkpoint
        config: config
        tokenizer: tokenizer
        tokenizer_config: tokenizer_config
        chat_template: chat_template
      checkpoint:
        $kind: resource
        $file: model.safetensors.index.json
        $format: safetensors-index
        $shards:
        - $file: model.safetensors-00001-of-00001.safetensors
      config:
        $kind: resource
        $file: config.json
        $format: json
      tokenizer:
        $kind: resource
        $file: tokenizer.json
        $format: tokenizer.json
      tokenizer_config:
        $kind: resource
        $file: tokenizer_config.json
        $format: tokenizer_config.json
      chat_template:
        $kind: resource
        $file: chat_template.jinja
        $format: chat_template.jinja
    qwen3.5-0.8b-base:
      $kind: build
      $description: "Qwen3.5-0.8B-Base: the pretrained model, no chat tuning (its text model)."
      $license: Apache-2.0
      $origin: https://huggingface.co/Qwen/Qwen3.5-0.8B-Base
      $contract: qwen3.5-lm
      language:
      - en
      - zh
      - "*"
      instruct: false
      reasoning: false
      parameters: 800000000
      $hub:
        $repo: Qwen/Qwen3.5-0.8B-Base
        $revision: dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68
      $probes:
      - $probe: tokenizer_config
        $resource: tokenizer_config
        $into:
        - $common
      - $probe: chat_template
        $resource: tokenizer_config
        $into:
        - $common
      $resources:
        checkpoint: checkpoint
        config: config
        tokenizer: tokenizer
        tokenizer_config: tokenizer_config
      $presets:
        $axes:
          thinking:
            $offers:
            - no-thinking
            $default: no-thinking
        no-thinking:
          $description: "Answer at once: this model doesn't think."
      checkpoint:
        $kind: resource
        $file: model.safetensors.index.json
        $format: safetensors-index
        $shards:
        - $file: model.safetensors-00001-of-00001.safetensors
      config:
