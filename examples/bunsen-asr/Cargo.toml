[package]
name = "phonon-cli"
description = "Transcribes speech with FermionResearch's Phonon models on bunsen: Phonon-2 (Parakeet TDT) by default, and Phonon-1 (Qwen3-ASR)."
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "phonon"
path = "src/main.rs"

[lints]
workspace = true

[features]
## Make `--device cuda` available.
cuda = ["bunsen-app/cuda"]
## Make `--device metal` available.
metal = ["bunsen-app/metal"]
## Make `--device vulkan` available.
vulkan = ["bunsen-app/vulkan"]
## Make `--device wgpu` available.
wgpu = ["bunsen-app/wgpu"]

[dependencies]
burn = { workspace = true }
# The backend is chosen at run time with `--device`, from those compiled in
# through this crate's backend features; the CPU is always there.
#
# `fermion` reads the Phonon archives; `indicatif` puts bunsen's progress bar
# on every weights transfer.
bunsen = { path = "../../crates/public/bunsen", features = [
    "store_safetensors",
    "audio",
    "fermion",
    "indicatif",
] }
bunsen-app = { path = "../../crates/dev/bunsen-app" }
clap = { workspace = true, features = ["derive"] }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
