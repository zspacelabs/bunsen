[package]
name = "resnet_finetune"
publish = false
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# `--device`.
bunsen-app = { path = "../../crates/dev/bunsen-app" }
burn = { workspace = true, features = ["train", "fusion", "autotune", "network", "vision"] }
bunsen = { path = "../../crates/public/bunsen", features = ["indicatif"] }

anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }

# Dataset files
csv = { workspace = true }
flate2 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
tar = { workspace = true }

[features]
default = ["tui"]
## burn's terminal dashboard for training metrics, when stdout is a terminal.
tui = ["bunsen-app/tui"]
## Make `--device cuda` available.
cuda = ["bunsen-app/cuda"]
## Make `--device metal` available.
metal = ["bunsen-app/metal"]
## Make `--device vulkan` available.
vulkan = ["bunsen-app/vulkan"]
## Make `--device wgpu` available.
wgpu = ["bunsen-app/wgpu"]
