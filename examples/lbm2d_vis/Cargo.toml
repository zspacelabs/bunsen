[package]
name = "lbm2d_vis"
publish = false
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true


[features]
default = ["flex"]
cuda = ["burn/cuda", "clap-common/cuda"]
metal = ["burn/metal", "clap-common/metal"]
vulkan = ["burn/vulkan", "clap-common/vulkan"]
wgpu = ["burn/wgpu", "clap-common/wgpu"]
flex = ["burn/flex"]


[dependencies]
burn = { workspace = true, features = ["fusion"] }
bunsen = { path = "../../crates/public/bunsen" }
# `--device`.
clap-common = { path = "../../crates/dev/clap-common" }

clap = { workspace = true, features = ["derive"] }
indicatif = { workspace = true }
strum = { workspace = true, features = ["derive"] }

piston = { workspace = true }
piston2d-graphics = { workspace = true }
pistoncore-glutin_window = { workspace = true }
piston2d-opengl_graphics = { workspace = true }
gl = { workspace = true }
rand = { workspace = true }
