[package]
name = "whisper-cli"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true


[lints]
workspace = true

[features]
## Make `--device cuda` available.
cuda = ["bunsen-app/cuda"]
## Make `--device metal` available.
metal = ["bunsen-app/metal"]
## Make `--device vulkan` available.
vulkan = ["bunsen-app/vulkan"]
## Make `--device wgpu` available.
wgpu = ["bunsen-app/wgpu"]

[dependencies]
burn = { workspace = true }
# The backend is chosen at run time with `--device`, from those compiled in
# through this crate's backend features (`wgpu`, `vulkan`, `metal`, `cuda`);
# the CPU is always there.
#
# `silero-weights` bundles the VAD the real-time presets need.
# `indicatif` puts bunsen's progress bar on every weights transfer.
bunsen = { path = "../../crates/public/bunsen", features = [
    "store",
    "audio",
    "tokenizer",
    "silero-weights",
    "indicatif",
] }

clap = { workspace = true, features = ["derive"] }
bunsen-app = { path = "../../crates/dev/bunsen-app" }
log = { workspace = true }

# `live`: the microphone through the host's audio API, and Ctrl-C as a
# clean stop. On Linux `cpal` links ALSA: `libasound2-dev`.
cpal = { workspace = true }
ctrlc = { workspace = true }
