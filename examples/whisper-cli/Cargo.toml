[package]
name = "whisper-cli"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true


[lints]
workspace = true

[features]
default = []

## Fetch `openai/base` and both vocabularies at build time, digest-pinned,
## and read them in place: the default model then needs no network at run
## time. Without this they are fetched into bunsen's cache on first use.
bundled = ["bunsen/whisper-weights"]

[dependencies]
burn = { workspace = true, features = ["fusion"] }
# The backend is bunsen's `PerformanceBackend`, chosen by bunsen's own backend
# feature at build time: `--features bunsen/wgpu` (or `bunsen/cuda`,
# `bunsen/metal`, `bunsen/flex`). With none, bunsen's default `testing`
# feature selects `flex`.
#
# `silero-weights` bundles the VAD the real-time presets need.
# `indicatif` puts bunsen's progress bar on every weights transfer.
bunsen = { path = "../../crates/public/bunsen", features = [
    "store",
    "audio",
    "tokenizer",
    "silero-weights",
    "indicatif",
] }

clap = { workspace = true, features = ["derive"] }
clap-common = { path = "../../crates/dev/clap-common" }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
