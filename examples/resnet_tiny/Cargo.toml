[package]
name = "resnet_tiny"
publish = false
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["tui"]
## burn's terminal dashboard for training metrics, when stdout is a terminal.
tui = ["bunsen-app/tui"]
## Make `--device cuda` available.
cuda = ["bunsen-app/cuda"]
## Make `--device metal` available.
metal = ["bunsen-app/metal"]
## Make `--device vulkan` available.
vulkan = ["bunsen-app/vulkan"]
## Make `--device wgpu` available.
wgpu = ["bunsen-app/wgpu"]

[dependencies]
# `--device`.
bunsen-app = { path = "../../crates/dev/bunsen-app" }
burn = { workspace = true, features = ["train", "fusion", "autotune", "vision", "dataset"] }
bunsen = { path = "../../crates/public/bunsen", features = ["indicatif"] }
bunsen-firehose = { path = "../../crates/public/bunsen-firehose" }
bunsen-firehose-image = { path = "../../crates/public/bunsen-firehose-image" }

serde = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive"] }

rand = { workspace = true }

