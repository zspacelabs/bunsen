[package]
name = "conway"
publish = false
edition.workspace = true
rust-version.workspace = true


[lints]
workspace = true


[features]
default = ["flex"]
cuda = ["burn/cuda"]
metal = ["burn/metal"]
vulkan = ["burn/vulkan"]
wgpu = ["burn/wgpu"]
flex = ["burn/flex"]


[dependencies]
burn = { workspace = true, features = ["fusion", "autotune"] }
bunsen = { path = "../../crates/public/bunsen" }

log = { workspace = true }
clap-common = { path = "../../crates/dev/clap-common" }
clap = { workspace = true, features = ["derive"] }

indicatif = { workspace = true }

piston = { workspace = true }
piston2d-graphics = { workspace = true }
pistoncore-glutin_window = { workspace = true }
piston2d-opengl_graphics = { workspace = true }
gl = { workspace = true }

