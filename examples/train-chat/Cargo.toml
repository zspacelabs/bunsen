[package]
name = "train-chat"
rust-version.workspace = true
edition.workspace = true
publish = false

[dependencies]
bunsen-app = { path = "../../crates/dev/bunsen-app" }
bunsen = { path = "../../crates/public/bunsen" }
bunsen-arrow-dataloaders = { path = "../../crates/public/bunsen-arrow-dataloaders" }

num-traits = { workspace = true }
rand = { workspace = true }
clap = { workspace = true, features = ["derive"] }
log = { workspace = true }
wordchipper = { workspace = true, features = ["client"] }
wordchipper-cli-util = { workspace = true }
burn = { workspace = true, features = ["train", "fusion", "autotune"] }

[features]
default = ["tui"]
## burn's terminal dashboard for training metrics, when stdout is a terminal.
tui = ["bunsen-app/tui"]
## Make `--device cuda` available.
cuda = ["bunsen-app/cuda"]
## Make `--device metal` available.
metal = ["bunsen-app/metal"]
## Make `--device vulkan` available.
vulkan = ["bunsen-app/vulkan"]
## Make `--device wgpu` available.
wgpu = ["bunsen-app/wgpu"]

[lints]
workspace = true
