[package]
name = "train-chat"
rust-version.workspace = true
edition.workspace = true
publish = false

[dependencies]
clap-common = { path = "../../crates/dev/clap-common" }
bunsen = { path = "../../crates/public/bunsen" }
bunsen-arrow-dataloaders = { path = "../../crates/public/bunsen-arrow-dataloaders" }

num-traits = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
log = { workspace = true }
wordchipper = { workspace = true, features = ["client"] }
wordchipper-cli-util = { workspace = true }
burn = { workspace = true, features = ["train", "fusion", "autotune"] }

[features]
default = ["tui"]
## burn's terminal dashboard for training metrics, when stdout is a terminal;
## plain text logs otherwise, or without this feature.
tui = ["burn/tui"]
cuda = ["burn/cuda", "clap-common/cuda"]
wgpu = ["burn/wgpu", "clap-common/wgpu"]
metal = ["burn/metal", "clap-common/metal"]
vulkan = ["burn/vulkan", "clap-common/vulkan"]

[lints]
workspace = true
