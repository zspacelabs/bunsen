[package]
name = "swin_tiny"
publish = false
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true


[features]
default = []
wgpu = ["burn/wgpu", "clap-common/wgpu"]
cuda = ["burn/cuda", "clap-common/cuda"]
metal = ["burn/metal", "clap-common/metal"]


[dependencies]
# `--device`.
clap-common = { path = "../../crates/dev/clap-common" }
burn = { workspace = true, features = ["train", "fusion", "autotune", "vision", "dataset", "flex"] }
bunsen = { path = "../../crates/public/bunsen" }
bunsen-firehose = { path = "../../crates/public/bunsen-firehose" }
bunsen-firehose-image = { path = "../../crates/public/bunsen-firehose-image" }

serde = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive"] }
rand = { workspace = true }
anyhow = { workspace = true }
