[workspace]
# Require version 2 to avoid "feature" additiveness for dev-dependencies
# https://doc.rust-lang.org/cargo/reference/resolver.html#feature-resolver-version-2
resolver = "2"

members = [
    "crates/*",
]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
version = "0.21.0"
repository = "https://github.com/zspacelabs/bunsen"
license = "MIT or Apache-2.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
double_must_use = "allow"
doc_markdown = "warn"


[workspace.dependencies]
rand = "0.10.1"
burn = "=0.21.0"

# Burn coupled-dependencies
serde = "1.0.228"
serde_json = "1.0.145"
crc = "3.4.0"
hashbrown = { version = "0.17.0" }

dirs = "6.0.0"
clap = "4.5.51"

anyhow = "1.0.100"
indicatif = "^0.18.3"
nearly = "^0.4.0"

# Build, Test and/or Examples dependencies
hamcrest = "0.1.5"
indoc = "2.0.7"
num-traits = "0.2.19"

# macro dependencies
document-features = "0.2.12"
proc-macro2 = { version = "^1.0.106" }
syn = { version = "2.0.117" }
quote = { version = "^1.0.45" }

# Test and/or Examples dependencies
criterion = { version = "0.8.2" }

paste = "1.0.15"
spanned_error_message = "0.1.0"
thiserror = "2.0.18"
strum = "0.28.0"
xot = "0.31.2"
xee-xpath = "0.1.5"


