[workspace]
# Require version 2 to avoid "feature" additiveness for dev-dependencies
# https://doc.rust-lang.org/cargo/reference/resolver.html#feature-resolver-version-2
resolver = "2"

members = [
    "crates/*",
    "examples/*"
]

[workspace.package]
authors = [
    "Crutcher Dunnavant <crutcher@zspacelabs.ai>",
]
edition = "2024"
rust-version = "1.94.1"
version = "0.22.0"
repository = "https://github.com/zspacelabs/bunsen"
license = "MIT or Apache-2.0"

[workspace.lints.rust]
warnings = "deny"
exported-private-dependencies = "allow"

[workspace.lints.clippy]
double_must_use = "allow"
doc_markdown = "warn"


[workspace.dependencies]
log = { version = "0.4", default-features = false }
wordchipper = { version = "0.9.2" }
wordchipper-cli-util = { version = "0.9.2" }

rand = "0.10.1"
burn = "0.21.0"
burn-store = "0.21.0"

# Burn coupled-dependencies
crc = "3.4.0"
globwalk = "0.9.1"
hashbrown = "0.17.0"
regex = "1.12.2"
regex-macro = "0.3.0"
serde = "1.0.228"
serde_json = "1.0.145"

dirs = "6.0.0"
clap = "4.5.51"
downloader = { version = "0.2.7", default-features = false }
directories-next = "2.0.0"

anyhow = "1.0.100"
indicatif = "^0.18.3"
image = "0.25.10"

derive-new = "0.7.0"
arrow = "58.1.0"
parquet = "58.1.0"

# Build, Test and/or Examples dependencies
hamcrest = "0.1.5"
indoc = "2.0.7"
nearly = "0.4.0"
num-traits = "0.2.19"
tempfile = "3.27.0"

# macro dependencies
document-features = "0.2.12"
inventory = "0.3.24"
paste = "1.0.15"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = "2.0.117"

# Test and/or Examples dependencies
criterion = "0.8.2"
image-compare = "0.5.0"
serial_test = "3.4.0"

spanned_error_message = "0.1.0"
thiserror = "2.0.18"
strum = "0.28.0"
xot = "0.31.2"
xee-xpath = "0.1.5"


# Examples
piston = "^1.0.0"
piston2d-graphics = "^0.45.0"
# moving to 0.73.2 crashes in a way I haven't debugged yet.
pistoncore-glutin_window = "^0.72.0"
piston2d-opengl_graphics = "^0.89.0"
gl = "^0.14.0"

tempdir = "0.3"
shellexpand = "3.1"

# Dataset files
csv = "1.4.0"
flate2 = "1.1.9"
tar = "0.4.46"

